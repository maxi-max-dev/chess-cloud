  coachPreview = {
    id: `coach-${++coachPreviewGen}`,
    you: {
      san: candidate.san,
      from: candidate.from,
      to: candidate.to,
      promotion: candidate.promotion || '',
    },
    reply: candidate.replies[0] ? {
      san: candidate.replies[0].san,
      from: candidate.replies[0].from,
      to: candidate.replies[0].to,
      promotion: candidate.replies[0].promotion || '',
      piece: candidate.replies[0].piece,
    } : null,
  };
  return true;
}

function renderCoachIdle() {
  coachPanelEl.dataset.state = 'idle';
  coachTitleEl.textContent = thinking ? '黑方正在思考' : '先点一枚白棋';
  coachExplainEl.textContent = thinking
    ? '应手画出来后，会告诉你是否落在刚才预演的强回应里'
    : '会依次动画预演“你的一步 → 对手的强回应”，不直接落子';
  coachMovesEl.replaceChildren();
  coachReplyStripEl.replaceChildren();
}

function coachCardHtml(candidate, active) {
  const reply = candidate.replies[0];
  return `<button type="button" class="coach-card${active ? ' is-active' : ''}"`
    + ` aria-pressed="${active}"`
    + ` data-rank="${candidate.rank}" data-san="${esc(candidate.san)}"`
    + ` data-from="${candidate.from}" data-to="${candidate.to}"`
    + ` data-promotion="${candidate.promotion || ''}" data-after="${esc(candidate.after)}"`
    + ` data-score="${candidate.score}" data-situation="${candidate.situation.key}"`
    + ` data-quality="${candidate.quality.key}"`
    + ` data-reply-san="${esc(reply?.san || '')}" data-reply-from="${reply?.from || ''}"`
    + ` data-reply-to="${reply?.to || ''}" data-reply-piece="${reply?.piece || ''}"`
    + ` data-reply-score="${reply?.score ?? ''}">`
    + `<span class="coach-card-top"><span class="coach-san">${esc(candidate.san)}</span>`
    + `<span class="coach-quality">${candidate.quality.label}</span></span>`
    + `<span class="coach-situation" style="--situation-color:${candidate.situation.color}">${candidate.situation.label}</span>`
    + `<span class="coach-reply">${esc(replyDescription(reply))}</span>`
    + `<span class="coach-raw">含对手强回应 · 引擎原分 ${scoreText(candidate.score)}</span>`
    + `</button>`;
}

function renderCoachCandidate(candidate, { rerenderBoard = true } = {}) {
  if (!coachModel || !candidate) return false;
  forkPreview = null;
  setCoachPreview(candidate);
  coachPanelEl.dataset.state = 'ready';
  coachTitleEl.textContent = coachModel.total > 3
    ? `${candidate.from.toUpperCase()} 的${PIECE_NAME[coachModel.piece]}共 ${coachModel.total} 种，先看前三`
    : `${candidate.from.toUpperCase()} 的${PIECE_NAME[coachModel.piece]}：先看 ${candidate.san}`;
  coachExplainEl.textContent = '黄线是你，蓝线是对手；这里的判断已算入对手强回应，不是历史胜率';
  coachMovesEl.innerHTML = coachModel.candidates
    .map((move) => coachCardHtml(move, move.rank === candidate.rank))
    .join('');
  const chips = candidate.replies.map((reply, index) =>
    `<span class="coach-reply-chip" data-rank="${index}" data-san="${esc(reply.san)}"`
      + ` data-from="${reply.from}" data-to="${reply.to}" data-piece="${reply.piece}">`
      + `${index + 1}. ${PIECE_NAME[reply.piece] || '棋子'} ${esc(reply.san)}</span>`
  ).join('');
  coachReplyStripEl.innerHTML =
    `<span>对手的强回应：</span>${chips}`
    + `<button type="button" data-coach-action="play" data-rank="${candidate.rank}">就走 ${esc(candidate.san)}</button>`;
  if (rerenderBoard) renderBoard();
  return true;
}

function updateMoveCoach() {
  if (!selected || thinking || game.turn() !== 'w') {
    coachModel = null;
    renderCoachIdle();
    return false;
  }
  if (forkStale || columns[0]?.fen !== game.fen()) {
    coachModel = null;
    coachPanelEl.dataset.state = 'thinking';
    coachTitleEl.textContent = '新局面的路径正在更新';
    coachExplainEl.textContent = '棋盘已可见，候选会在下一帧接上';
    coachMovesEl.replaceChildren();
    coachReplyStripEl.replaceChildren();
    return false;
  }
  coachOutcome = null;
  coachModel = buildCoachModel(selected);
  if (!coachModel) {
    coachPreview = null;
    coachPanelEl.dataset.state = 'idle';
    coachTitleEl.textContent = `${selected.toUpperCase()} 暂无合法走法`;
    coachExplainEl.textContent = '换一枚白棋试试';
    coachMovesEl.replaceChildren();
    coachReplyStripEl.replaceChildren();
    return false;
  }
  const active = coachModel.candidates.find((move) => move.rank === coachActiveRank)
    || coachModel.candidates[0];
  return renderCoachCandidate(active, { rerenderBoard: false });
}

function captureCoachPrediction(from, to, promotion) {
  const candidate = coachCandidateFromMove(from, to, promotion);
  if (!candidate) return null;
  return {
    fen: game.fen(),
    candidate: {
      san: candidate.san,
      from: candidate.from,
      to: candidate.to,
      promotion: candidate.promotion || '',
      after: candidate.after,
      score: candidate.score,
    },
    replies: repliesFor(candidate).slice(0, 3).map((reply) => ({
      san: reply.san,
      from: reply.from,
      to: reply.to,
      promotion: reply.promotion || '',
      after: reply.after,
      score: reply.score,
      piece: reply.piece,
      captured: reply.captured || '',
    })),
  };
}

function setCoachThinking(move) {
  coachModel = null;
  coachPanelEl.dataset.state = 'thinking';
  coachTitleEl.textContent = `你走了 ${move.san}，正在等黑方`;
  coachExplainEl.textContent = '预演不会冒充结果；实际应手画出来后再对照';
  coachMovesEl.replaceChildren();
  coachReplyStripEl.innerHTML = '<span class="coach-reply-chip">黑方思考中…</span>';
}

function presentCoachTerminal(move, prediction) {
  pendingCoachPrediction = null;
  pendingCoachOutcome = null;
  coachModel = null;
  const score = prediction?.candidate?.score ?? 0;
  const situation = scoreSituation(score);
  coachOutcome = {
    terminal: true,
    score,
    situation,
    fallback: false,
    actualRank: -1,
    forecastRank: -1,
  };
  coachPanelEl.dataset.state = 'outcome';
  coachTitleEl.textContent = `你走了 ${move.san}，棋局结束`;
  coachExplainEl.textContent = describeEnd();
  coachMovesEl.innerHTML =
    `<div class="coach-card is-active" data-outcome="true" data-score="${score}" data-situation="${situation.key}">`
      + `<span class="coach-card-top"><span class="coach-san">${esc(move.san)}</span></span>`
      + `<span class="coach-situation" style="--situation-color:${situation.color}">${situation.label}</span>`
      + `<span class="coach-reply">对手没有下一步</span>`
      + `<span class="coach-raw">引擎原分 ${scoreText(score)}</span>`
      + `</div>`;
  coachReplyStripEl.replaceChildren();
  coachPreview = {
    id: `coach-${++coachPreviewGen}`,
    you: prediction?.candidate || {
      san: move.san,
      from: move.from,
      to: move.to,
      promotion: move.promotion || '',
    },
    reply: null,
  };
  renderBoard();
  return true;
}

function presentCoachOutcome(outcome) {
  if (!outcome?.prediction) return false;
  const { prediction, actual, fallback } = outcome;
  const replies = rankMoves(prediction.candidate.after, { depth: 1 });
  const actualRank = replies.findIndex((reply) =>
    reply.from === actual.from
    && reply.to === actual.to
    && (reply.promotion || '') === (actual.promotion || '')
  );
  const actualReply = actualRank >= 0 ? replies[actualRank] : null;
  const forecastRank = prediction.replies.findIndex((reply) =>
    reply.from === actual.from
    && reply.to === actual.to
    && (reply.promotion || '') === (actual.promotion || '')
  );
  const situation = scoreSituation(actualReply?.score ?? prediction.candidate.score);
  coachOutcome = {
    ...outcome,
    actualRank,
    forecastRank,
    situation,
    score: actualReply?.score ?? prediction.candidate.score,
  };
  coachPanelEl.dataset.state = 'outcome';
  coachTitleEl.textContent = fallback
    ? `黑方用合法保底步走了 ${actual.san}`
    : `黑方实际走了 ${actual.san}`;
  coachExplainEl.textContent = fallback
    ? `${outcome.reason || '搜索未完成'}，因此采用合法保底步；不把它冒充成预测命中`
    : forecastRank === 0
      ? '命中预演的首要强回应'
      : forecastRank > 0
        ? `落在预演的前三条强回应里（第 ${forecastRank + 1} 条）`
        : '没出现在这次浅层预演的前三条，实际结果已用蓝线标出';
  coachMovesEl.innerHTML =
    `<div class="coach-card is-active" data-outcome="true" data-score="${coachOutcome.score}"`
      + ` data-situation="${situation.key}" data-actual-rank="${actualRank}">`
      + `<span class="coach-card-top"><span class="coach-san">${esc(prediction.candidate.san)} → ${esc(actual.san)}</span></span>`
      + `<span class="coach-situation" style="--situation-color:${situation.color}">${situation.label}</span>`
      + `<span class="coach-reply">${fallback ? '合法保底应手' : `实际回应强度排序：${actualRank >= 0 ? `第 ${actualRank + 1}` : '未找到'}`}</span>`
      + `<span class="coach-raw">引擎原分 ${scoreText(coachOutcome.score)}</span>`
      + `</div>`;
  coachReplyStripEl.innerHTML = prediction.replies.map((reply, index) =>
    `<span class="coach-reply-chip" data-rank="${index}" data-san="${esc(reply.san)}">`
      + `${reply.san === actual.san ? '✓ ' : ''}${index + 1}. ${PIECE_NAME[reply.piece] || '棋子'} ${esc(reply.san)}</span>`
  ).join('');
  coachPreview = {
    id: `coach-${++coachPreviewGen}`,
    you: prediction.candidate,
    reply: actual,
  };
  pendingCoachOutcome = null;
  renderBoard();
  return true;
}

coachMovesEl.addEventListener('click', (ev) => {
  const card = ev.target.closest('button.coach-card');
  if (!card || !coachModel || thinking) return;
  const candidate = coachModel.candidates.find((move) => move.rank === +card.dataset.rank);
  if (candidate && renderCoachCandidate(candidate)) {
    coachMovesEl.querySelector(`button.coach-card[data-rank="${candidate.rank}"]`)
      ?.focus({ preventScroll: true });
  }
});

coachReplyStripEl.addEventListener('click', (ev) => {
  const action = ev.target.closest('button[data-coach-action]');
  if (!action || !coachModel || thinking) return;
  const candidate = coachModel.candidates.find((move) => move.rank === +action.dataset.rank);
  if (candidate) tryMove(candidate.from, candidate.to, candidate.promotion);
});

function refreshColumnVisibility() {
  for (let i = 0; i < columns.length; i++) {
    const column = columns[i];
    column.expanded = !!expanded[i];
    column.visibleIndices = column.expanded
      ? column.ranked.map((_, rank) => rank)
      : [...Array(column.baseShown).keys()];
    if (!column.visibleIndices.includes(column.chosen)) column.visibleIndices.push(column.chosen);
    column.shown = column.visibleIndices.length;
  }
}

function renderFork(force = false, rebuild = true) {
  if (forkStale && !force) return false;
  forkStale = false;
  forkHoverKey = '';
  forkWrap.inert = false;
  forkEl.style.opacity = '';
  forkEl.removeAttribute('aria-busy');
  if (rebuild) columns = buildColumns();
  else refreshColumnVisibility();
  const compact = matchMedia('(max-width: 1100px), (max-height: 780px)').matches;
  const minColW = compact ? 150 : 112;
  const W = Math.max(columns.length * minColW, forkWrap.clientWidth || 900);
  const colW = W / Math.max(1, columns.length || 1);
  const cardW = Math.max(compact ? 120 : 96, colW - 34);

  const hasToggle = (c) => c.ranked.length > c.baseShown;
  const cardOffset = (c) => c.expanded && hasToggle(c) ? 1 : 0;
  const rowsOf = (c) => c.visibleIndices.length + (hasToggle(c) ? 1 : 0);
  let maxRows = 1;
  for (const c of columns) maxRows = Math.max(maxRows, rowsOf(c));
  const bodyH = maxRows * (CARD_H + CARD_GAP) - CARD_GAP;
  const H = Math.max(forkWrap.clientHeight || 420, HEAD_H + bodyH + 24);
  const top = HEAD_H;
  // 顶对齐：把某一列点开成几十条时，其余列还待在原地看得见
  const colX = (i) => 18 + i * colW;
  const yOf = (_, row) => top + row * (CARD_H + CARD_GAP);
  const rowOf = (c, rank) => cardOffset(c) + Math.max(0, c.visibleIndices.indexOf(rank));
  const anchorY = top + (Math.min(rowsOf(columns[0] || { visibleIndices: [0], ranked: [], baseShown: 1 }), 7) * (CARD_H + CARD_GAP) - CARD_GAP) / 2;

  let svg = '';

  // 先铺一条更宽的发光主干，再画真实分叉边；视觉上始终能追到「我选的这一条路」。
  for (let i = 0; i < columns.length; i++) {
    const c = columns[i], x = colX(i);
    let fx = 12, fy = anchorY;
    if (i > 0) {
      const pc = columns[i - 1];
      fx = colX(i - 1) + cardW;
      fy = yOf(pc, rowOf(pc, pc.chosen)) + CARD_H / 2;
    }
    const y = yOf(c, rowOf(c, c.chosen)) + CARD_H / 2;
    const mx = (fx + x) / 2;
    svg += `<path class="route-underlay" data-col="${i}" d="M${fx.toFixed(1)},${fy.toFixed(1)} C${mx.toFixed(1)},${fy.toFixed(1)} ${mx.toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}"/>`;
  }

  // 每列都从上一张已选卡继续扇开；非选路线压低，选中边永远在同一条主干上。
  for (let i = 0; i < columns.length; i++) {
    const c = columns[i];
    const x = colX(i);
    let fx, fy;
    if (i === 0) { fx = 12; fy = anchorY; }
    else {
      const pc = columns[i - 1];
      fx = colX(i - 1) + cardW;
      fy = yOf(pc, rowOf(pc, pc.chosen)) + CARD_H / 2;
    }
    for (let row = 0; row < c.visibleIndices.length; row++) {
      const rank = c.visibleIndices[row];
      const y = yOf(c, row + cardOffset(c)) + CARD_H / 2;
      const isPick = rank === c.chosen;
      const col = isPick ? 'rgba(143,216,255,.85)' : 'rgba(150,162,196,.20)';
      const mx = (fx + x) / 2;
      svg += `<path class="branch-edge" data-col="${i}" data-idx="${rank}" data-selected="${isPick}"`
        + ` d="M${fx.toFixed(1)},${fy.toFixed(1)} C${mx.toFixed(1)},${fy.toFixed(1)} ${mx.toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}"`
        + ` fill="none" stroke="${col}" stroke-width="${isPick ? 2.8 : 1}"/>`;
    }
  }

  // 最左边那个「现在」的点
  svg += `<circle cx="12" cy="${anchorY.toFixed(1)}" r="9" fill="none" stroke="rgba(126,224,168,.25)" stroke-width="1"/>`;
  svg += `<circle data-root="true" cx="12" cy="${anchorY.toFixed(1)}" r="4.5" fill="#7ee0a8"/>`;
  svg += `<text x="4" y="${(anchorY - 13).toFixed(1)}" font-size="10.5" fill="#7ee0a8">现在</text>`;

  // 每一列
  for (let i = 0; i < columns.length; i++) {
    const c = columns[i];
    const x = colX(i);
    const who = c.white ? '白' : '黑';
    const mine = c.white ? '你' : '他';
    svg += `<text x="${x}" y="20" font-size="11" fill="#5f6679">第 ${Math.floor(c.ply / 2) + 1} 回合 · ${who}走</text>`;
    svg += `<text x="${x}" y="39" font-size="14" font-weight="650" fill="#e4ecff">${mine}有 ${c.ranked.length} 种走法</text>`;
    svg += `<text x="${x}" y="55" font-size="10.5" fill="#5f6679">${
      i === 0 ? '从现在出发' : `沿 ${esc(columns[i - 1].ranked[columns[i - 1].chosen].san)} 继续`
    }</text>`;

    for (let row = 0; row < c.visibleIndices.length; row++) {
      const rank = c.visibleIndices[row];
      const m = c.ranked[rank];
      const situation = scoreSituation(m.score);
      const y = yOf(c, row + cardOffset(c));
      const isPick = rank === c.chosen;
      const col = cssColor(m.score, 1.25);
      svg += `<g class="card" role="button" tabindex="0" data-col="${i}" data-idx="${rank}" data-san="${esc(m.san)}" data-situation="${situation.key}" data-selected="${isPick}">`
        + `<rect x="${x}" y="${y}" width="${cardW}" height="${CARD_H}" rx="9"`
        + ` fill="${isPick ? 'rgba(60,96,140,.55)' : 'rgba(30,36,52,.62)'}"`
        + ` stroke="${isPick ? '#8fd8ff' : 'rgba(150,170,220,.18)'}" stroke-width="${isPick ? 1.8 : 1}"/>`
        + `<rect x="${x}" y="${y + 7}" width="4" height="${CARD_H - 14}" rx="2" fill="${col}"/>`
        + `<text x="${x + 15}" y="${y + CARD_H / 2 + 1}" font-size="15" font-weight="600" dominant-baseline="middle" fill="#f0f4ff">${esc(m.san)}</text>`
        + `<text x="${x + cardW - 11}" y="${y + CARD_H / 2 + 1}" font-size="10.5" text-anchor="end" dominant-baseline="middle" fill="${col}">${situation.short}</text>`
        + `<text x="${x + cardW - 11}" y="${y + 11}" font-size="8.5" text-anchor="end" fill="${isPick ? '#9edcff' : '#6f768c'}">${isPick ? '✓ 已选' : `#${rank + 1}`} · ${scoreText(m.score)}</text>`
        + `</g>`;
    }
    if (hasToggle(c)) {
      const y = yOf(c, c.expanded ? 0 : c.visibleIndices.length);
      const hidden = c.ranked.length - c.visibleIndices.length;
      const label = c.expanded
        ? `收起到推荐的 ${c.baseShown} 条 ↑`
        : `展开其余 ${hidden} 条 ↓`;
      svg += `<g class="more" role="button" tabindex="0" data-col="${i}" data-expanded="${c.expanded}">`
        + `<rect x="${x}" y="${y}" width="${cardW}" height="${CARD_H}" rx="9" fill="rgba(24,29,42,.5)" stroke="rgba(150,170,220,.14)" stroke-width="1" stroke-dasharray="4 4"/>`
        + `<text x="${x + cardW / 2}" y="${y + CARD_H / 2 + 1}" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#8c93a8">${label}</text>`
        + `</g>`;
    }
  }

  forkEl.setAttribute('width', W);
  forkEl.setAttribute('height', H);
  forkEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  forkEl.innerHTML = svg;

  // 已经走过的棋谱
  const hist = game.history();
  let line = '';
  for (let i = 0; i < hist.length; i++) {
    if (i % 2 === 0) line += `<span class="num">${i / 2 + 1}.</span>`;
    line += (i === hist.length - 1 ? `<b>${hist[i]}</b>` : hist[i]) + ' ';
  }
  const picked = columns.map((c) => c.ranked[c.chosen].san).join(' ');
  document.getElementById('moveLine').innerHTML =
    (line ? `走过：${line}` : '还没落子。') + (picked ? `　▸　当前选路：<b>${picked}</b>` : '');

  document.getElementById('btnPlayLine').disabled =
    !(columns.length && game.turn() === 'w' && !thinking && !game.isGameOver());
  syncCloudMap();
  if (selected && !thinking && (!coachModel || coachModel.fen !== game.fen())) {
    updateMoveCoach();
    renderBoard();
  }
  return true;
}

function setColumnExpanded(col, open) {
  if (thinking || forkStale) return false;
  if (!columns[col] || columns[col].ranked.length <= columns[col].baseShown) return false;
  expanded[col] = !!open;
  renderFork(false, false);
  return true;
}

function toggleColumnExpanded(col) {
  return setColumnExpanded(col, !expanded[col]);
}

function scrollForkToward(col) {
  const gen = ++forkScrollGen;
  requestAnimationFrame(() => {
    if (gen !== forkScrollGen) return;
    const target = forkEl.querySelector(`g.card[data-col="${Math.min(col, columns.length - 1)}"][data-selected="true"]`);
    if (!target) return;
    const wr = forkWrap.getBoundingClientRect(), tr = target.getBoundingClientRect();
    const left = forkWrap.scrollLeft + (tr.left + tr.right - wr.left - wr.right) / 2;
    forkWrap.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
  });
}

function chooseForkBranch(i, rank, scrollNext = false) {
  if (thinking || forkStale) return false;
  const chosen = columns[i] && columns[i].ranked[rank];
  if (!chosen) return false;
  branchPath = branchPath.slice(0, i);
  branchPath[i] = rank;
  expanded = expanded.slice(0, i + 1);
  expanded[i] = false;
  renderFork();
  showMoveDetails(columns[i], columns[i].ranked[rank], rank);
  if (scrollNext) scrollForkToward(i + 1);
  return true;
}

function activateForkTarget(target) {
  if (thinking || forkStale) return false;
  const more = target.closest ? target.closest('g.more') : null;
  if (more) return toggleColumnExpanded(+more.dataset.col);
  const card = target.closest ? target.closest('g.card') : null;
  if (!card) return false;
  return chooseForkBranch(+card.dataset.col, +card.dataset.idx, true);
}

forkEl.addEventListener('click', (ev) => {
  activateForkTarget(ev.target);
});
forkEl.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  if (activateForkTarget(ev.target)) ev.preventDefault();
});

function showMoveDetails(c, m, rank) {
  const isCurrentPosition = c.fen === game.fen();
  // 未来列的坐标属于未来 FEN，绝不能把它冒充成当前棋盘上的箭头。
  forkPreview = isCurrentPosition
    ? { from: m.from, to: m.to, color: cssColor(m.score, 1.35) }
    : null;
  renderBoardOverlay();
  let replies = forkReplyCountCache.get(m.after);
  if (replies === undefined) {
    replies = new Chess(m.after).moves().length;
    forkReplyCountCache.set(m.after, replies);
  }
  const situation = scoreSituation(m.score);
  const quality = moveQuality(m.score, c.ranked[0].score, c.white);
  document.getElementById('forkFoot').innerHTML =
    `<b>${esc(m.san)}</b>　这一步在 ${c.ranked.length} 种里排第 <b>${rank + 1}</b>`
    + `　·　走完之后对方有 <b>${replies}</b> 种回应`
    + `　·　<b>${situation.label}</b>，${quality.label}`
    + `　·　引擎原分 ${scoreText(m.score)}`
    + (isCurrentPosition ? '' : '　·　这是未来局面；用「放大探索」看逐格棋盘');
}

forkEl.addEventListener('mouseover', (ev) => {
  if (thinking || forkStale) return;
  const card = ev.target.closest ? ev.target.closest('g.card') : null;
  if (!card) return;
  const key = `${card.dataset.col}:${card.dataset.idx}`;
  if (key === forkHoverKey) return;
  forkHoverKey = key;
  const c = columns[+card.dataset.col];
  const m = c && c.ranked[+card.dataset.idx];
  if (!m) return;
  showMoveDetails(c, m, +card.dataset.idx);
});
forkEl.addEventListener('mouseleave', () => {
  if (thinking || forkStale) return;
  forkHoverKey = '';
  forkPreview = null; renderBoardOverlay();
  document.getElementById('forkFoot').textContent = FORK_IDLE_TEXT;
});

document.getElementById('btnPlayLine').onclick = () => {
  if (thinking || forkStale) return;
  if (!columns.length) return;
  const m = columns[0].ranked[columns[0].chosen];
  tryMove(m.from, m.to, m.promotion);
};

// ─────────────────────────────────────────────── 全屏变体棋盘
const exploreSquaresEl = document.getElementById('exploreSquares');
const explorePiecesEl = document.getElementById('explorePieces');
const exploreOverlayEl = document.getElementById('exploreOverlay');
const explorePathEl = document.getElementById('explorePath');
const exploreSummaryEl = document.getElementById('exploreSummary');
const exploreChoicesEl = document.getElementById('exploreChoices');
const exploreChoiceCache = new Map();
const exploreReplyCountCache = new Map();
const EXPLORE_MAX_PLY = SYNC_DEPTH;
let explorerState = { rootFen: '', path: [], choices: [] };
let tree2dRenderKey = '';
let tree2dConnectorFrame = 0;

function fenTurnContext(fen) {
  const fields = String(fen).trim().split(/\s+/);
  const side = fields[1];
  const fullmove = Number(fields[5]);
  if ((side !== 'w' && side !== 'b') || !Number.isInteger(fullmove) || fullmove < 1) {
    throw new Error(`无效 FEN 回合字段：${fen}`);
  }
  const completedPly = (fullmove - 1) * 2 + (side === 'b' ? 1 : 0);
  return {
    side,
    sideLabel: side === 'w' ? '白方' : '黑方',
    fullmove,
    completedPly,
    absolutePly: completedPly + 1,
  };
}

function explorerStepContext(index) {
  const parentFen =
    index === 0
      ? explorerState.rootFen
      : explorerState.path[index - 1].after;
  return fenTurnContext(parentFen);
}

function shortTurnLabel(turn) {
  return turn.side === 'w'
    ? `${turn.fullmove}. 白`
    : `${turn.fullmove}… 黑`;
}

function explorerFen() {
  return explorerState.path.at(-1)?.after || explorerState.rootFen || game.fen();
}

function resetExplorer(render = true) {
  explorerState = { rootFen: game.fen(), path: [], choices: [] };
  if (render) renderExplorer();
  return true;
}

function ensureExplorerRoot() {
  if (explorerState.rootFen !== game.fen()) resetExplorer(false);
}

function explorerChoicesFor(fen) {
  let ranked = exploreChoiceCache.get(fen);
  if (!ranked) {
    ranked = rankMoves(fen, { depth: 1 });
    exploreChoiceCache.set(fen, ranked);
  }
  return ranked;
}

function explorerReplyCount(after) {
  let replies = exploreReplyCountCache.get(after);
  if (replies === undefined) {
    replies = new Chess(after).moves().length;
    exploreReplyCountCache.set(after, replies);
  }
  return replies;
}

function renderExplorerBoard(fen, lastMove = null) {
  const viewGame = new Chess(fen);
  const board = viewGame.board();
  exploreSquaresEl.replaceChildren();
  explorePiecesEl.replaceChildren();
  exploreOverlayEl.replaceChildren();
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = FILES[f] + (8 - r);
      const dark = (r + f) % 2 === 1;
      const highlighted = lastMove && (sq === lastMove.from || sq === lastMove.to);
      const rect = svgElement('rect', {
        x: f * CELL, y: r * CELL, width: CELL, height: CELL,
        fill: highlighted ? (dark ? '#5c6132' : '#b3b06a') : (dark ? '#3b4560' : '#8b97b4'),
        stroke: dark ? 'rgba(8,12,21,.34)' : 'rgba(236,242,255,.08)',
        'stroke-width': .55,
        'data-sq': sq,
      });
      exploreSquaresEl.appendChild(rect);
      const pc = board[r][f];
      if (pc) appendPieceModel(pc, sq, f, r, explorePiecesEl);
    }
  }
  if (lastMove) {
    const [x1, y1] = squareXY(lastMove.from), [x2, y2] = squareXY(lastMove.to);
    exploreOverlayEl.appendChild(svgElement('line', {
      x1, y1, x2, y2, stroke: '#8fd8ff', 'stroke-width': 5,
      'stroke-linecap': 'round', opacity: '.82', 'pointer-events': 'none',
    }));
    exploreOverlayEl.appendChild(svgElement('circle', {
      cx: x2, cy: y2, r: 9, fill: '#8fd8ff', opacity: '.9', 'pointer-events': 'none',
    }));
  }
  document.getElementById('exploreBoard').setAttribute(
    'aria-label',
    `变体预演棋盘，${viewGame.turn() === 'w' ? '白方' : '黑方'}行棋，共 ${explorePiecesEl.childElementCount} 枚棋子`,
  );
  document.getElementById('exploreBoard').dataset.fen = fen;
  document.getElementById('exploreBoard').style.opacity = '1';
}

function renderExplorer() {
  ensureExplorerRoot();
  const explorerEl = document.getElementById('cloudExplorer');
  explorerEl.inert = thinking;
  explorerEl.setAttribute('aria-busy', String(thinking));
  const fen = explorerFen();
  const last = explorerState.path.at(-1) || null;
  explorerState.choices =
    !thinking && explorerState.path.length < EXPLORE_MAX_PLY
      ? explorerChoicesFor(fen)
      : [];
  renderExplorerBoard(fen, last);

  explorePathEl.innerHTML =
    `<button type="button" data-explore-depth="0"${explorerState.path.length === 0 ? ' class="is-current"' : ''}>`
    + `现在 · 已走 ${fenTurnContext(explorerState.rootFen).completedPly} 手</button>`
    + explorerState.path.map((move, index) => {
      const turn = explorerStepContext(index);
      return `<button type="button" data-explore-depth="${index + 1}"`
        + `${index === explorerState.path.length - 1 ? ' class="is-current"' : ''}>`
        + `${shortTurnLabel(turn)} ${esc(move.san)}</button>`;
    }).join('');

  if (thinking) {
    exploreSummaryEl.innerHTML = '<b>黑方正在思考。</b><br>应手完成后再探索，不与 AI 抢主线程。';
    exploreChoicesEl.replaceChildren();
    syncCloudMap();
    return;
  }
  const side = fen.split(' ')[1] === 'w' ? '白方' : '黑方';
  const situation = last ? scoreSituation(last.score) : null;
  exploreSummaryEl.innerHTML = last
    ? (explorerState.path.length >= EXPLORE_MAX_PLY
      ? `<b>已展开从当前局面向后的 ${EXPLORE_MAX_PLY} 步；点上方路径回退。</b><br>`
        + `${explorerState.path.map((move) => esc(move.san)).join(' → ')} 后，`
        + `<span style="color:${situation.color}">${situation.label}</span>。`
      : `如果走到 <b>${explorerState.path.map((move) => esc(move.san)).join(' → ')}</b>：`
        + `<b style="color:${situation.color}">${situation.label}</b>。`
        + `现在轮到${side}，可从下面换一枚棋子或另一种走法。`)
    : `<b>当前棋局已走 ${fenTurnContext(fen).completedPly} 手。</b><br>`
      + `第 ${fenTurnContext(fen).fullmove} 回合轮到${side}；点下面任意走法，棋盘会显示真实走后局面。`;
  exploreChoicesEl.innerHTML = explorerState.choices.map((move, rank) => {
    const situationNow = scoreSituation(move.score);
    const replies = explorerReplyCount(move.after);
    return `<button type="button" data-explore-rank="${rank}" data-san="${esc(move.san)}"`
      + ` data-from="${move.from}" data-to="${move.to}" data-after="${esc(move.after)}"`
      + ` data-replies="${replies}"`
      + ` style="--choice-color:${cssColor(move.score, 1.25)}">`
      + `<b>${esc(move.san)}</b><small>${PIECE_NAME[move.piece] || '棋子'} · ${situationNow.short}`
      + ` · 走后 ${replies} 个分支</small></button>`;
  }).join('');
  exploreChoicesEl.scrollTop = 0;
  syncCloudMap();
}

function chooseExplorerMoveAt(parentDepth, rank) {
  ensureExplorerRoot();
  const depth = Math.max(0, Math.min(Number(parentDepth) || 0, explorerState.path.length));
  if (thinking || depth >= EXPLORE_MAX_PLY) return false;
  const prefix = explorerState.path.slice(0, depth);
  const parentFen = prefix.at(-1)?.after || explorerState.rootFen;
  const choices = explorerChoicesFor(parentFen);
  const move = choices[rank];
  if (!move) return false;
  explorerState.path = prefix;
  explorerState.choices = choices;
  explorerState.path.push({
    san: move.san, from: move.from, to: move.to,
    promotion: move.promotion || '', after: move.after,
    score: move.score, piece: move.piece, captured: move.captured || '',
  });
  renderExplorer();
  if (cloudViewMode === '3d') {
    focusExplorerNode();
    if (document.body.classList.contains('cloud-full')) {
      (
        exploreChoicesEl.querySelector('button[data-explore-rank]')
        || explorePathEl.querySelector('button.is-current')
      )?.focus({ preventScroll: true });
    }
  } else {
    centerTreeSelections(depth + 1, true);
  }
  return true;
}

function chooseExplorerMove(rank) {
  return chooseExplorerMoveAt(explorerState.path.length, rank);
}

function chooseExplorerRootAfter(after) {
  ensureExplorerRoot();
  const choices = explorerChoicesFor(explorerState.rootFen);
  const rank = choices.findIndex((move) => move.after === after);
  return rank >= 0 && chooseExplorerMoveAt(0, rank);
}

function rewindExplorer(depth) {
  const nextDepth = Math.max(0, Math.min(Number(depth) || 0, explorerState.path.length));
  explorerState.path = explorerState.path.slice(0, nextDepth);
  renderExplorer();
  if (cloudViewMode === '3d') {
    focusExplorerNode();
    explorePathEl.querySelector('button.is-current')?.focus({ preventScroll: true });
  } else {
    centerTreeSelections(nextDepth, true);
  }
  return true;
}

exploreChoicesEl.addEventListener('click', (event) => {
  const choice = event.target.closest('button[data-explore-rank]');
  if (choice) chooseExplorerMove(+choice.dataset.exploreRank);
});
explorePathEl.addEventListener('click', (event) => {
  const crumb = event.target.closest('button[data-explore-depth]');
  if (crumb) rewindExplorer(+crumb.dataset.exploreDepth);
});
document.getElementById('exploreReset').onclick = () => resetExplorer();

// ─────────────────────────────────────────────── 二维聚焦树
// 不把数千乃至数十万未来复制成 DOM。每层只画“当前选中父节点”的全部合法孩子；
// 每张卡上的下一层分叉数直接从 move.after 重新生成合法走法。
function treeChoiceHtml(move, rank, parentDepth, parentFen, selected) {
  const replies = explorerReplyCount(move.after);
  const situation = scoreSituation(move.score);
  return `<div class="tree2d-node-wrap">`
    + `<span class="tree2d-edge" data-tree-edge data-depth="${parentDepth + 1}"`
    + ` data-selected="${selected}"></span>`
    + `<button type="button" class="tree2d-choice${selected ? ' is-selected' : ''}"`
    + ` data-tree-rank="${rank}" data-parent-depth="${parentDepth}"`
    + ` data-parent-fen="${esc(parentFen)}" data-depth="${parentDepth + 1}"`
    + ` data-san="${esc(move.san)}" data-from="${move.from}" data-to="${move.to}"`
    + ` data-promotion="${move.promotion || ''}" data-after="${esc(move.after)}"`
    + ` aria-pressed="${selected}" style="--tree-color:${cssColor(move.score, 1.25)}">`
    + `<b>${esc(move.san)}</b>`
    + `<small>${PIECE_NAME[move.piece] || '棋子'} · ${situation.short}</small>`
    + `<span class="tree2d-branch-badge">走后 <span class="tree2d-branch-count">${replies}</span> 个分支`
    + `${selected ? ' · <span class="tree2d-selected-mark">已选</span>' : ''}</span>`
    + `</button></div>`;
}

function clearTreePathConnectors() {
  if (tree2dConnectorFrame) {
    cancelAnimationFrame(tree2dConnectorFrame);
    tree2dConnectorFrame = 0;
  }
  tree2dBodyEl.querySelector('#tree2dPathLinks')?.remove();
}

function syncTreePanButtons(scroller = null) {
  const scrollers = scroller
    ? [scroller]
    : [...tree2dBodyEl.querySelectorAll('.tree2d-branch-scroll')];
  for (const current of scrollers) {
    const nav = current.closest('.tree2d-level')?.querySelector('.tree2d-row-nav');
    if (!nav) continue;
    const max = Math.max(0, current.scrollWidth - current.clientWidth);
    nav.hidden = max <= 1;
    const left = nav.querySelector('button[data-tree-pan="-1"]');
    const right = nav.querySelector('button[data-tree-pan="1"]');
    if (left) left.disabled = max <= 1 || current.scrollLeft <= 1;
    if (right) right.disabled = max <= 1 || current.scrollLeft >= max - 1;
  }
}

function renderTreePathConnectors() {
  tree2dConnectorFrame = 0;
  syncTreePanButtons();
  tree2dBodyEl.querySelector('#tree2dPathLinks')?.remove();
  if (
    cloudViewMode !== '2d'
    || thinking
    || !document.body.classList.contains('cloud-full')
    || explorerState.path.length === 0
  ) return false;

  const root = tree2dBodyEl.querySelector('[data-tree-root]');
  const bodyRect = tree2dBodyEl.getBoundingClientRect();
  if (!root || bodyRect.width <= 0 || bodyRect.height <= 0) return false;
  const width = Math.max(1, tree2dBodyEl.clientWidth);
  const height = Math.max(1, tree2dBodyEl.scrollHeight);
  const svg = svgElement('svg', {
    id: 'tree2dPathLinks',
    width,
    height,
    viewBox: `0 0 ${width} ${height}`,
    'aria-hidden': 'true',
  });

  let previous = root;
  for (let index = 0; index < explorerState.path.length; index++) {
    const step = explorerState.path[index];
    const selected = tree2dBodyEl.querySelector(
      `button.tree2d-choice.is-selected[data-depth="${index + 1}"]`,
    );
    if (!selected) break;
    const fromRect = previous.getBoundingClientRect();
    const toRect = selected.getBoundingClientRect();
    const sx = fromRect.left + fromRect.width / 2 - bodyRect.left;
    const sy = fromRect.bottom - bodyRect.top;
    const ex = toRect.left + toRect.width / 2 - bodyRect.left;
    const ey = toRect.top - bodyRect.top;
    const middleY = sy + (ey - sy) * .5;
    const link = svgElement('path', {
      class: 'tree2d-path-link',
      d: `M ${sx} ${sy} C ${sx} ${middleY}, ${ex} ${middleY}, ${ex} ${ey}`,
      'data-tree-path-link': '',
      'data-depth': index + 1,
      'data-from-fen': index === 0 ? explorerState.rootFen : explorerState.path[index - 1].after,
      'data-to-fen': step.after,
      'data-sx': sx,
      'data-sy': sy,
      'data-ex': ex,
      'data-ey': ey,
    });
    svg.appendChild(link);
    previous = selected;
  }
  if (svg.childElementCount === 0) return false;
  tree2dBodyEl.prepend(svg);
  return true;
}

function scheduleTreePathConnectors() {
  if (cloudViewMode !== '2d' || tree2dConnectorFrame) return false;
  tree2dConnectorFrame = requestAnimationFrame(renderTreePathConnectors);
  return true;
}

function renderCloudTree2d() {
  cloudTree2dEl.setAttribute('aria-hidden', String(cloudViewMode !== '2d'));
  if (cloudViewMode !== '2d') return false;
  ensureExplorerRoot();
  cloudTree2dEl.inert = thinking;
  cloudTree2dEl.setAttribute('aria-busy', String(thinking));
  const renderKey = [
    explorerState.rootFen,
    ...explorerState.path.map((move) => move.after),
    thinking ? 'thinking' : 'ready',
  ].join('|');
  if (tree2dRenderKey === renderKey && tree2dBodyEl.childElementCount > 0) {
    scheduleTreePathConnectors();
    updateHud();
    return true;
  }
  tree2dRenderKey = renderKey;

  const rootTurn = fenTurnContext(explorerState.rootFen);
  tree2dPathEl.innerHTML =
    `<button type="button" data-tree-rewind="0"${explorerState.path.length === 0 ? ' class="is-current"' : ''}`
    + ` aria-current="${explorerState.path.length === 0 ? 'step' : 'false'}">`
    + `现在 · 已走 ${rootTurn.completedPly} 手</button>`
    + explorerState.path.map((move, index) => {
      const turn = explorerStepContext(index);
      return `<button type="button" data-tree-rewind="${index + 1}"`
        + `${index === explorerState.path.length - 1 ? ' class="is-current"' : ''}`
        + ` aria-current="${index === explorerState.path.length - 1 ? 'step' : 'false'}">`
        + `${shortTurnLabel(turn)} ${esc(move.san)}</button>`;
    }).join('');

  if (thinking) {
    tree2dLiveEl.textContent = '黑方正在思考；应手绘制后再重新长树。';
    tree2dBodyEl.innerHTML = '<div class="tree2d-empty">正在等待新的真实局面，不计算中间树。</div>';
    updateHud();
    return true;
  }

  const levels = [];
  for (
    let parentDepth = 0;
    parentDepth < EXPLORE_MAX_PLY && parentDepth <= explorerState.path.length;
    parentDepth++
  ) {
    const parentFen =
      parentDepth === 0
        ? explorerState.rootFen
        : explorerState.path[parentDepth - 1].after;
    const choices =
      explorerChoicesFor(parentFen);
    const selectedMove = explorerState.path[parentDepth] || null;
    const turn = fenTurnContext(parentFen);
    levels.push({
      parentDepth,
      parentFen,
      choices,
      selectedMove,
      turn,
    });
  }

  const rootChoices = levels[0]?.choices || [];
  tree2dBodyEl.innerHTML =
    `<div class="tree2d-root" data-tree-root data-fen="${esc(explorerState.rootFen)}"`
    + ` data-completed-ply="${rootTurn.completedPly}" data-fullmove="${rootTurn.fullmove}"`
    + ` data-side="${rootTurn.side}">`
    + `<b>当前局面 · 已走 ${rootTurn.completedPly} 手</b>`
    + `<small>第 ${rootTurn.fullmove} 回合 · ${rootTurn.sideLabel}待走 · `
    + `<span class="tree2d-root-count">${rootChoices.length}</span> 个真实下一步</small></div>`
    + levels.map((level, levelIndex) => {
      const isFrontier = levelIndex === levels.length - 1;
      const relativeDepth = level.parentDepth + 1;
      const nodes = level.choices.map((move, rank) =>
        treeChoiceHtml(
          move,
          rank,
          level.parentDepth,
          level.parentFen,
          !!level.selectedMove && move.after === level.selectedMove.after,
        )
      ).join('');
      return `<section class="tree2d-level${isFrontier ? ' is-frontier' : ''}"`
        + ` data-tree-level="${relativeDepth}" data-relative-depth="${relativeDepth}"`
        + ` data-absolute-ply="${level.turn.absolutePly}" data-fullmove="${level.turn.fullmove}"`
        + ` data-side="${level.turn.side}" data-parent-fen="${esc(level.parentFen)}">`
        + `<div class="tree2d-level-head"><span class="tree2d-level-copy">`
        + `<span class="tree2d-level-title">第 ${level.turn.fullmove} 回合 · ${level.turn.sideLabel}走</span>`
        + `<span class="tree2d-level-meta">未来第 ${relativeDepth} 步 · 共有 `
        + `<b class="tree2d-level-count">—</b> 个可选分支</span></span>`
        + (nodes
          ? `<span class="tree2d-row-nav" aria-label="未来第 ${relativeDepth} 步分支横向浏览">`
            + `<button type="button" data-tree-pan="-1" aria-label="向左看更多分支">←</button>`
            + `<button type="button" data-tree-pan="1" aria-label="向右看更多分支">→</button></span>`
          : '')
        + `</div>`
        + `<span class="tree2d-parent-stem" aria-hidden="true"></span>`
        + (nodes
          ? `<div class="tree2d-branch-scroll"><div class="tree2d-branch-rail">${nodes}</div></div>`
          : `<div class="tree2d-empty">这里没有合法后续：路径已到终点。</div>`)
        + `</section>`;
    }).join('');

  const renderedLevels = [...tree2dBodyEl.querySelectorAll('.tree2d-level')];
  for (const level of renderedLevels) {
    const count = level.querySelectorAll('button.tree2d-choice').length;
    level.querySelector('.tree2d-level-count').textContent = String(count);
  }
  const rootCount = tree2dBodyEl.querySelector(
    '.tree2d-level[data-tree-level="1"]',
  )?.querySelectorAll('button.tree2d-choice').length || 0;
  const rootCountEl = tree2dBodyEl.querySelector('.tree2d-root-count');
  if (rootCountEl) rootCountEl.textContent = String(rootCount);

  const currentPath = explorerState.path.map((move) => move.san).join(' → ');
  const frontier = renderedLevels.at(-1);
  const frontierCount = frontier?.querySelectorAll('button.tree2d-choice').length || 0;
  tree2dLiveEl.textContent =
    explorerState.path.length >= EXPLORE_MAX_PLY
      ? `当前路径：${currentPath}。已展开未来 ${EXPLORE_MAX_PLY} 步；每张卡仍标出真实后续分叉数。`
      : frontierCount === 0
        ? `当前路径${currentPath ? `：${currentPath}` : ''}已到终点，没有合法后续。`
        : `${currentPath ? `当前路径：${currentPath}。` : '从现在开始。'}下一层共有 ${frontierCount} 个可选分支。`;
  centerTreeSelections(explorerState.path.length, false);
  scheduleTreePathConnectors();
  updateHud();
  return true;
}

function centerTreeSelections(preferredDepth = explorerState.path.length, focus = false) {
  if (cloudViewMode !== '2d') return false;
  const selected = [...tree2dBodyEl.querySelectorAll('button.tree2d-choice.is-selected')];
  for (const button of selected) {
    const scroller = button.closest('.tree2d-branch-scroll');
    const wrap = button.closest('.tree2d-node-wrap');
    if (!scroller || !wrap || scroller.clientWidth === 0) continue;
    scroller.scrollLeft = Math.max(
      0,
      wrap.offsetLeft + wrap.offsetWidth / 2 - scroller.clientWidth / 2,
    );
    syncTreePanButtons(scroller);
  }
  if (focus) {
    const full = document.body.classList.contains('cloud-full');
    const target = full
      ? tree2dBodyEl.querySelector(
        `button.tree2d-choice.is-selected[data-depth="${preferredDepth}"]`,
      )
      : tree2dBodyEl.querySelector('.tree2d-level.is-frontier button.tree2d-choice');
    (target || tree2dPathEl.querySelector('button.is-current'))?.focus({ preventScroll: true });
  }
  return true;
}

cloudTree2dEl.addEventListener('click', (event) => {
  event.stopPropagation();
  const pan = event.target.closest('button[data-tree-pan]');
  if (pan) {
    const scroller = pan.closest('.tree2d-level')?.querySelector('.tree2d-branch-scroll');
    if (!scroller) return;
    const amount = Math.max(126, Math.round(scroller.clientWidth * .72));
    scroller.scrollLeft = Math.max(
      0,
      Math.min(scroller.scrollWidth - scroller.clientWidth, scroller.scrollLeft + amount * +pan.dataset.treePan),
    );
    syncTreePanButtons(scroller);
    scheduleTreePathConnectors();
    return;
  }
  const rewind = event.target.closest('button[data-tree-rewind]');
  if (rewind) {
    rewindExplorer(+rewind.dataset.treeRewind);
    return;
  }
  const choice = event.target.closest('button[data-tree-rank]');
  if (choice) {
    const parentDepth = +choice.dataset.parentDepth;
    const expectedParentFen =
      parentDepth === 0
        ? explorerState.rootFen
        : explorerState.path[parentDepth - 1]?.after;
    if (choice.dataset.parentFen !== expectedParentFen) return;
    chooseExplorerMoveAt(parentDepth, +choice.dataset.treeRank);
  }
});
tree2dBodyEl.addEventListener('scroll', (event) => {
  if (event.target.classList?.contains('tree2d-branch-scroll')) {
    syncTreePanButtons(event.target);
    scheduleTreePathConnectors();
  }
}, true);

// ─────────────────────────────────────────────── 路径网标签 + 与平面选路联动
function cloudMoveMeta(after) {
  return cloudFirstMoves.find((m) => m.after === after) || null;
}

function traceCloudRoute() {
  const route = [];
  let parentIndex = 0;
  for (let depth = 1; depth <= Math.min(SYNC_DEPTH, columns.length); depth++) {
    const c = columns[depth - 1], move = c.ranked[c.chosen];
    const fens = cloudLayerFens.get(depth), parents = cloudLayerParents.get(depth);
    const pos = layers.get(depth)?.pos;
    if (!fens || !parents || !pos) break;
    let index = -1;
    for (let i = 0; i < fens.length; i++) {
      if (parents[i] === parentIndex && fens[i] === move.after) { index = i; break; }
    }
    if (index < 0) break;
    const o = index * 3;
    route.push({
      depth, index, san: move.san,
      rank: c.chosen, parentFen: c.fen, after: move.after,
      from: move.from, to: move.to, promotion: move.promotion || '', score: move.score,
      position: [pos[o], pos[o + 1], pos[o + 2]],
    });
    parentIndex = index;
  }
  return route;
}

function traceExplorerRoute() {
  ensureExplorerRoot();
  const route = [];
  let parentIndex = 0;
  for (let depth = 1; depth <= Math.min(SYNC_DEPTH, explorerState.path.length); depth++) {
    const move = explorerState.path[depth - 1];
    const fens = cloudLayerFens.get(depth), parents = cloudLayerParents.get(depth);
    const pos = layers.get(depth)?.pos;
    if (!fens || !parents || !pos) break;
    let index = -1;
    for (let i = 0; i < fens.length; i++) {
      if (parents[i] === parentIndex && fens[i] === move.after) { index = i; break; }
    }
    if (index < 0) break;
    const o = index * 3;
    route.push({
      ...move, depth, index,
      parentFen: depth === 1 ? explorerState.rootFen : explorerState.path[depth - 2].after,
      position: [pos[o], pos[o + 1], pos[o + 2]],
    });
    parentIndex = index;
  }
  return route;
}

function explorerGraphChoices(route = traceExplorerRoute()) {
  const depth = explorerState.path.length + 1;
  if (depth > SYNC_DEPTH || explorerState.choices.length === 0) return [];
  const fens = cloudLayerFens.get(depth), parents = cloudLayerParents.get(depth);
  const pos = layers.get(depth)?.pos;
  if (!fens || !parents || !pos) return [];
  const parentIndex = route.at(-1)?.index ?? 0;
  const out = [];
  for (let rank = 0; rank < explorerState.choices.length && out.length < CLOUD_LABELS_MAX; rank++) {
    const move = explorerState.choices[rank];
    let index = -1;
    for (let i = 0; i < fens.length; i++) {
      if (parents[i] === parentIndex && fens[i] === move.after) { index = i; break; }
    }
    if (index >= 0) out.push({ move, rank, depth, index });
  }
  return out;
}

function focusExplorerNode() {
  const route = traceExplorerRoute();
  const step = route.at(-1);
  if (!step) {
    cloudTargetGoal.set(CLOUD_TARGET_X, 0, 0);
  } else {
    cloudTargetGoal.set(
      CLOUD_TARGET_X * 0.48 + step.position[0] * 0.52,
      step.position[1] * 0.52,
      step.position[2] * 0.52,
    );
  }
  setCloudMotion(false);
  requestCloudRender();
  return !!step;
}

function updateCloudRoute(route = traceCloudRoute()) {
  if (cloudRouteLine) {
    cloudGroup.remove(cloudRouteLine);
    cloudRouteLine.geometry.dispose();
    cloudRouteLine = null;
  }
  if (route.length === 0) {
    requestCloudRender();
    return;
  }
  const points = [0, 0, 0];
  for (const step of route) points.push(...step.position);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(points), 3));
  cloudRouteLine = new THREE.Line(geo, cloudRouteMaterial);
  cloudRouteLine.userData = { kind: 'selected-route', depth: route.length, san: route.map((s) => s.san).join(' ') };
  cloudRouteLine.frustumCulled = false;
  cloudRouteLine.renderOrder = 10;
  cloudGroup.add(cloudRouteLine);
  requestCloudRender();
}

function syncCloudMap() {
  if (cloudViewMode === '2d') {
    cloudLabelsEl.replaceChildren();
    updateCloudRoute([]);
    renderCloudTree2d();
    return;
  }
  const first = columns[0];
  const depthOne = layers.get(1);
  if (!first || !depthOne?.pos || cloudFirstMoves.length === 0) {
    cloudLabelsEl.replaceChildren();
    updateCloudRoute([]);
    return;
  }

  const exploring =
    explorerState.rootFen === game.fen()
    && (
      document.body.classList.contains('cloud-full')
      || explorerState.path.length > 0
    );
  if (exploring) {
    const route = traceExplorerRoute();
    const graphChoices = explorerGraphChoices(route);
    const labels = graphChoices.map(({ move, rank, depth, index }) =>
      `<button type="button" class="cloud-label cloud-move-label cloud-explore-label"`
      + ` data-depth="${depth}" data-index="${index}" data-explore-rank="${rank}" data-san="${esc(move.san)}"`
      + ` data-situation="${scoreSituation(move.score).key}" aria-pressed="false"`
      + ` title="预演 ${esc(move.san)} · 引擎原分 ${scoreText(move.score)}"`
      + ` style="--move-color:${cssColor(move.score, 1.25)}">`
      + `<b>${esc(move.san)}</b><small>${scoreSituation(move.score).short}</small></button>`
    ).join('');
    const breadcrumbs = route.map((step) => {
      const turn = fenTurnContext(step.parentFen);
      return `<button type="button" class="cloud-label cloud-path-label is-selected"`
        + ` data-depth="${step.depth}" data-index="${step.index}" data-explore-depth="${step.depth}"`
        + ` data-san="${esc(step.san)}"`
        + ` aria-label="回到第 ${turn.fullmove} 回合${turn.sideLabel} ${esc(step.san)}">`
        + `<small>${turn.fullmove}回合·${turn.sideLabel[0]}</small><b>${esc(step.san)}</b></button>`;
    }).join('');
    cloudLabelsEl.innerHTML =
      `<button type="button" class="cloud-label cloud-root-label${route.length === 0 ? ' is-selected' : ''}"`
      + ` data-depth="0" data-index="0" data-explore-depth="0">现在</button>${breadcrumbs}${labels}`;
    cloudChoiceEl.innerHTML = route.length
      ? `正在预演：<b>${explorerState.path.map((move) => esc(move.san)).join(' → ')}</b>；点线旁标签换走法`
      : '从「现在」出发；点线旁走法，右侧棋盘会显示真实走后局面';
    updateCloudRoute(route);
    requestCloudRender();
    return;
  }

  const ranks = [...Array(Math.min(CLOUD_LABELS_MAX, first.ranked.length)).keys()];
  if (!ranks.includes(first.chosen)) ranks[ranks.length - 1] = first.chosen;
  const labels = ranks.map((rank) => {
    const move = first.ranked[rank];
    const meta = cloudMoveMeta(move.after);
    if (!meta) return '';
    const selected = rank === first.chosen;
    return `<button type="button" class="cloud-label cloud-move-label${selected ? ' is-selected' : ''}"`
      + ` data-depth="1" data-index="${meta.index}" data-rank="${rank}" data-san="${esc(move.san)}"`
      + ` data-situation="${scoreSituation(move.score).key}" aria-pressed="${selected}"`
      + ` title="引擎原分 ${scoreText(move.score)}" style="--move-color:${cssColor(move.score, 1.25)}">`
      + `<b>${esc(move.san)}</b><small>${scoreSituation(move.score).short}</small></button>`;
  }).join('');
  const route = traceCloudRoute();
  const breadcrumbs = route.slice(1).map((step) => {
    const turn = fenTurnContext(step.parentFen);
    return `<div class="cloud-label cloud-path-label" data-depth="${step.depth}"`
      + ` data-index="${step.index}" data-san="${esc(step.san)}">`
      + `<small>${turn.fullmove}回合·${turn.sideLabel[0]}</small><b>${esc(step.san)}</b></div>`;
  }).join('');
  cloudLabelsEl.innerHTML =
    `<div class="cloud-label cloud-root-label" data-depth="0" data-index="0">现在</div>${labels}${breadcrumbs}`;

  const picked = columns.map((c) => c.ranked[c.chosen].san);
  cloudChoiceEl.innerHTML = `当前选路：<b>${picked.map(esc).join(' → ')}</b>`;
  updateCloudRoute(route);
  requestCloudRender();
}

const labelWorld = new THREE.Vector3();
const labelProjected = new THREE.Vector3();
const labelCameraSpace = new THREE.Vector3();
function positionCloudLabels() {
  if (cloudViewMode !== '3d') return;
  const full = document.body.classList.contains('cloud-full');
  const w = skyBox.clientWidth, h = skyBox.clientHeight;
  if (!layers.get(1)?.pos || !w || !h) return;
  const skyRect = skyBox.getBoundingClientRect();
  const exclusions = full
      ? [
        document.getElementById('cloudMapHud'),
        document.getElementById('cloudControls'),
        document.getElementById('cloudExplorer'),
        document.getElementById('skyHint'),
      ]
      .map((el) => el.getBoundingClientRect())
      .filter((r) => r.width > 0 && r.height > 0)
      .map((r) => ({
        left: r.left - skyRect.left - 12, right: r.right - skyRect.left + 12,
        top: r.top - skyRect.top - 12, bottom: r.bottom - skyRect.top + 12,
      }))
    : [];

  camera.updateMatrixWorld();
  const candidates = [];
  const labels = [...cloudLabelsEl.querySelectorAll('.cloud-label')];
  for (const el of labels) {
    const depth = +el.dataset.depth;
    const index = +el.dataset.index;
    if (depth === 0) labelWorld.set(0, 0, 0);
    else {
      const pos = layers.get(depth)?.pos;
      if (!pos) continue;
      const o = index * 3;
      labelWorld.set(pos[o], pos[o + 1], pos[o + 2]);
    }
    labelProjected.copy(labelWorld).project(camera);
    labelCameraSpace.copy(labelWorld).applyMatrix4(camera.matrixWorldInverse);
    const fogDistance = labelWorld.distanceTo(camera.position);
    const x = (labelProjected.x * 0.5 + 0.5) * w;
    const y = (-labelProjected.y * 0.5 + 0.5) * h;
    const inView =
      labelProjected.z > -1 && labelProjected.z < 1
      && fogDistance < scene.fog.far - 1
      && x > 32 && x < w - 32 && y > 30 && y < h - 30
      && !exclusions.some((r) => x > r.left && x < r.right && y > r.top && y < r.bottom);
    el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-50%)`;
    el.classList.remove('is-visible');
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
    if (inView && (full || depth <= 1)) {
      candidates.push({
        el, x, y, z: labelCameraSpace.z,
        priority:
          depth === 0 ? 10000
          : el.classList.contains('is-selected') ? 9000
          : el.classList.contains('cloud-path-label') ? 8600 - depth
          : labelCameraSpace.z,
      });
    }
  }

  candidates.sort((a, b) => b.priority - a.priority);
  const maxVisible = full ? (w <= 600 ? 6 : 10) : 3;
  const accepted = [];
  for (const item of candidates) {
    const collides = accepted.some((a) => Math.hypot(a.x - item.x, a.y - item.y) < (w <= 600 ? 58 : 72));
    if (collides || accepted.length >= maxVisible) continue;
    accepted.push(item);
    item.el.classList.add('is-visible');
    item.el.style.opacity = item.el.dataset.depth === '0' ? '0.94' : '1';
    item.el.style.pointerEvents = item.el.tagName === 'BUTTON' ? 'auto' : 'none';
  }
}

function focusCloudMove(after) {
  const meta = cloudMoveMeta(after), pos = layers.get(1)?.pos;
  if (!meta || !pos) return;
  const o = meta.index * 3;
  cloudTargetGoal.set(
    CLOUD_TARGET_X * 0.58 + pos[o] * 0.42,
    pos[o + 1] * 0.42,
    pos[o + 2] * 0.42,
  );
  setCloudMotion(false);
  requestCloudRender();
}

cloudLabelsEl.addEventListener('click', (ev) => {
  const explorerDepth = ev.target.closest
    ? ev.target.closest('button[data-explore-depth]')
    : null;
  if (explorerDepth) {
    ev.stopPropagation();
    rewindExplorer(+explorerDepth.dataset.exploreDepth);
    return;
  }
  const explorerChoice = ev.target.closest
    ? ev.target.closest('button[data-explore-rank]')
    : null;
  if (explorerChoice) {
    ev.stopPropagation();
    chooseExplorerMove(+explorerChoice.dataset.exploreRank);
    return;
  }
  const label = ev.target.closest ? ev.target.closest('button.cloud-move-label') : null;
  if (!label || !columns[0]) return;
  ev.stopPropagation();
  const rank = +label.dataset.rank;
  const after = columns[0].ranked[rank]?.after;
  if (chooseForkBranch(0, rank) && after) {
    chooseExplorerRootAfter(after);
    focusCloudMove(after);
  }
});

// ─────────────────────────────────────────────── 路径网视角
const DEFAULT_VIEW = Object.freeze({ yaw: 0.08, pitch: 0.15, dist: 29 });
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = motionPreference.matches;
const view = { ...DEFAULT_VIEW, auto: false };
const cloudTargetGoal = new THREE.Vector3(CLOUD_TARGET_X, 0, 0);
let renderFrameId = 0;
let cruiseTimer = 0;

function updateMotionButton() {
  const button = document.getElementById('cloudMotion');
  if (!button) return;
  button.setAttribute('aria-pressed', String(view.auto));
  button.textContent = `自动巡航：${view.auto ? '开' : '关'}`;
}

function scheduleCruise() {
  clearTimeout(cruiseTimer);
  cruiseTimer = 0;
  if (
    !view.auto
    || reducedMotion
    || document.hidden
    || !document.body.classList.contains('cloud-full')
  ) return;
  cruiseTimer = setTimeout(() => {
    cruiseTimer = 0;
    view.yaw += 0.0024;
    requestCloudRender();
    scheduleCruise();

  view.yaw -= (e.clientX - drag.x) * 0.005;
  view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch + (e.clientY - drag.y) * 0.005));

function resize() {
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  const full = document.body.classList.contains('cloud-full');
  const compactPointer =
    matchMedia('(pointer: coarse)').matches
    || Math.min(innerWidth, innerHeight) <= 520;
  const dpr = full
    ? Math.min(devicePixelRatio || 1, compactPointer ? 1.25 : 1.5)
    : 1;
  if (
    cloudViewMode === '3d'
    && (w !== rendererW || h !== rendererH || dpr !== rendererDpr)
  ) {
    rendererW = w;
    rendererH = h;
    rendererDpr = dpr;
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  const fw = forkWrap.clientWidth, fh = forkWrap.clientHeight;
  if (fw !== forkViewportW || fh !== forkViewportH) {
    forkViewportW = fw;
    forkViewportH = fh;
    // 思考阶段不为即将失效的中间局面重排分叉，避免 resize 把 watchdog 卡住。
    if (!thinking && !forkStale) renderFork(false, false);
  }
  if (cloudViewMode === '2d') scheduleTreePathConnectors();
  requestCloudRender();
}
function scheduleResize() {
  if (resizeFrame) return;
  resizeFrame = requestAnimationFrame(() => {
    resizeFrame = 0;
    resize();
  });
}

let cloudInView = true;
if ('IntersectionObserver' in window) {
  const cloudObserver = new IntersectionObserver((entries) => {
    cloudInView = entries.some((entry) => entry.isIntersecting);
    if (cloudInView) {
      maybeStartDeepCloud();
      requestCloudRender();
      return;
    }
    if (renderFrameId) {
      cancelAnimationFrame(renderFrameId);
      renderFrameId = 0;
    }

    // 第四层可能有几十万节点：离开视口就停，不截断冒充完整结果。
    // 已有三层时保留真实三层；尚未铺到三层则只重建到三层。
    if (cloudWorker && cloudWorkerTargetDepth === DEEP_DEPTH) {
      releaseDeepCloud();
    } else if (
      !cloudWorker
      && cloudState.depth === DEEP_DEPTH
      && cloudLayerFens.get(SYNC_DEPTH)?.length
    ) {
      // 长满后离开视口也释放最重的一层；回来看时从真实第 3 层完整续长。
      releaseDeepCloud();
    }
  }, { threshold: 0 });
  cloudObserver.observe(skyBox);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (renderFrameId) {
      cancelAnimationFrame(renderFrameId);
      renderFrameId = 0;
    }
    clearTimeout(cruiseTimer);
    cruiseTimer = 0;
    const baseComplete =
      cloudState.depth >= SYNC_DEPTH
      && !!cloudLayerFens.get(SYNC_DEPTH)?.length;
    if (cloudWorker) {
      cloudWorker.terminate();
      cloudWorker = null;
      cloudWorkerTargetDepth = 0;
    }
    if (baseComplete) {
      if (layers.has(DEEP_DEPTH)) removeCloudLayer(DEEP_DEPTH);
      restoreCloudTiming(SYNC_DEPTH);
      cloudState.depth = SYNC_DEPTH;
      // 即使 L4 Worker 尚未送来首批 geometry，也必须恢复“回来继续”的事实。
      cloudState.deepPending = true;
    }
    cloudState.growing = false;
    // 完整 L3 是可恢复基线：切后台只释放 L4，不重算 L1-L3，也不清用户的变体路径。
    cloudState.paused = !baseComplete;
    updateHud();
    return;
  }
  if (cloudState.paused && !thinking && cloudState.fen === game.fen()) {
    rebuildCloud();
  } else {
    cloudState.paused = false;
    maybeStartDeepCloud();
  }
  scheduleCruise();
  requestCloudRender();
});

function requestCloudRender() {
  if (cloudViewMode !== '3d' || renderFrameId || document.hidden) return false;
  renderFrameId = requestAnimationFrame(renderCloudFrame);
  return true;
}

function renderCloudFrame() {
  renderFrameId = 0;
  if (cloudViewMode !== '3d') return;
  const active = !document.hidden
    && (cloudInView || document.body.classList.contains('cloud-full'));
  if (!active) return;
  let settling = false;
  const targetDelta = cloudTarget.distanceToSquared(cloudTargetGoal);
  if (targetDelta > 0.0004) {
    if (reducedMotion) cloudTarget.copy(cloudTargetGoal);
    else {
      cloudTarget.lerp(cloudTargetGoal, 0.14);
      settling = true;
    }
  } else {
    cloudTarget.copy(cloudTargetGoal);
  }
  {
    const cp = Math.cos(view.pitch);
    // 竖屏全屏时保持近似相同的水平视野，避免路径网被放大裁成一块“背景”。
    const fitDist = view.dist / Math.min(1, Math.max(0.55, camera.aspect));
    camera.position.set(
      cloudTarget.x + Math.sin(view.yaw) * cp * fitDist,
      cloudTarget.y + Math.sin(view.pitch) * fitDist,
      cloudTarget.z + Math.cos(view.yaw) * cp * fitDist,
    );
    camera.lookAt(cloudTarget);
    renderer.render(scene, camera);
    positionCloudLabels();
  }
  if (settling) requestCloudRender();
}

/**

 * material 是实例真正继承到的 SVG paint，geometry 是实际子图元签名。

function pieceGeometryOf(root) {
  return [...root.querySelectorAll('path,ellipse,circle,rect,polygon')].map((part) => {
    const attrs = ['d', 'cx', 'cy', 'r', 'rx', 'ry', 'x', 'y', 'width', 'height', 'points']

      .filter(Boolean)
      .join(',');
    return `${part.tagName}:${attrs}`;
  }).join('|');
}

function cloudMapSnapshot() {
  const linkLayers = new Map();
  let firstLinks = 0;
  let routePoints = 0;
  let pointObjects = 0;
  let lineObjects = 0;
  let hiddenLineObjects = 0;
  let oddVertexObjects = 0;
  let colorMismatchObjects = 0;
  let partialDrawObjects = 0;
  let nonLineSegmentObjects = 0;
  let indexedLinkObjects = 0;
  let orphanRenderObjects = 0;
  for (const obj of cloudGroup.children) {
    const attr = obj.geometry?.getAttribute?.('position');
    if (!attr) continue;
    if (obj.isPoints) pointObjects++;
    if (obj.userData.kind === 'cloud-links') {
      const d = obj.userData.depth;
      if (!linkLayers.has(d)) linkLayers.set(d, { count: 0, positions: [], finite: true, objects: 0 });
      const rec = linkLayers.get(d);
      const edgeCount = attr.count / 2;
      rec.count += edgeCount;
      rec.objects++;
      lineObjects++;
      if (!obj.isLineSegments) nonLineSegmentObjects++;
      if (obj.geometry.index !== null) indexedLinkObjects++;
      if (!obj.visible || !obj.material?.visible || !(obj.material?.opacity > 0)) hiddenLineObjects++;
      if (attr.count % 2 !== 0) oddVertexObjects++;
      if (obj.geometry.getAttribute('color')?.count !== attr.count) colorMismatchObjects++;
      const draw = obj.geometry.drawRange;
      if (draw && (draw.start !== 0 || draw.count !== Infinity)) partialDrawObjects++;
      if (rec.finite) {
        for (let i = 0; i < attr.array.length; i++) {
          if (!Number.isFinite(attr.array[i])) { rec.finite = false; break; }
        }
      }
      if (d <= 1) {
        for (let i = 3; i + 2 < attr.array.length; i += 6) {
          rec.positions.push(attr.array[i], attr.array[i + 1], attr.array[i + 2]);
        }
      }
      if (d === 1) firstLinks += edgeCount;
    } else if (obj.userData.kind === 'selected-route') {
      routePoints += attr.count;
    } else if (obj.isLine || obj.isPoints) {
      orphanRenderObjects++;
    }
  }
  const labelList = [...cloudLabelsEl.querySelectorAll('.cloud-label')].map((el) => {
    const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    return {
      text: el.textContent.trim(), san: el.dataset.san || '',
      depth: +el.dataset.depth, index: +el.dataset.index,
      selected: el.classList.contains('is-selected'),
      visible:
        cs.display !== 'none' && cs.visibility !== 'hidden' && Number(cs.opacity) > 0.5
        && r.width > 0 && r.height > 0
        && r.right > 0 && r.bottom > 0 && r.left < innerWidth && r.top < innerHeight,
      x: (r.left + r.right) / 2, y: (r.top + r.bottom) / 2,
      w: r.width, h: r.height,
    };
  });
  const layerRows = [...linkLayers.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([depth, rec]) => ({
      depth,
      count: rec.count,
      positions: rec.positions,
      finite: rec.finite,
      objects: rec.objects,
    }));
  return {
    layers: layerRows,
    firstLinks,
    routePoints,
    pointObjects,
    lineObjects,
    hiddenLineObjects,
    oddVertexObjects,
    colorMismatchObjects,
    partialDrawObjects,
    nonLineSegmentObjects,
    indexedLinkObjects,
    orphanRenderObjects,
    groupVisible: cloudGroup.visible,
    labels: labelList,
    cameraMatrix: Array.from(camera.matrixWorld.elements),
    target: cloudTarget.toArray(),
    view: { yaw: view.yaw, pitch: view.pitch, dist: view.dist, auto: view.auto },
    renderFrameScheduled: renderFrameId !== 0,
    rendererFrame: renderer.info.render.frame,
  };
}

          && Number(badgeStyle.opacity) > 0
          && badgeRect.width > 0 && badgeRect.height > 0,
        selected: button.classList.contains('is-selected'),
        edgeSelected: edge?.dataset.selected === 'true',
        edgeVisible:
          !!edge && edgeStyle.display !== 'none' && edgeStyle.visibility !== 'hidden'
          && Number(edgeStyle.opacity) > 0
          && edgeRect.width > 0 && edgeRect.height > 0
          && edgeStyle.backgroundColor !== 'rgba(0, 0, 0, 0)',
        visible:
          style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0
          && rect.width > 0 && rect.height > 0
          && rect.right > 0 && rect.bottom > 0 && rect.left < innerWidth && rect.top < innerHeight,
        rect: {
          x: rect.x, y: rect.y, w: rect.width, h: rect.height,
          right: rect.right, bottom: rect.bottom,
        },
      };
    });
    const scroller = level.querySelector('.tree2d-branch-scroll');
    return {
      depth: Number(level.dataset.treeLevel),
      relativeDepth: Number(level.dataset.relativeDepth),
      absolutePly: Number(level.dataset.absolutePly),
      fullmove: Number(level.dataset.fullmove),
      side: level.dataset.side || '',
      heading: level.querySelector('.tree2d-level-head')?.textContent.trim() || '',
      parentFen: level.dataset.parentFen || '',
      claimedTotal: Number(level.querySelector('.tree2d-level-count')?.textContent),
      cards,
      cardCount: cards.length,
      selectedCards: cards.filter((card) => card.selected).length,
      edgeCount: level.querySelectorAll('[data-tree-edge]').length,
      selectedEdges: level.querySelectorAll('[data-tree-edge][data-selected="true"]').length,
      scroller: scroller ? {
        clientWidth: scroller.clientWidth,
        scrollWidth: scroller.scrollWidth,
        scrollLeft: scroller.scrollLeft,
      } : null,
    };
  });
  const pathConnectors = [...tree2dBodyEl.querySelectorAll('[data-tree-path-link]')]
    .map((link) => {
      const style = getComputedStyle(link);
      let length = 0;
      try { length = link.getTotalLength(); } catch (_) {}
      const sx = Number(link.dataset.sx);
      const sy = Number(link.dataset.sy);
      const ex = Number(link.dataset.ex);
      const ey = Number(link.dataset.ey);
      return {
        depth: Number(link.dataset.depth),
        fromFen: link.dataset.fromFen || '',
        toFen: link.dataset.toFen || '',
        d: link.getAttribute('d') || '',
        length,
        drawn:
          style.display !== 'none' && style.visibility !== 'hidden'
          && Number(style.opacity) > 0 && style.stroke !== 'none'
          && style.stroke !== 'rgba(0, 0, 0, 0)' && length > 0,
        from: { x: treeBodyRect.left + sx, y: treeBodyRect.top + sy },
        to: { x: treeBodyRect.left + ex, y: treeBodyRect.top + ey },
      };
    });
  const rootEl = tree2dBodyEl.querySelector('[data-tree-root]');
  const rootRect = rootEl?.getBoundingClientRect();
  const rootCount = Number(
    tree2dBodyEl.querySelector('.tree2d-root-count')?.textContent,
  );
  return {
    mode: cloudViewMode,
    full: document.body.classList.contains('cloud-full'),
    thinking,
    busy: cloudTree2dEl.getAttribute('aria-busy'),
    rootFen: explorerState.rootFen,
    renderedFen: explorerFen(),
    gameFen: game.fen(),
    gameHistory: game.history(),
    path: explorerState.path.map((move, index) => ({
      depth: index + 1,
      san: move.san,
      from: move.from,
      to: move.to,
      promotion: move.promotion || '',
      after: move.after,
    })),
    rootCount,
    rootContext: rootEl ? {
      completedPly: Number(rootEl.dataset.completedPly),
      fullmove: Number(rootEl.dataset.fullmove),
      side: rootEl.dataset.side || '',
      text: rootEl.textContent.trim(),
    } : null,
    levels,
    pathConnectors,
    rootRect: rootRect ? {
      x: rootRect.x, y: rootRect.y, w: rootRect.width, h: rootRect.height,
      right: rootRect.right, bottom: rootRect.bottom,
    } : null,
    hud: {
      stats: document.getElementById('cloudStats').textContent.trim(),
      count: document.getElementById('cloudCount').textContent.trim(),
      legend: cloudLayerLegendEl.textContent.trim(),
    },
    tree: {
      visible:
        treeStyle.display !== 'none' && treeStyle.visibility !== 'hidden'
        && treeRect.width > 0 && treeRect.height > 0,
      inert: cloudTree2dEl.inert,
      rect: {
        x: treeRect.x, y: treeRect.y, w: treeRect.width, h: treeRect.height,
        right: treeRect.right, bottom: treeRect.bottom,
      },
      clientWidth: tree2dScrollEl.clientWidth,
      clientHeight: tree2dScrollEl.clientHeight,
      scrollWidth: tree2dScrollEl.scrollWidth,
      scrollHeight: tree2dScrollEl.scrollHeight,
      scrollLeft: tree2dScrollEl.scrollLeft,
      scrollTop: tree2dScrollEl.scrollTop,
    },
    canvas: {
      visible:
        canvasStyle.display !== 'none' && canvasStyle.visibility !== 'hidden'
        && Number(canvasStyle.opacity) > 0,
      pointerEvents: canvasStyle.pointerEvents,
      rect: {
        x: canvasRect.x, y: canvasRect.y, w: canvasRect.width, h: canvasRect.height,
      },
    },
    modeButton: {
      text: modeButton.textContent.trim(),
      pressed: modeButton.getAttribute('aria-pressed'),
      visible:
        modeStyle.display !== 'none' && modeStyle.visibility !== 'hidden'
        && modeRect.width > 0 && modeRect.height > 0,
      rect: { x: modeRect.x, y: modeRect.y, w: modeRect.width, h: modeRect.height },
    },
  };
}

function renderStatsSnapshot() {
  return {
    rendererFrame: renderer.info.render.frame,
    scheduled: renderFrameId !== 0,
    auto: view.auto,
    reducedMotion,
    cameraMatrix: Array.from(camera.matrixWorld.elements),
    runningAnimations: document.getAnimations()
      .filter((animation) => animation.playState === 'running').length,
    dpr: renderer.getPixelRatio(),
    pixelWidth: canvas.width,
    pixelHeight: canvas.height,
    renderCalls: renderer.info.render.calls,
    geometries: renderer.info.memory.geometries,
    textures: renderer.info.memory.textures,
  };
}

/**
 * 棋子助手现状。候选数、回应和动画都从当前 DOM 现读，验收不会相信另一份影子状态。
 */
function coachSnapshot() {
  const cards = [...coachMovesEl.querySelectorAll('.coach-card')].map((card) => ({
    rank: Number(card.dataset.rank),
    san: card.dataset.san || '',
    from: card.dataset.from || '',
    to: card.dataset.to || '',
    promotion: card.dataset.promotion || '',
    after: card.dataset.after || '',
    score: card.dataset.score === undefined ? null : Number(card.dataset.score),
    situation: card.dataset.situation || '',
    quality: card.dataset.quality || '',
    active: card.classList.contains('is-active'),
    reply: {
      san: card.dataset.replySan || '',
      from: card.dataset.replyFrom || '',
      to: card.dataset.replyTo || '',
      piece: card.dataset.replyPiece || '',
      score: card.dataset.replyScore === '' || card.dataset.replyScore === undefined
        ? null
        : Number(card.dataset.replyScore),
    },
  }));
  const paths = [...boardOverlayEl.querySelectorAll('path.coach-path')].map((path) => {
    const style = getComputedStyle(path);
    return {
      step: path.dataset.step || '',
      lineId: path.dataset.lineId || '',
      san: path.dataset.san || '',
      from: path.dataset.from || '',
      to: path.dataset.to || '',
      d: path.getAttribute('d') || '',
      pathLength: Number(path.getAttribute('pathLength')),
      animationName: style.animationName,
      animationDuration: style.animationDuration,
      animationIterationCount: style.animationIterationCount,
    };
  });
  return {
    fen: game.fen(),
    selected,
    state: coachPanelEl.dataset.state,
    title: coachTitleEl.textContent,
    explain: coachExplainEl.textContent,
    cardCount: cards.length,
    cards,
    replyChips: [...coachReplyStripEl.querySelectorAll('.coach-reply-chip')].map((chip) => ({
      text: chip.textContent.trim(),
      rank: Number(chip.dataset.rank),
      san: chip.dataset.san || '',
      from: chip.dataset.from || '',
      to: chip.dataset.to || '',
      piece: chip.dataset.piece || '',
    })),
    paths,
    modelTotal: coachModel?.total || 0,
    activeRank: coachActiveRank,
    outcome: coachOutcome ? {
      actualRank: coachOutcome.actualRank,
      forecastRank: coachOutcome.forecastRank,
      fallback: coachOutcome.fallback,
      score: coachOutcome.score,
      situation: coachOutcome.situation.key,
    } : null,
    prediction: pendingCoachPrediction ? {
      candidate: { ...pendingCoachPrediction.candidate },
      replies: pendingCoachPrediction.replies.map((reply) => ({ ...reply })),
    } : null,
  };
}

/**
 * 响应式布局现状。所有尺寸都从当前 DOM 盒子现读，验收不镜像 CSS 断点，
 * 因而面板被裁掉、互相覆盖或把根页面撑宽时都藏不住。
 */
function layoutSnapshot() {
  const root = document.documentElement;
  const body = document.body;
  const box = (el) => {
    const r = el.getBoundingClientRect();
    return {
      x: r.x, y: r.y, w: r.width, h: r.height,
      right: r.right, bottom: r.bottom,
      docX: r.x + window.scrollX, docY: r.y + window.scrollY,
      docRight: r.right + window.scrollX, docBottom: r.bottom + window.scrollY,
    };
  };
  const forkWrapBox = box(forkWrap);
  const firstCard = forkEl.querySelector('g.card rect');
  return {
    viewport: {
      w: window.innerWidth,
      h: window.innerHeight,
      visualW: window.visualViewport ? window.visualViewport.width : window.innerWidth,
      visualH: window.visualViewport ? window.visualViewport.height : window.innerHeight,
      dpr: window.devicePixelRatio || 1,
    },
    root: {
      clientW: root.clientWidth, clientH: root.clientHeight,
      scrollW: root.scrollWidth, scrollH: root.scrollHeight,
    },
    body: { scrollW: body.scrollWidth, scrollH: body.scrollHeight },
    panels: Object.fromEntries(
      ['cloudPanel', 'boardPanel', 'stage'].map((id) => [id, box(document.getElementById(id))]),
    ),
    board: box(boardEl),
    skyBox: box(skyBox),
    skyCanvas: { ...box(canvas), pixelW: canvas.width, pixelH: canvas.height },
    forkWrap: {
      ...forkWrapBox,
      clientW: forkWrap.clientWidth, clientH: forkWrap.clientHeight,
      scrollW: forkWrap.scrollWidth, scrollH: forkWrap.scrollHeight,
      scrollLeft: forkWrap.scrollLeft, scrollTop: forkWrap.scrollTop,
    },
    controls: {
      buttons: [...document.querySelectorAll('button')].map(box).filter((r) => r.w > 0 && r.h > 0),
      firstCard: firstCard ? box(firstCard) : null,
    },
    cloudFull: body.classList.contains('cloud-full'),
  };
}

function resetGame(fen = null) {
  if (fen) {
    try { new Chess(fen); } catch { return false; }
  }
  aiRequestId++;
  presentationGen++;
  clearAiWatchdog();
  aiPending = null;
  restartSearchWorker();
  if (fen) game.load(fen); else game.reset();
  resetCloudView();
  selected = null;
  forkPreview = null;
  coachPreview = null;
  coachModel = null;
  coachActiveRank = null;
  coachOutcome = null;
  pendingCoachPrediction = null;
  pendingCoachOutcome = null;
  coachReplyCache.clear();
  lastAi = null;
  thinking = false;
  branchPath = [];
  expanded = [];
  forkStale = false;
  resetForkTransient();
  renderBoard();
  rebuildCloud();
  renderFork();
  if (cloudViewMode === '2d') renderExplorer();
  renderCoachIdle();
  setStatusText(fen
    ? `${game.turn() === 'w' ? '白方' : '黑方'}行棋。`
    : '你执白。点一枚白棋看预演；右侧从「现在」向右选路。');
  return true;
}

// 验收用的钩子：走的是和点棋盘完全同一条路
window.__test = {
  tryMove,
  state: () => ({
    fen: game.fen(), turn: game.turn(),
    history: game.history(), over: game.isGameOver(), thinking,
  }),
  ai: () => lastAi,
  aiPending: () => aiPending ? { id: aiPending.id, fen: aiPending.fen } : null,
  forkPending: () => forkStale,
  workerGeneration: () => searchWorkerGeneration,
  terminateAiWorker: () => {
    if (!searchWorker) return false;
    searchWorker.terminate();
    return true;
  },
  layout: layoutSnapshot,
  board: boardSnapshot,
  coach: coachSnapshot,
  scoreLanguage: (score, bestScore = score, white = true) => ({
    raw: scoreText(score),
    situation: scoreSituation(score),
    quality: moveQuality(score, bestScore, white),
  }),
  cloudMap: cloudMapSnapshot,
  explorer: explorerSnapshot,
  tree2d: tree2dSnapshot,
  renderStats: renderStatsSnapshot,
  setCloudVisible: (visible) => {
    cloudGroup.visible = !!visible;
    requestCloudRender();
    return cloudGroup.visible;
  },
  setCloudDepthVisible: (depth, visible) => {
    const rec = layers.get(Number(depth));
    if (!rec) return false;
    for (const obj of rec.objects) obj.visible = !!visible;
    requestCloudRender();
    return rec.objects.every((obj) => obj.visible === !!visible);
  },
  setCloudAuto: setCloudMotion,
  pickBranch: (col, idx) => chooseForkBranch(col, idx),
  expandCol: (col) => setColumnExpanded(col, true),
  collapseCol: (col) => setColumnExpanded(col, false),
  toggleCol: toggleColumnExpanded,
  skyRect: () => {
    const r = canvas.getBoundingClientRect();
    return { x: r.x, y: r.y, w: r.width, h: r.height };
  },
  setCloudMode: setCloudViewMode,
  chooseExplorer: chooseExplorerMove,
  toggleCloudFull,
  reset: () => resetGame(),
  loadFen: (fen) => resetGame(fen),
};

document.getElementById('btnReset').onclick = () => window.__test.reset();

updateCloudModeButton();
resize();
renderBoard();
rebuildCloud();
renderFork();
renderCoachIdle();
setStatus('你执白。点一枚白棋看预演；右侧从「现在」向右选路。');
</script>
</body>
</html>
