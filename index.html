      && x > 32 && x < w - 32 && y > 30 && y < h - 30
      && !exclusions.some((r) => x > r.left && x < r.right && y > r.top && y < r.bottom);
    el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-50%)`;
    el.classList.remove('is-visible');
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
    if (inView && (full || depth <= 1)) {
      candidates.push({
        el, x, y, z: labelCameraSpace.z,
        priority:
          depth === 0 ? 10000
          : el.classList.contains('is-selected') ? 9000
          : el.classList.contains('cloud-path-label') ? 8600 - depth
          : labelCameraSpace.z,
      });
    }
  }

  candidates.sort((a, b) => b.priority - a.priority);
  const maxVisible = full ? (w <= 600 ? 5 : 7) : 3;
  const accepted = [];
  for (const item of candidates) {
    const collides = accepted.some((a) => Math.hypot(a.x - item.x, a.y - item.y) < (w <= 600 ? 58 : 72));
    if (collides || accepted.length >= maxVisible) continue;
    accepted.push(item);
    item.el.classList.add('is-visible');
    item.el.style.opacity = item.el.dataset.depth === '0' ? '0.94' : '1';
    item.el.style.pointerEvents = item.el.tagName === 'BUTTON' ? 'auto' : 'none';
  }
}

function focusCloudMove(after) {
  const meta = cloudMoveMeta(after), pos = layers.get(1)?.pos;
  if (!meta || !pos) return;
  const o = meta.index * 3;
  cloudTargetGoal.set(
    CLOUD_TARGET_X * 0.58 + pos[o] * 0.42,
    pos[o + 1] * 0.42,
    pos[o + 2] * 0.42,
  );
  view.auto = false;
}

cloudLabelsEl.addEventListener('click', (ev) => {
  const label = ev.target.closest ? ev.target.closest('button.cloud-move-label') : null;
  if (!label || !columns[0]) return;
  ev.stopPropagation();
  const rank = +label.dataset.rank;
  const after = columns[0].ranked[rank]?.after;
  if (chooseForkBranch(0, rank) && after) focusCloudMove(after);
});

// ─────────────────────────────────────────────── 路径网视角
const DEFAULT_VIEW = Object.freeze({ yaw: 0.08, pitch: 0.15, dist: 29 });
const view = { ...DEFAULT_VIEW, auto: true };
const cloudTargetGoal = new THREE.Vector3(CLOUD_TARGET_X, 0, 0);
function resetCloudView() {
  view.yaw = DEFAULT_VIEW.yaw;
  view.pitch = DEFAULT_VIEW.pitch;
  view.dist = DEFAULT_VIEW.dist;
  view.auto = true;
  cloudTarget.set(CLOUD_TARGET_X, 0, 0);
  cloudTargetGoal.set(CLOUD_TARGET_X, 0, 0);
  return true;
}
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) { drag.moved = true; view.auto = false; }
  view.yaw -= (e.clientX - drag.x) * 0.005;
  view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch + (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY, moved: drag.moved };
});
canvas.addEventListener('pointerup', () => {
  if (drag && !drag.moved && !document.body.classList.contains('cloud-full')) {
    toggleCloudFull(true);                         // 小窗轻点才打开；全屏用明确的「收起」按钮
  }
  drag = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.dist = Math.max(8, Math.min(58, view.dist * (1 + Math.sign(e.deltaY) * 0.09)));
}, { passive: false });

function toggleCloudFull(force) {
  const next = typeof force === 'boolean'
    ? force
    : !document.body.classList.contains('cloud-full');
  document.body.classList.toggle('cloud-full', next);
  const full = document.body.classList.contains('cloud-full');
  const coarse = matchMedia('(pointer: coarse)').matches || innerWidth <= 760;
  document.getElementById('skyHint').textContent = full
    ? (coarse ? '拖动旋转 · 点标签选路' : '拖动旋转 · 滚轮缩放 · 点标签选路')
    : '点开全景 · 拖动旋转';
  scheduleResize();
  if (full) maybeStartDeepCloud();
  return full;
}
document.getElementById('cloudClose').onclick = () => toggleCloudFull(false);
document.getElementById('cloudResetView').onclick = resetCloudView;

let forkViewportW = -1, forkViewportH = -1, resizeFrame = 0;
function resize() {
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const fw = forkWrap.clientWidth, fh = forkWrap.clientHeight;
  if (fw !== forkViewportW || fh !== forkViewportH) {
    forkViewportW = fw;
    forkViewportH = fh;
    // 思考阶段不为即将失效的中间局面重排分叉，避免 resize 把 watchdog 卡住。
    if (!thinking && !forkStale) renderFork();
  }
}
function scheduleResize() {
  if (resizeFrame) return;
  resizeFrame = requestAnimationFrame(() => {
    resizeFrame = 0;
    resize();
  });
}
addEventListener('resize', scheduleResize);

let cloudInView = true;
if ('IntersectionObserver' in window) {
  const cloudObserver = new IntersectionObserver((entries) => {
    cloudInView = entries.some((entry) => entry.isIntersecting);
    if (cloudInView) {
      maybeStartDeepCloud();
      return;
    }

    // 第四层可能有几十万节点：离开视口就停，不截断冒充完整结果。
    // 已有三层时保留真实三层；尚未铺到三层则在屏外只重建到三层。
    if (cloudWorker && cloudWorkerTargetDepth === DEEP_DEPTH) {
      cloudWorker.terminate();
      cloudWorker = null;
      cloudWorkerTargetDepth = 0;
      if (cloudState.depth >= SYNC_DEPTH && cloudLayerFens.get(SYNC_DEPTH)?.length) {
        removeCloudLayer(DEEP_DEPTH);
        restoreCloudTiming(SYNC_DEPTH);
        cloudState.depth = SYNC_DEPTH;
        cloudState.growing = false;
        cloudState.deepPending = true;
        updateHud();
      } else if (!thinking) {
        const gen = prepareCloud();
        startCloudWorker({ gen, startDepth: 1, targetDepth: SYNC_DEPTH });
      }
    } else if (
      !cloudWorker
      && cloudState.depth === DEEP_DEPTH
      && cloudLayerFens.get(SYNC_DEPTH)?.length
    ) {
      // 长满后离开视口也释放最重的一层；回来看时从真实第 3 层完整续长。
      removeCloudLayer(DEEP_DEPTH);
      restoreCloudTiming(SYNC_DEPTH);
      cloudState.depth = SYNC_DEPTH;
      cloudState.growing = false;
      cloudState.deepPending = true;
      updateHud();
    }
  }, { threshold: 0 });
  cloudObserver.observe(skyBox);
}

addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (cloudWorker) {
      cloudWorker.terminate();
      cloudWorker = null;
      cloudWorkerTargetDepth = 0;
    }
    if (layers.has(DEEP_DEPTH)) {
      removeCloudLayer(DEEP_DEPTH);
      restoreCloudTiming(SYNC_DEPTH);
      cloudState.depth = Math.min(cloudState.depth, SYNC_DEPTH);
      cloudState.deepPending = cloudLayerFens.get(SYNC_DEPTH)?.length > 0;
    }
    cloudState.growing = false;
    cloudState.paused = true;
    updateHud();
    return;
  }
  if (cloudState.paused && !thinking && cloudState.fen === game.fen()) rebuildCloud();
});

function frame() {
  const active = !document.hidden
    && (cloudInView || document.body.classList.contains('cloud-full'));
  if (active) {
    if (view.auto) view.yaw += 0.0009;
    cloudTarget.lerp(cloudTargetGoal, 0.055);
    const cp = Math.cos(view.pitch);
    // 竖屏全屏时保持近似相同的水平视野，避免路径网被放大裁成一块“背景”。
    const fitDist = view.dist / Math.min(1, Math.max(0.55, camera.aspect));
    camera.position.set(
      cloudTarget.x + Math.sin(view.yaw) * cp * fitDist,
      cloudTarget.y + Math.sin(view.pitch) * fitDist,
      cloudTarget.z + Math.cos(view.yaw) * cp * fitDist,
    );
    camera.lookAt(cloudTarget);
    renderer.render(scene, camera);
    positionCloudLabels();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ─────────────────────────────────────────────── 对外的检查窗口
/**
 * 路径网现状。nodes / layers[].nodes 全部从真实非索引 LineSegments 的 position.count / 2 现读，
 * 不是我自己记的账，所以少画一条都藏不住。
 */
window.__cloudStats = () => {
  const layerList = builtDepths().map((d) => ({ depth: d, nodes: nodesAt(d) }));
  let total = 0;
  for (const l of layerList) total += l.nodes;
  return {
    fen: cloudState.fen,
    depth: cloudState.depth,
    nodes: nodesAt(cloudState.depth),
    ms: Math.round(cloudState.ms),
    layers: layerList,
    totalNodes: total,
    growing: cloudState.growing,
    deepPending: cloudState.deepPending,
    paused: cloudState.paused,
    error: cloudState.error,
  };
};

/**
 * 分叉图现状。cards 是从 SVG 里真数出来的卡片个数，total 是这一列声明的走法总数，
 * 所以「这一步一共有多少种」也能拿 chess.js 去对撞。
 */
window.__forkStats = () => columns.map((c, i) => ({
  col: i,
  ply: c.ply,
  fen: c.fen,
  total: c.ranked.length,
  cards: forkEl.querySelectorAll(`g.card[data-col="${i}"]`).length,
  shown: c.shown,
  baseShown: c.baseShown,
  expanded: c.expanded,
  selectedCards: forkEl.querySelectorAll(`g.card[data-col="${i}"][data-selected="true"]`).length,
  selectedEdges: forkEl.querySelectorAll(`path.branch-edge[data-col="${i}"][data-selected="true"]`).length,
  routeUnderlays: forkEl.querySelectorAll(`path.route-underlay[data-col="${i}"]`).length,
  toggleText: forkEl.querySelector(`g.more[data-col="${i}"] text`)?.textContent || '',
  chosenSan: c.ranked[c.chosen].san,
  chosenRank: c.chosen,
  topSans: c.ranked.slice(0, 3).map((m) => m.san),
  topScores: c.ranked.slice(0, 3).map((m) => m.score),
}));

/**
 * 棋盘现状。棋子清单从实际渲染的 g.piece3d 读取，测试可拿 FEN 独立逐格对撞；
 * material 是实例真正继承到的 SVG paint，geometry 是实际子图元签名。
 */
function boardSnapshot() {
  const boardRect = boardEl.getBoundingClientRect();
  const geometryOf = (root) => [...root.querySelectorAll('path,ellipse,circle,rect,polygon')].map((part) => {
    const attrs = ['d', 'cx', 'cy', 'r', 'rx', 'ry', 'x', 'y', 'width', 'height', 'points']
      .map((name) => part.hasAttribute(name) ? `${name}=${part.getAttribute(name)}` : '')
      .filter(Boolean)
      .join(',');
    return `${part.tagName}:${attrs}`;
  }).join('|');
  const pieces = [...boardPiecesEl.querySelectorAll('g.piece3d')].map((piece) => {
    const r = piece.getBoundingClientRect();
    const style = getComputedStyle(piece);
    return {
      sq: piece.dataset.sq,
      color: piece.dataset.color,
      type: piece.dataset.type,
      render: piece.dataset.render,
      material: style.getPropertyValue('--piece-main').trim(),
      parts: piece.querySelectorAll('path,ellipse,circle,rect,polygon').length,
      geometry: geometryOf(piece),
      rect: { x: r.x, y: r.y, w: r.width, h: r.height, right: r.right, bottom: r.bottom },
    };
  });
  return {
    fen: game.fen(),
    total: pieces.length,
    boardRect: {
      x: boardRect.x, y: boardRect.y, w: boardRect.width, h: boardRect.height,
      right: boardRect.right, bottom: boardRect.bottom,
    },
    pieces,
    templates: [...document.querySelectorAll('#boardPieceDefs [data-piece-template]')].map((model) => ({
      type: model.dataset.pieceTemplate,
      parts: model.querySelectorAll('path,ellipse,circle,rect,polygon').length,
      sideParts: model.querySelectorAll('.piece-side').length,
      shineParts: model.querySelectorAll('.piece-shine').length,
      groundShadows: model.querySelectorAll('.piece-ground-shadow').length,
      geometry: geometryOf(model),
    })),
    unicodeGlyphs: boardEl.querySelectorAll('text.glyph').length,
    renderModes: [...new Set(pieces.map((piece) => piece.render))],
  };
}

function cloudMapSnapshot() {
  const linkLayers = new Map();
  let firstLinks = 0;
  let routePoints = 0;
  let pointObjects = 0;
  let lineObjects = 0;
  let hiddenLineObjects = 0;
  let oddVertexObjects = 0;
  let colorMismatchObjects = 0;
  let partialDrawObjects = 0;
  let nonLineSegmentObjects = 0;
  let indexedLinkObjects = 0;
  let orphanRenderObjects = 0;
  for (const obj of cloudGroup.children) {
    const attr = obj.geometry?.getAttribute?.('position');
    if (!attr) continue;
    if (obj.isPoints) pointObjects++;
    if (obj.userData.kind === 'cloud-links') {
      const d = obj.userData.depth;
      if (!linkLayers.has(d)) linkLayers.set(d, { count: 0, positions: [], finite: true, objects: 0 });
      const rec = linkLayers.get(d);
      const edgeCount = attr.count / 2;
      rec.count += edgeCount;
      rec.objects++;
      lineObjects++;
      if (!obj.isLineSegments) nonLineSegmentObjects++;
      if (obj.geometry.index !== null) indexedLinkObjects++;
      if (!obj.visible || !obj.material?.visible || !(obj.material?.opacity > 0)) hiddenLineObjects++;
      if (attr.count % 2 !== 0) oddVertexObjects++;
      if (obj.geometry.getAttribute('color')?.count !== attr.count) colorMismatchObjects++;
      const draw = obj.geometry.drawRange;
      if (draw && (draw.start !== 0 || draw.count !== Infinity)) partialDrawObjects++;
      if (rec.finite) {
        for (let i = 0; i < attr.array.length; i++) {
          if (!Number.isFinite(attr.array[i])) { rec.finite = false; break; }
        }
      }
      if (d <= 1) {
        for (let i = 3; i + 2 < attr.array.length; i += 6) {
          rec.positions.push(attr.array[i], attr.array[i + 1], attr.array[i + 2]);
        }
      }
      if (d === 1) firstLinks += edgeCount;
    } else if (obj.userData.kind === 'selected-route') {
      routePoints += attr.count;
    } else if (obj.isLine || obj.isPoints) {
      orphanRenderObjects++;
    }
  }
  const labelList = [...cloudLabelsEl.querySelectorAll('.cloud-label')].map((el) => {
    const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    return {
      text: el.textContent.trim(), san: el.dataset.san || '',
      depth: +el.dataset.depth, index: +el.dataset.index,
      selected: el.classList.contains('is-selected'),
      visible:
        cs.display !== 'none' && cs.visibility !== 'hidden' && Number(cs.opacity) > 0.5
        && r.width > 0 && r.height > 0
        && r.right > 0 && r.bottom > 0 && r.left < innerWidth && r.top < innerHeight,
      x: (r.left + r.right) / 2, y: (r.top + r.bottom) / 2,
      w: r.width, h: r.height,
    };
  });
  const layerRows = [...linkLayers.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([depth, rec]) => ({
      depth,
      count: rec.count,
      positions: rec.positions,
      finite: rec.finite,
      objects: rec.objects,
    }));
  return {
    layers: layerRows,
    firstLinks,
    routePoints,
    pointObjects,
    lineObjects,
    hiddenLineObjects,
    oddVertexObjects,
    colorMismatchObjects,
    partialDrawObjects,
    nonLineSegmentObjects,
    indexedLinkObjects,
    orphanRenderObjects,
    groupVisible: cloudGroup.visible,
    labels: labelList,
    cameraMatrix: Array.from(camera.matrixWorld.elements),
    target: cloudTarget.toArray(),
  };
}

/**
 * 棋子助手现状。候选数、回应和动画都从当前 DOM 现读，验收不会相信另一份影子状态。
 */
function coachSnapshot() {
  const cards = [...coachMovesEl.querySelectorAll('.coach-card')].map((card) => ({
    rank: Number(card.dataset.rank),
    san: card.dataset.san || '',
    from: card.dataset.from || '',
    to: card.dataset.to || '',
    promotion: card.dataset.promotion || '',
    after: card.dataset.after || '',
    score: card.dataset.score === undefined ? null : Number(card.dataset.score),
    situation: card.dataset.situation || '',
    quality: card.dataset.quality || '',
    active: card.classList.contains('is-active'),
    reply: {
      san: card.dataset.replySan || '',
      from: card.dataset.replyFrom || '',
      to: card.dataset.replyTo || '',
      piece: card.dataset.replyPiece || '',
      score: card.dataset.replyScore === '' || card.dataset.replyScore === undefined
        ? null
        : Number(card.dataset.replyScore),
    },
  }));
  const paths = [...boardOverlayEl.querySelectorAll('path.coach-path')].map((path) => {
    const style = getComputedStyle(path);
    return {
      step: path.dataset.step || '',
      lineId: path.dataset.lineId || '',
      san: path.dataset.san || '',
      from: path.dataset.from || '',
      to: path.dataset.to || '',
      d: path.getAttribute('d') || '',
      pathLength: Number(path.getAttribute('pathLength')),
      animationName: style.animationName,
      animationDuration: style.animationDuration,
      animationIterationCount: style.animationIterationCount,
    };
  });
  return {
    fen: game.fen(),
    selected,
    state: coachPanelEl.dataset.state,
    title: coachTitleEl.textContent,
    explain: coachExplainEl.textContent,
    cardCount: cards.length,
    cards,
    replyChips: [...coachReplyStripEl.querySelectorAll('.coach-reply-chip')].map((chip) => ({
      text: chip.textContent.trim(),
      rank: Number(chip.dataset.rank),
      san: chip.dataset.san || '',
      from: chip.dataset.from || '',
      to: chip.dataset.to || '',
      piece: chip.dataset.piece || '',
    })),
    paths,
    modelTotal: coachModel?.total || 0,
    activeRank: coachActiveRank,
    outcome: coachOutcome ? {
      actualRank: coachOutcome.actualRank,
      forecastRank: coachOutcome.forecastRank,
      fallback: coachOutcome.fallback,
      score: coachOutcome.score,
      situation: coachOutcome.situation.key,
    } : null,
    prediction: pendingCoachPrediction ? {
      candidate: { ...pendingCoachPrediction.candidate },
      replies: pendingCoachPrediction.replies.map((reply) => ({ ...reply })),
    } : null,
  };
}

/**
 * 响应式布局现状。所有尺寸都从当前 DOM 盒子现读，验收不镜像 CSS 断点，
 * 因而面板被裁掉、互相覆盖或把根页面撑宽时都藏不住。
 */
function layoutSnapshot() {
  const root = document.documentElement;
  const body = document.body;
  const box = (el) => {
    const r = el.getBoundingClientRect();
    return {
      x: r.x, y: r.y, w: r.width, h: r.height,
      right: r.right, bottom: r.bottom,
      docX: r.x + window.scrollX, docY: r.y + window.scrollY,
      docRight: r.right + window.scrollX, docBottom: r.bottom + window.scrollY,
    };
  };
  const forkWrapBox = box(forkWrap);
  const firstCard = forkEl.querySelector('g.card rect');
  return {
    viewport: {
      w: window.innerWidth,
      h: window.innerHeight,
      visualW: window.visualViewport ? window.visualViewport.width : window.innerWidth,
      visualH: window.visualViewport ? window.visualViewport.height : window.innerHeight,
      dpr: window.devicePixelRatio || 1,
    },
    root: {
      clientW: root.clientWidth, clientH: root.clientHeight,
      scrollW: root.scrollWidth, scrollH: root.scrollHeight,
    },
    body: { scrollW: body.scrollWidth, scrollH: body.scrollHeight },
    panels: Object.fromEntries(
      ['cloudPanel', 'boardPanel', 'stage'].map((id) => [id, box(document.getElementById(id))]),
    ),
    board: box(boardEl),
    skyBox: box(skyBox),
    skyCanvas: { ...box(canvas), pixelW: canvas.width, pixelH: canvas.height },
    forkWrap: {
      ...forkWrapBox,
      clientW: forkWrap.clientWidth, clientH: forkWrap.clientHeight,
      scrollW: forkWrap.scrollWidth, scrollH: forkWrap.scrollHeight,
      scrollLeft: forkWrap.scrollLeft, scrollTop: forkWrap.scrollTop,
    },
    controls: {
      buttons: [...document.querySelectorAll('button')].map(box).filter((r) => r.w > 0 && r.h > 0),
      firstCard: firstCard ? box(firstCard) : null,
    },
    cloudFull: body.classList.contains('cloud-full'),
  };
}

function resetGame(fen = null) {
  if (fen) {
    try { new Chess(fen); } catch { return false; }
  }
  aiRequestId++;
  presentationGen++;
  clearAiWatchdog();
  aiPending = null;
  restartSearchWorker();
  if (fen) game.load(fen); else game.reset();
  resetCloudView();
  selected = null;
  forkPreview = null;
  coachPreview = null;
  coachModel = null;
  coachActiveRank = null;
  coachOutcome = null;
  pendingCoachPrediction = null;
  pendingCoachOutcome = null;
  coachReplyCache.clear();
  lastAi = null;
  thinking = false;
  branchPath = [];
  expanded = [];
  forkStale = false;
  resetForkTransient();
  renderBoard();
  rebuildCloud();
  renderFork();
  renderCoachIdle();
  setStatusText(fen
    ? `${game.turn() === 'w' ? '白方' : '黑方'}行棋。`
    : '你执白。点一枚白棋看预演；右侧从「现在」向右选路。');
  return true;
}

// 验收用的钩子：走的是和点棋盘完全同一条路
window.__test = {
  tryMove,
  state: () => ({
    fen: game.fen(), turn: game.turn(),
    history: game.history(), over: game.isGameOver(), thinking,
  }),
  ai: () => lastAi,
  aiPending: () => aiPending ? { id: aiPending.id, fen: aiPending.fen } : null,
  forkPending: () => forkStale,
  workerGeneration: () => searchWorkerGeneration,
  terminateAiWorker: () => {
    if (!searchWorker) return false;
    searchWorker.terminate();
    return true;
  },
  layout: layoutSnapshot,
  board: boardSnapshot,
  coach: coachSnapshot,
  scoreLanguage: (score, bestScore = score, white = true) => ({
    raw: scoreText(score),
    situation: scoreSituation(score),
    quality: moveQuality(score, bestScore, white),
  }),
  cloudMap: cloudMapSnapshot,
  setCloudVisible: (visible) => {
    cloudGroup.visible = !!visible;
    renderer.render(scene, camera);
    return cloudGroup.visible;
  },
  setCloudDepthVisible: (depth, visible) => {
    const rec = layers.get(Number(depth));
    if (!rec) return false;
    for (const obj of rec.objects) obj.visible = !!visible;
    renderer.render(scene, camera);
    return rec.objects.every((obj) => obj.visible === !!visible);
  },
  setCloudAuto: (auto) => {
    view.auto = !!auto;
    return view.auto;
  },
  pickBranch: (col, idx) => chooseForkBranch(col, idx),
  expandCol: (col) => setColumnExpanded(col, true),
  collapseCol: (col) => setColumnExpanded(col, false),
  toggleCol: toggleColumnExpanded,
  skyRect: () => {
    const r = canvas.getBoundingClientRect();
    return { x: r.x, y: r.y, w: r.width, h: r.height };
  },
  toggleCloudFull,
  reset: () => resetGame(),
  loadFen: (fen) => resetGame(fen),
};

document.getElementById('btnReset').onclick = () => window.__test.reset();

resize();
renderBoard();
rebuildCloud();
renderFork();
renderCoachIdle();
setStatus('你执白。点一枚白棋看预演；右侧从「现在」向右选路。');
</script>
