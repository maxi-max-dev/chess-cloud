<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060b" />
<title>可能性分叉 · chess-cloud</title>
<style>
  :root {
    --ink: #e8ecf6;
    --dim: #8c93a8;
    --faint: #5f6679;
    --warm: #ff7a1f;
    --cold: #2f86ff;
    --pick: #8fd8ff;
    --glass: rgba(14, 17, 27, 0.74);
    --edge: rgba(150, 170, 220, 0.16);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; }
  html { margin: 0; min-height: 100%; background: #05060b; }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05060b;
    position: relative;
    isolation: isolate;
  }
  body::before {
    content: "";
    position: fixed;
    z-index: -1;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 10% 8%, rgba(47,134,255,.11), transparent 42%),
      radial-gradient(ellipse at 90% 92%, rgba(255,122,31,.08), transparent 44%),
      linear-gradient(180deg, #070913 0%, #05060b 48%, #07070c 100%);
  }
  body {
    font: 14px/1.55 -apple-system, "SF Pro SC", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    position: fixed;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 16px;
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  button {
    font: inherit; font-size: 12px; color: var(--ink);
    background: rgba(120,150,220,.14); border: 1px solid var(--edge);
    border-radius: 9px; padding: 5px 11px; cursor: pointer;
  }
  button:hover { background: rgba(120,150,220,.26); }
  button:disabled { opacity: .38; cursor: default; }

  /* ── 左上：真实路径线网（点开后像知识图谱一样探索） */
  #cloudPanel { left: 22px; top: 22px; width: 434px; padding: 12px 16px 14px; }
  #cloudPanel h1 { margin: 0 0 7px; font-size: 13px; font-weight: 650; letter-spacing: .02em; }
  #cloudPanel h1 span { color: var(--faint); font-weight: 400; font-size: 11.5px; margin-left: 6px; }
  #skyBox {
    position: relative; width: 402px; height: 158px; border-radius: 9px; overflow: hidden;
    background:
      radial-gradient(circle at 48% 50%, rgba(52,72,106,.12), transparent 48%),
      #05060b;
    cursor: zoom-in;
  }
  #sky {
    display: block; width: 100%; height: 100%;
    touch-action: none; overscroll-behavior: contain;
    transition: opacity .16s ease;
  }
  #skyHint { position: absolute; right: 8px; bottom: 6px; font-size: 10.5px; color: #7b8296; pointer-events: none; }
  #cloudOpen {
    position: absolute; z-index: 5; left: 8px; bottom: 7px;
    min-height: 44px; padding: 7px 11px;
    color: #c8edff; background: rgba(11,20,32,.82);
  }
  #cloudLabels {
    position: absolute; z-index: 3; inset: 0;
    overflow: hidden; pointer-events: none; opacity: 1;
    transition: opacity .18s ease;
  }
  #cloudTree2d {
    display: none; position: absolute; z-index: 4; inset: 0;
    color: #dce8f8;
    background:
      linear-gradient(rgba(11,17,28,.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(11,17,28,.22) 1px, transparent 1px),
      radial-gradient(circle at 50% 8%, rgba(47,134,255,.13), transparent 50%),
      #05060b;
    background-size: 28px 28px, 28px 28px, auto, auto;
    overflow: hidden; cursor: default; touch-action: pan-y;
    overscroll-behavior: contain;
  }
  body.cloud-view-2d #sky {
    visibility: hidden; opacity: 0; pointer-events: none;
  }
  body.cloud-view-2d #cloudLabels { display: none; }
  body.cloud-view-2d #cloudTree2d { display: block; }
  body.cloud-view-2d #skyHint { display: none; }
  body.cloud-view-2d:not(.cloud-full) #skyBox {
    height: clamp(230px, 62vw, 280px);
    aspect-ratio: auto;
    cursor: default;
  }
  #tree2dPath {
    position: absolute; z-index: 3; left: 0; right: 0; top: 0;
    display: flex; gap: 5px; align-items: center;
    min-height: 49px; padding: 5px 112px 4px 8px;
    overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid rgba(143,216,255,.12);
    background: linear-gradient(180deg, rgba(5,7,13,.95), rgba(5,7,13,.72));
  }
  #tree2dPath button {
    flex: 0 0 auto; min-width: 44px; min-height: 40px; padding: 5px 9px;
    color: #a8dfff; background: rgba(30,57,83,.5);
  }
  #tree2dPath button.is-current {
    color: #fff; border-color: #8fd8ff; background: rgba(44,83,119,.82);
  }
  #tree2dScroll {
    position: absolute; inset: 49px 0 0;
    padding: 12px 8px 58px;
    overflow-x: hidden; overflow-y: auto;
    overscroll-behavior: contain; scrollbar-width: thin;
  }
  #tree2dLive {
    margin: 0 auto 10px; max-width: 660px; min-height: 18px;
    color: #8491a8; font-size: 10.5px; text-align: center;
  }
  #tree2dBody { position: relative; isolation: isolate; }
  #tree2dPathLinks {
    position: absolute; z-index: 1; left: 0; top: 0;
    overflow: visible; pointer-events: none;
  }
  .tree2d-path-link {
    fill: none; stroke: #8fd8ff; stroke-width: 2;
    stroke-linecap: round; vector-effect: non-scaling-stroke;
  }
  .tree2d-root {
    position: relative; z-index: 2; width: max-content; min-width: 116px; min-height: 50px;
    margin: 0 auto 24px; padding: 7px 13px;
    border: 1px solid rgba(126,224,168,.52); border-radius: 12px;
    color: #d9ffea; background: rgba(10,28,26,.92);
    box-shadow: 0 0 24px rgba(126,224,168,.12);
    text-align: center;
  }
  .tree2d-root b { display: block; font-size: 13px; }
  .tree2d-root small { display: block; color: #8fc4a5; font-size: 9.5px; }
  .tree2d-root::after {
    content: ""; position: absolute; left: 50%; bottom: -25px;
    width: 1px; height: 24px; background: rgba(126,224,168,.52);
  }
  .tree2d-level {
    position: relative; z-index: 2; margin: 0 auto 20px;
    border-radius: 12px;
  }
  .tree2d-level-head {
    display: flex; align-items: center; justify-content: center;
    min-height: 27px; padding: 3px 8px;
    color: #8996ae; font-size: 10px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .tree2d-level-copy {
    display: flex; flex: 1 1 auto; min-width: 0;
    flex-direction: column; gap: 2px; line-height: 1.25;
  }
  .tree2d-level-title { color: #cde9ff; font-size: 11px; font-weight: 600; }
  .tree2d-level-meta { color: #8996ae; font-size: 9.5px; }
  .tree2d-level-head b { color: #cde9ff; font-weight: 600; }
  .tree2d-row-nav { display: none; flex: 0 0 auto; gap: 5px; }
  .tree2d-row-nav[hidden] { display: none !important; }
  .tree2d-row-nav button {
    min-width: 44px; min-height: 44px; padding: 4px 9px;
    color: #b9e7ff; background: rgba(25,47,70,.72);
  }
  .tree2d-parent-stem {
    display: block; width: 1px; height: 12px; margin: 0 auto;
    background: rgba(143,216,255,.5);
  }
  .tree2d-branch-scroll {
    width: 100%; overflow-x: auto; overflow-y: hidden;
    touch-action: pan-x pan-y; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity; scrollbar-width: thin;
  }
  #tree2dScroll::-webkit-scrollbar,
  .tree2d-branch-scroll::-webkit-scrollbar {
    width: 6px; height: 6px; background: #080b12;
  }
  #tree2dScroll::-webkit-scrollbar-track,
  .tree2d-branch-scroll::-webkit-scrollbar-track { background: #080b12; }
  #tree2dScroll::-webkit-scrollbar-thumb,
  .tree2d-branch-scroll::-webkit-scrollbar-thumb {
    border: 1px solid #080b12; border-radius: 999px;
    background: rgba(143,216,255,.38);
  }
  .tree2d-branch-rail {
    display: flex; gap: 8px; justify-content: center;
    width: max-content; min-width: 100%;
    padding: 14px 10px 8px;
    border-top: 1px solid rgba(143,216,255,.28);
  }
  .tree2d-node-wrap {
    position: relative; flex: 0 0 126px; scroll-snap-align: center;
  }
  .tree2d-edge {
    position: absolute; left: 50%; top: -14px;
    width: 1px; height: 14px; background: rgba(143,216,255,.28);
  }
  .tree2d-edge[data-selected="true"] {
    width: 2px; background: #8fd8ff;
    box-shadow: 0 0 8px rgba(75,170,255,.7);
  }
  button.tree2d-choice {
    position: relative; width: 100%; min-height: 68px; padding: 7px 8px;
    border-color: color-mix(in srgb, var(--tree-color) 42%, transparent);
    color: #eaf3ff; background: rgba(14,20,32,.92);
    text-align: left;
  }
  button.tree2d-choice:hover { background: rgba(28,40,59,.98); }
  button.tree2d-choice.is-selected {
    border-color: #8fd8ff; background: rgba(34,67,99,.95);
    box-shadow: 0 0 0 1px rgba(143,216,255,.25), 0 0 18px rgba(47,134,255,.18);
  }
  .tree2d-choice b { display: block; font-size: 13px; line-height: 1.2; }
  .tree2d-choice small {
    display: block; margin-top: 3px; overflow: hidden;
    color: var(--tree-color); font-size: 10px; line-height: 1.3;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .tree2d-branch-badge {
    display: inline-block; margin-top: 5px; padding: 1px 6px;
    border: 1px solid rgba(143,216,255,.18); border-radius: 999px;
    color: #a9bad1; background: rgba(3,7,14,.45);
    font-size: 10.5px; line-height: 1.35; font-variant-numeric: tabular-nums;
  }
  .tree2d-selected-mark { color: #d9f3ff; }
  .tree2d-empty {
    min-height: 54px; padding: 13px;
    border: 1px dashed rgba(143,216,255,.22); border-radius: 10px;
    color: #8290a8; text-align: center; font-size: 11px;
  }
  .cloud-label {
    position: absolute; left: 0; top: 0;
    visibility: hidden; opacity: 0; pointer-events: none;
    transform: translate3d(-999px, -999px, 0);
    transition: opacity .14s ease;
    white-space: nowrap;
  }
  .cloud-label.is-visible { visibility: visible; }
  .cloud-root-label {
    min-height: 28px; padding: 4px 9px 4px 7px;
    border: 1px solid rgba(126,224,168,.42); border-radius: 999px;
    color: #baf4d1; background: rgba(6,16,18,.82);
    box-shadow: 0 0 22px rgba(126,224,168,.16);
    font-size: 11px; font-weight: 650;
  }
  .cloud-root-label::before {
    content: ""; display: inline-block; width: 11px; height: 2px;
    margin: 0 6px 3px 0; border-radius: 2px; background: #7ee0a8;
    box-shadow: 0 0 8px rgba(126,224,168,.58);
  }
  button.cloud-move-label {
    min-height: 44px; padding: 5px 10px;
    border-color: color-mix(in srgb, var(--move-color) 52%, transparent);
    border-radius: 11px; color: #f4f7ff;
    background: rgba(10,13,23,.82);
    box-shadow: 0 8px 22px rgba(0,0,0,.36);
    pointer-events: auto;
  }
  button.cloud-move-label:hover { background: rgba(24,30,46,.92); }
  button.cloud-move-label.is-selected {
    border-color: #8fd8ff;
    background: rgba(38,70,104,.9);
    box-shadow: 0 0 0 1px rgba(143,216,255,.28), 0 0 24px rgba(47,134,255,.24);
  }
  .cloud-move-label b { font-size: 13px; }
  .cloud-move-label small { margin-left: 6px; color: var(--move-color); font-size: 10px; }
  .cloud-path-label {
    min-height: 28px; padding: 4px 8px;
    border: 1px solid rgba(143,216,255,.34); border-radius: 9px;
    color: #c6eaff; background: rgba(18,34,52,.78);
    box-shadow: 0 0 16px rgba(47,134,255,.14);
    font-size: 10.5px;
  }
  .cloud-path-label b { font-size: 12px; }
  .cloud-path-label small { margin-right: 5px; color: #718aa6; }
  #cloudMapHud {
    display: none; position: absolute; z-index: 4;
    left: max(14px, env(safe-area-inset-left));
    top: max(14px, env(safe-area-inset-top));
    width: min(440px, calc(100% - 86px)); padding: 11px 13px;
    border: 1px solid rgba(150,170,220,.18); border-radius: 13px;
    color: #aab3c8; background: rgba(5,6,11,.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
  }
  #cloudMapHud b { color: #edf3ff; font-size: 12px; }
  #cloudLayerLegend { margin-top: 5px; font-size: 10.5px; color: #778198; font-variant-numeric: tabular-nums; }
  #cloudChoice { margin-top: 5px; min-height: 17px; color: #9edcff; font-size: 11px; }
  #cloudControls {
    display: flex; position: absolute; z-index: 7;
    top: 7px; right: 7px;
    gap: 6px; align-items: center;
  }
  #cloudControls button {
    min-width: 44px; min-height: 44px; padding: 7px 10px; pointer-events: auto;
    background: rgba(8,11,19,.78); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #cloudControls #cloudClose { min-width: 48px; }
  #cloudControls .cloud-full-only { display: none; }
  body.cloud-full #cloudControls .cloud-full-only { display: block; }
  #cloudMode { min-width: 92px; }
  #cloudMode[aria-pressed="true"] {
    color: #c8edff; border-color: rgba(143,216,255,.58);
    background: rgba(31,61,91,.9);
  }
  body.cloud-view-2d #cloudControls .cloud-3d-only { display: none !important; }
  #cloudMotion[aria-pressed="true"] { color: #bdefff; border-color: rgba(143,216,255,.55); }
  #cloudExplorer {
    display: none; position: absolute; z-index: 6;
    top: calc(max(10px, var(--safe-top)) + 60px);
    right: max(14px, var(--safe-right));
    bottom: max(14px, var(--safe-bottom));
    width: min(330px, calc(100% - 28px)); padding: 12px;
    border: 1px solid rgba(143,216,255,.22); border-radius: 15px;
    color: #dce8f8; background: rgba(7,10,17,.91);
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
  }
  #exploreHead { display: flex; align-items: center; gap: 8px; }
  #exploreHead b { font-size: 13px; }
  #exploreHead span { color: #7f8aa2; font-size: 10px; }
  #exploreReset { margin-left: auto; min-height: 38px; }
  #explorePath {
    display: flex; gap: 5px; margin-top: 8px; padding-bottom: 2px;
    overflow-x: auto; scrollbar-width: none;
  }
  #explorePath button {
    flex: 0 0 auto; min-height: 34px; padding: 4px 8px;
    color: #a8dfff; background: rgba(30,57,83,.45);
  }
  #explorePath button.is-current { color: #fff; border-color: #8fd8ff; background: rgba(44,83,119,.78); }
  #exploreBoard {
    display: block; width: min(100%, 236px); height: auto; aspect-ratio: 1;
    margin: 10px auto 8px; border-radius: 9px; background: #22293a;
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
  }
  #exploreSummary { min-height: 42px; color: #aebad0; font-size: 11px; line-height: 1.45; }
  #exploreSummary b { color: #f3f7ff; }
  #exploreChoices {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    max-height: min(30vh, 230px); margin-top: 8px; padding-right: 2px;
    overflow-y: auto; overscroll-behavior: contain;
  }
  #exploreChoices button {
    min-height: 46px; padding: 6px 8px; text-align: left;
    border-color: color-mix(in srgb, var(--choice-color) 38%, transparent);
    background: rgba(17,23,36,.82);
  }
  #exploreChoices button:hover { background: rgba(33,45,66,.92); }
  #exploreChoices b { display: block; font-size: 13px; }
  #exploreChoices small { display: block; margin-top: 2px; color: var(--choice-color); font-size: 9.5px; }
  body.cloud-full { overflow: hidden; overscroll-behavior: none; }
  body.cloud-full #cloudPanel {
    position: fixed;
    z-index: 100;
    inset: 0;
    width: auto;
    height: 100vh;
    height: 100dvh;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: #05060b;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  body.cloud-full #cloudPanel > h1,
  body.cloud-full #cloudStats { display: none; }
  body.cloud-full #skyBox {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    border-radius: 0;
    cursor: zoom-out;
  }
  body.cloud-full #cloudLabels { opacity: 1; }
  body.cloud-full #cloudMapHud,
  body.cloud-full #cloudExplorer { display: block; }
  body.cloud-full #cloudControls {
    display: flex;
    top: max(10px, var(--safe-top));
    right: max(10px, var(--safe-right));
  }
  body.cloud-full #cloudTree2d {
    inset:
      calc(max(10px, var(--safe-top)) + 56px)
      calc(330px + max(32px, calc(var(--safe-right) + 18px)))
      max(14px, var(--safe-bottom))
      max(14px, var(--safe-left));
    border: 1px solid rgba(143,216,255,.18);
    border-radius: 15px;
    box-shadow: 0 18px 60px rgba(0,0,0,.34);
  }
  body.cloud-full #cloudTree2d .tree2d-branch-rail {
    padding-inline: max(10px, calc(50% - 63px));
  }
  body.cloud-full #cloudTree2d .tree2d-level-head {
    justify-content: space-between; min-height: 48px; text-align: left;
  }
  body.cloud-full #cloudTree2d .tree2d-row-nav { display: flex; }
  body.cloud-full #cloudTree2d .tree2d-branch-scroll { scrollbar-width: none; }
  body.cloud-full #cloudTree2d .tree2d-branch-scroll::-webkit-scrollbar { display: none; }
  body.cloud-full.cloud-view-2d #cloudMapHud { display: none; }
  body.cloud-full #cloudOpen { display: none; }
  body.cloud-full #skyHint {
    right: max(14px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    padding: 6px 9px;
    border: 1px solid rgba(150,170,220,.18);
    border-radius: 999px;
    color: #b5bed4;
    background: rgba(5,6,11,.62);
  }
  #cloudStats { margin-top: 8px; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #cloudStats b { color: var(--ink); font-weight: 600; }
  .grow { color: #7ee0a8; }

  body.cloud-view-2d:not(.cloud-full) #tree2dScroll { padding-top: 5px; }
  body.cloud-view-2d:not(.cloud-full) #tree2dLive,
  body.cloud-view-2d:not(.cloud-full) .tree2d-root,
  body.cloud-view-2d:not(.cloud-full) .tree2d-level:not(.is-frontier) { display: none; }
  body.cloud-view-2d:not(.cloud-full) .tree2d-level { margin-bottom: 0; }
  body.cloud-view-2d:not(.cloud-full) .tree2d-level-head { min-height: 25px; }
  body.cloud-view-2d:not(.cloud-full) .tree2d-parent-stem { height: 7px; }
  body.cloud-view-2d:not(.cloud-full) .tree2d-branch-rail { padding-bottom: 8px; }
  body.cloud-view-2d:not(.cloud-full) #tree2dScroll,
  body.cloud-view-2d:not(.cloud-full) .tree2d-branch-scroll { scrollbar-width: none; }
  body.cloud-view-2d:not(.cloud-full) #tree2dScroll::-webkit-scrollbar,
  body.cloud-view-2d:not(.cloud-full) .tree2d-branch-scroll::-webkit-scrollbar { display: none; }

  /* 固定双栏按真实可用高度连续收紧，始终给左下棋盘留出间隔。 */
  @media (min-width: 1101px) and (min-height: 781px) {
    body.cloud-view-2d:not(.cloud-full) #skyBox {
      height: max(128px, min(280px, calc(100vh - 644px)));
    }
  }

  /* ── 左下：棋盘 */
  #boardPanel { left: 22px; bottom: 22px; width: 434px; padding: 15px 16px 12px; }
  #board {
    display: block; width: 380px; height: 380px; margin: 0 auto;
    border-radius: 8px; overflow: hidden; touch-action: manipulation;
    background: #22293a;
  }
  /* 棋子完全由本地 SVG 几何组成，不再依赖系统 Unicode 棋子字形。
     黑白双方共用六种造型，只切换材质，避免某些系统把白棋也画成黑色。 */
  .chess-board .piece3d { pointer-events: none; user-select: none; }
  .chess-board .piece3d[data-color="w"] {
    --piece-main: url(#board-white-main);
    --piece-side: url(#board-white-side);
    --piece-edge: #626d82;
    --piece-shine: rgba(255,255,255,.92);
    --piece-cut: #747f93;
  }
  .chess-board .piece3d[data-color="b"] {
    --piece-main: url(#board-black-main);
    --piece-side: url(#board-black-side);
    --piece-edge: #a8b3c7;
    --piece-shine: rgba(216,228,247,.72);
    --piece-cut: #020309;
  }
  .chess-board .piece-ground-shadow { fill: rgba(2,4,10,.34); }
  .chess-board .piece-body {
    fill: var(--piece-main);
    stroke: var(--piece-edge);
    stroke-width: .85;
    stroke-linejoin: round;
  }
  .chess-board .piece-side {
    fill: var(--piece-side);
    stroke: var(--piece-edge);
    stroke-width: .72;
    stroke-linejoin: round;
  }
  .chess-board .piece-shine {
    fill: none;
    stroke: var(--piece-shine);
    stroke-width: 1.15;
    stroke-linecap: round;
    opacity: .72;
  }
  .chess-board .piece-cut {
    fill: none;
    stroke: var(--piece-cut);
    stroke-width: 2.1;
    stroke-linecap: round;
  }
  .chess-board .piece-eye {
    fill: var(--piece-cut);
    stroke: var(--piece-shine);
    stroke-width: .55;
  }
  #board .coach-path {
    fill: none; pointer-events: none; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    vector-effect: non-scaling-stroke;
  }
  #board .coach-path[data-step="you"] {
    stroke: #ffd36a; stroke-width: 5;
    filter: drop-shadow(0 0 5px rgba(255,211,106,.62));
    animation: coach-you-flow 1.5s ease-in-out 1 both;
  }
  #board .coach-path[data-step="reply"] {
    stroke: #65b8ff; stroke-width: 4;
    filter: drop-shadow(0 0 5px rgba(70,155,255,.58));
    animation: coach-reply-flow 1.5s ease-in-out 1 both;
  }
  #board .coach-target {
    fill: none; pointer-events: none; vector-effect: non-scaling-stroke;
    animation: coach-target-pulse 1.5s ease-in-out 1 both;
  }
  #board .coach-target[data-step="you"] { stroke: #ffd36a; stroke-width: 3; }
  #board .coach-target[data-step="reply"] { stroke: #65b8ff; stroke-width: 3; animation-delay: .4s; }
  #board .coach-tag {
    font-size: 10px; font-weight: 700; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: rgba(5,6,11,.9); stroke-width: 4px; stroke-linejoin: round;
  }
  #board .coach-tag[data-step="you"] { fill: #ffe4a0; }
  #board .coach-tag[data-step="reply"] { fill: #a9d8ff; }
  @keyframes coach-you-flow {
    0% { stroke-dashoffset: 1; opacity: 0; }
    7% { opacity: 1; }
    34% { stroke-dashoffset: 0; opacity: 1; }
    54%, 100% { stroke-dashoffset: 0; opacity: .72; }
  }
  @keyframes coach-reply-flow {
    0%, 34% { stroke-dashoffset: 1; opacity: 0; }
    42% { opacity: 1; }
    72% { stroke-dashoffset: 0; opacity: 1; }
    90%, 100% { stroke-dashoffset: 0; opacity: .68; }
  }
  @keyframes coach-target-pulse {
    0%, 18%, 100% { r: 7px; opacity: .18; }
    34% { r: 12px; opacity: .9; }
    55%, 100% { r: 8px; opacity: .42; }
  }
  #status { margin-top: 10px; min-height: 34px; font-size: 13px; color: var(--dim); }
  #status b { color: var(--ink); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 9px; flex-wrap: wrap; }

  /* ── 右侧主舞台：平面分叉图 */
  #stage { left: 478px; right: 22px; top: 22px; bottom: 22px; display: flex; flex-direction: column; padding: 0; }
  #stageHead { padding: 14px 20px 11px; border-bottom: 1px solid var(--edge); }
  #stageHead h2 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  #stageHead .sub { font-size: 11.5px; color: var(--dim); }
  #coachPanel {
    margin-top: 10px; padding: 10px 11px;
    border: 1px solid rgba(143,216,255,.16); border-radius: 12px;
    background: linear-gradient(135deg, rgba(31,43,65,.62), rgba(13,17,28,.46));
  }
  #coachLead { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  #coachLead .coach-kicker {
    flex: 0 0 auto; color: #9edcff; font-size: 10px; font-weight: 750;
    letter-spacing: .08em; text-transform: uppercase;
  }
  #coachTitle { color: #edf3ff; font-size: 12.5px; font-weight: 650; }
  #coachExplain { margin-left: auto; color: #747e96; font-size: 10.5px; text-align: right; }
  #coachMoves {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;
    margin-top: 8px;
  }
  #coachMoves:empty { display: none; }
  .coach-card {
    min-width: 0; min-height: 74px; padding: 8px 9px; text-align: left;
    border-color: rgba(150,170,220,.16); border-radius: 10px;
    background: rgba(12,16,27,.72);
  }
  .coach-card:hover { background: rgba(29,39,59,.84); }
  .coach-card.is-active {
    border-color: #8fd8ff;
    background: rgba(43,74,108,.72);
    box-shadow: 0 0 0 1px rgba(143,216,255,.16), 0 8px 22px rgba(0,0,0,.18);
  }
  .coach-card-top { display: flex; align-items: baseline; gap: 7px; }
  .coach-san { color: #fff; font-size: 15px; font-weight: 700; }
  .coach-quality { color: #d8e4f4; font-size: 10px; }
  .coach-situation { display: block; margin-top: 3px; color: var(--situation-color); font-size: 11.5px; font-weight: 650; }
  .coach-reply { display: block; margin-top: 4px; overflow: hidden; color: #8e99b2; font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
  .coach-raw { display: block; color: #596176; font-size: 9.5px; font-variant-numeric: tabular-nums; }
  #coachReplyStrip {
    display: flex; gap: 6px; align-items: center; margin-top: 8px; overflow-x: auto;
    color: #7e879d; font-size: 10px; scrollbar-width: none;
  }
  #coachReplyStrip:empty { display: none; }
  .coach-reply-chip {
    flex: 0 0 auto; padding: 3px 7px; border: 1px solid rgba(101,184,255,.18);
    border-radius: 999px; color: #aacbe8; background: rgba(30,53,78,.38);
  }
  #coachPanel[data-state="thinking"] #coachTitle { color: #ffdf91; }
  #coachPanel[data-state="outcome"] { border-color: rgba(126,224,168,.25); }
  #moveLine { margin-top: 9px; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--faint); }
  #moveLine b { color: #dfd2a2; font-weight: 600; }
  #moveLine .num { color: #4b5165; margin-right: 2px; }
  #forkWrap { flex: 1; min-width: 0; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y; }
  #fork { display: block; }
  #fork path { vector-effect: non-scaling-stroke; }
  #fork .branch-edge { stroke-linecap: round; transition: opacity .14s ease; }
  #fork .branch-edge:not([data-selected="true"]) { opacity: .72; }
  #fork .route-underlay {
    fill: none; stroke: rgba(47,134,255,.22); stroke-width: 7;
    stroke-linecap: round; filter: drop-shadow(0 0 7px rgba(47,134,255,.34));
  }
  #fork .branch-edge[data-selected="true"] {
    stroke: #8fd8ff; stroke-width: 2.8;
    filter: drop-shadow(0 0 5px rgba(75,170,255,.76));
  }
  #fork g.card { cursor: pointer; }
  #fork g.card[data-selected="true"] { filter: drop-shadow(0 0 6px rgba(88,176,255,.24)); }
  #fork g.more { cursor: pointer; }
  #forkFoot { padding: 10px 20px 13px; border-top: 1px solid var(--edge); font-size: 12px; color: var(--dim); min-height: 58px; }
  #forkFoot b { color: var(--ink); }

  /* 中等宽度或矮视口：回到文档流，左栏和主舞台不再因 fixed 定位互相覆盖。 */
  @media (max-width: 1100px), (max-height: 780px) {
    html, body { height: auto; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      display: grid;
      grid-template-columns: minmax(320px, 434px) minmax(360px, 1fr);
      grid-template-areas:
        "cloud stage"
        "board stage";
      gap: 16px;
      align-items: start;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    #cloudPanel, #boardPanel, #stage {
      position: relative;
      inset: auto;
      width: 100%;
      min-width: 0;
    }
    #cloudPanel { grid-area: cloud; padding: 12px 15px 14px; }
    #skyBox { width: 100%; height: auto; aspect-ratio: 402 / 158; }
    #boardPanel { grid-area: board; padding: 14px 15px 12px; }
    #board { width: min(100%, 380px); height: auto; aspect-ratio: 1; }
    #stage { grid-area: stage; min-height: 720px; }
    button { min-height: 44px; padding: 8px 13px; }
  }

  /* 手机竖屏：先下棋，再看分叉，最后保留完整路径网入口。 */
  @media (max-width: 760px) {
    .panel {
      background: rgba(11,14,23,.96);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    body {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "board"
        "stage"
        "cloud";
      gap: 12px;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }
    #boardPanel, #cloudPanel { padding: 12px; }
    #stage {
      height: min(720px, 72dvh);
      min-height: 600px;
    }
    #stageHead { padding: 13px 14px 10px; }
    #stageHead .sub { line-height: 1.6; }
    #coachLead { flex-wrap: wrap; }
    #coachExplain { width: 100%; margin-left: 0; text-align: left; }
    #coachMoves {
      display: flex; overflow-x: auto; scroll-snap-type: x proximity;
      padding-bottom: 2px; scrollbar-width: none;
    }
    .coach-card { flex: 0 0 min(78%, 250px); scroll-snap-align: start; }
    #moveLine { line-height: 1.7; }
    #forkFoot { padding: 10px 14px 12px; min-height: 70px; }
    body.cloud-full #cloudControls {
      left: max(10px, var(--safe-left));
      right: max(10px, var(--safe-right));
      justify-content: flex-end;
      overflow-x: auto;
      scrollbar-width: none;
    }
    body.cloud-full #cloudControls button { flex: 0 0 auto; padding-inline: 9px; }
    body.cloud-full #cloudMotion { max-width: 106px; overflow: hidden; white-space: nowrap; }
    body.cloud-full #cloudMapHud {
      top: calc(max(10px, var(--safe-top)) + 54px);
      width: calc(100% - 28px); padding: 8px 10px;
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    body.cloud-full.cloud-view-2d #cloudTree2d {
      inset:
        calc(max(10px, var(--safe-top)) + 54px)
        max(10px, var(--safe-right))
        calc(min(330px, 42dvh) + max(20px, calc(var(--safe-bottom) + 10px)))
        max(10px, var(--safe-left));
    }
    body.cloud-full #cloudExplorer {
      left: max(10px, var(--safe-left));
      right: max(10px, var(--safe-right));
      top: auto; bottom: max(10px, var(--safe-bottom));
      width: auto; height: min(330px, 42dvh); padding: 9px;
      display: grid; grid-template-columns: 142px minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 6px 10px;
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    #exploreHead { grid-column: 1 / -1; }
    #exploreReset, #explorePath button { min-height: 44px; min-width: 44px; }
    button.cloud-root-label, button.cloud-path-label { min-width: 44px; min-height: 44px; }
    #explorePath { grid-column: 1 / -1; margin-top: 0; }
    #exploreBoard { grid-column: 1; grid-row: 3; width: 142px; margin: 0; align-self: start; }
    #exploreSummary {
      grid-column: 2; grid-row: 3; min-height: 0;
      max-height: 46px; overflow: hidden;
    }
    #exploreChoices {
      grid-column: 2; grid-row: 3; align-self: stretch;
      grid-template-columns: 1fr; max-height: none; margin-top: 52px;
    }
    #exploreChoices button { min-height: 44px; }
    body.cloud-full #skyHint { display: none; }
  }

  /* 常见手机横屏：利用横向空间保留棋盘 + 分叉双栏，整页仍可纵向滚动。 */
  @media (min-width: 560px) and (max-width: 950px) and (max-height: 520px) and (orientation: landscape) {
    body {
      grid-template-columns: minmax(276px, 44%) minmax(0, 1fr);
      grid-template-areas:
        "board stage"
        "cloud stage";
      gap: 8px;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
    }
    #boardPanel, #cloudPanel { padding: 8px; }
    #stage { height: auto; min-height: 620px; }
    #stageHead .sub { display: none; }
    #coachPanel { padding: 8px; }
    body.cloud-full #cloudMapHud {
      top: 64px; left: 8px; width: calc(52% - 16px);
    }
    body.cloud-full.cloud-view-2d #cloudTree2d {
      inset:
        calc(max(8px, var(--safe-top)) + 56px)
        calc(min(310px, 48vw) + max(16px, calc(var(--safe-right) + 8px)))
        max(8px, var(--safe-bottom))
        max(8px, var(--safe-left));
    }
    body.cloud-full #cloudExplorer {
      left: auto; right: max(8px, var(--safe-right));
      top: calc(max(8px, var(--safe-top)) + 56px);
      bottom: max(8px, var(--safe-bottom));
      width: min(310px, 48vw); height: auto; padding: 8px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 5px 8px;
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    #exploreHead { grid-column: 1 / -1; }
    #exploreReset, #explorePath button { min-width: 44px; min-height: 44px; }
    button.cloud-root-label, button.cloud-path-label { min-width: 44px; min-height: 44px; }
    #explorePath { grid-column: 1 / -1; margin-top: 0; }
    #exploreBoard {
      grid-column: 1; grid-row: 3;
      width: 112px; margin: 0; align-self: start;
    }
    #exploreSummary {
      grid-column: 2; grid-row: 3;
      min-height: 0; max-height: 44px; overflow: hidden;
    }
    #exploreChoices {
      grid-column: 2; grid-row: 3; align-self: stretch;
      grid-template-columns: 1fr; max-height: none; margin-top: 48px;
    }
    #exploreChoices button { min-height: 44px; }
    body.cloud-full #skyHint { display: none; }
  }

  @media (max-width: 480px) {
    body.cloud-full:not(.cloud-view-2d) #cloudControls {
      flex-wrap: wrap;
    }
    body.cloud-full:not(.cloud-view-2d) #cloudMapHud {
      top: calc(max(10px, var(--safe-top)) + 102px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #board .coach-path, #board .coach-target { animation: none !important; opacity: .82; stroke-dashoffset: 0; }
    .cloud-label { transition: none; }
  }

</style>
</head>
<body>

<div class="panel" id="cloudPanel">
  <h1>全景路径网<span id="cloudCount">正在展开…</span></h1>
  <div id="skyBox">
    <canvas id="sky"></canvas>
    <div id="cloudLabels" aria-label="路径网走法"></div>
    <section id="cloudTree2d" aria-label="二维路径树" aria-hidden="true">
      <nav id="tree2dPath" aria-label="二维树当前路径"></nav>
      <div id="tree2dScroll">
        <div id="tree2dLive" aria-live="polite"></div>
        <div id="tree2dBody"></div>
      </div>
    </section>
    <div id="cloudMapHud">
      <b>从一个局面，沿真实线条长出所有未来</b>
      <div id="cloudLayerLegend">正在读取真实路径数…</div>
      <div id="cloudChoice">拖动观察；点走法标签，只选路线、不直接落子</div>
    </div>
    <div id="cloudControls" aria-label="路径网视角控制">
      <button id="cloudClose" class="cloud-full-only" type="button" aria-label="收起路径网">收起</button>
      <button id="cloudMode" type="button" aria-pressed="false" aria-label="切到二维路径树">切到 2D 树</button>
      <button id="cloudZoomOut" class="cloud-full-only cloud-3d-only" type="button" aria-label="缩小路径网">－</button>
      <button id="cloudZoomIn" class="cloud-full-only cloud-3d-only" type="button" aria-label="放大路径网">＋</button>
      <button id="cloudResetView" class="cloud-full-only cloud-3d-only" type="button">回到全景</button>
      <button id="cloudMotion" class="cloud-full-only cloud-3d-only" type="button" aria-pressed="false">自动巡航：关</button>
    </div>
    <aside id="cloudExplorer" aria-label="变体棋盘">
      <div id="exploreHead">
        <b>变体棋盘</b><span>走后即时评估 · 不改变实战</span>
        <button id="exploreReset" type="button">回到现在</button>
      </div>
      <div id="explorePath" aria-label="变体路径"></div>
      <svg id="exploreBoard" class="chess-board" viewBox="0 0 400 400"
           xmlns="http://www.w3.org/2000/svg" role="img" aria-label="变体预演棋盘">
        <g id="exploreSquares"></g>
        <g id="explorePieces"></g>
        <g id="exploreOverlay"></g>
      </svg>
      <div id="exploreSummary"></div>
      <div id="exploreChoices" aria-label="这个局面的其他走法"></div>
    </aside>
    <button id="cloudOpen" type="button">放大探索</button>
    <div id="skyHint">拖动观察</div>
  </div>
  <div id="cloudStats">—</div>
</div>

<div class="panel" id="boardPanel">
  <svg id="board" class="chess-board" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"
       role="grid" aria-label="国际象棋棋盘，白方在下">
    <defs id="boardPieceDefs">
      <linearGradient id="board-white-main" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fffef8"/>
        <stop offset=".38" stop-color="#f1eee5"/>
        <stop offset=".72" stop-color="#cbd1dc"/>
        <stop offset="1" stop-color="#929caf"/>
      </linearGradient>
      <linearGradient id="board-white-side" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#e8e7e1"/>
        <stop offset=".58" stop-color="#b9c0cf"/>
        <stop offset="1" stop-color="#7d879b"/>
      </linearGradient>
      <linearGradient id="board-black-main" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#68748a"/>
        <stop offset=".28" stop-color="#3d4658"/>
        <stop offset=".7" stop-color="#171b25"/>
        <stop offset="1" stop-color="#05070c"/>
      </linearGradient>
      <linearGradient id="board-black-side" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#303747"/>
        <stop offset=".55" stop-color="#11151e"/>
        <stop offset="1" stop-color="#020307"/>
      </linearGradient>

      <!-- 六种 Staunton 风格的分层矢量模型。模板不会直接渲染；每颗棋克隆同一份几何。 -->
      <g id="board-piece-p" data-piece-template="p">

        <path class="piece-side" d="M8 39.5 Q25 36.2 42 39.5 L39.7 44 Q25 47 10.3 44Z"/>
        <path class="piece-body" d="M11 37.8 Q25 34.8 39 37.8 L42 40.8 Q25 44.1 8 40.8Z"/>
        <path class="piece-body" d="M16 36.5 C18.2 31.8 21.4 29.1 21.7 21.3 H28.3 C28.6 29.1 31.8 31.8 34 36.5Z"/>
        <ellipse class="piece-side" cx="25" cy="21.5" rx="9" ry="3.1"/>

      </g>

      <g id="board-piece-r" data-piece-template="r">
        <ellipse class="piece-ground-shadow" cx="25" cy="44.5" rx="18" ry="3"/>
        <path class="piece-side" d="M7.5 39.5 Q25 36.2 42.5 39.5 L40 44.2 Q25 47.2 10 44.2Z"/>
        <path class="piece-body" d="M10 37.7 Q25 34.7 40 37.7 L42.5 40.8 Q25 44 7.5 40.8Z"/>
        <path class="piece-body" d="M15 36.6 L17.3 17 H32.7 L35 36.6Z"/>

        <ellipse class="piece-side" cx="25" cy="17" rx="10.7" ry="3"/>
        <path class="piece-body" d="M13 7.2 H19 V11.1 H22.2 V7.2 H27.8 V11.1 H31 V7.2 H37 V17.2 Q25 20.5 13 17.2Z"/>
        <path class="piece-shine" d="M18.6 21 L17.2 33.3"/>
        <path class="piece-shine" d="M15.5 9 V15"/>
      </g>

      <g id="board-piece-n" data-piece-template="n">
        <ellipse class="piece-ground-shadow" cx="25" cy="44.5" rx="18" ry="3"/>
        <path class="piece-side" d="M7.5 39.5 Q25 36.2 42.5 39.5 L40 44.2 Q25 47.2 10 44.2Z"/>
        <path class="piece-body" d="M10 37.7 Q25 34.7 40 37.7 L42.5 40.8 Q25 44 7.5 40.8Z"/>
        <path class="piece-body" d="M14.8 36.7 C16.3 30.6 18.5 25.9 23.3 21.7 C19 19.2 18.4 14.2 21 7.2 L26 11 L29.1 8.7 C35.2 12.1 38 16.3 37 21.7 L31.1 18.8 C32.6 24.8 29.8 28.2 27.2 31.4 L34.8 36.7Z"/>
        <path class="piece-side" d="M29.1 8.7 C35.2 12.1 38 16.3 37 21.7 L31.1 18.8 C32.6 24.8 29.8 28.2 27.2 31.4 L31 36.7 H34.8 L27.2 31.4 C31 26.8 34.2 21.3 29.1 8.7Z"/>
        <path class="piece-shine" d="M22.6 10.2 C20.9 15.4 22.1 18.2 25.2 20.1"/>
        <circle class="piece-eye" cx="29.2" cy="14.5" r="1.25"/>
        <path class="piece-cut" d="M31.5 19.1 L35 20.2"/>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { Chess, rankMoves, MATE } from './engine.js';

// ─────────────────────────────────────────────── 常量
const SYNC_DEPTH = 3;      // 缩略态只预备到这一层；计算仍全部在 Worker
const DEEP_DEPTH = 4;      // 用户明确放大探索时，Worker 才渐进生长到这一层
const AI_BUDGET_MS = 1300; // 给冷启动/调度留出余量；迭代加深到时交卷，应手硬上限 ≤3 秒
const COMPACT_AI_BUDGET_MS = 900;  // 手机/矮视口给渲染与触控留足余量，守住总应手 ≤3 秒
const AI_WATCHDOG_MS = 2200; // Worker/JIT 再慢也在这里切到预存的合法保底步
const BATCH_PARENTS = 400; // L4 渐进回传；完成后合并为一个真实 geometry，压低交互 draw call
const ROOT_FAN = 0.34;      // 第一层只向「未来」方向张开，不再围成球壳
const CLOUD_TARGET_X = 8.2; // 镜头看树体中段，让「现在」留在画面左边
const CLOUD_LABELS_MAX = 8; // 只标少量真实走法，不能给几十万条路径造 DOM

const COLS = 5;                    // 分叉图往前排几步
const SHOW = [7, 6, 5, 4, 4];      // 每列先列出几条（其余折起来）
const RANK_DEPTH = 2;              // 排序往前看几步

// 路径网每层往外推多远 / 散开的锥半角 / 线条不透明度，下标 = 层号
const STEP    = [0, 9.0, 5.6, 3.7, 2.25];
const SPREAD  = [0, 0, 0.26, 0.17, 0.11];
// 深层依然逐条真实绘制，但压低透明度，避免 20 万条线重新糊成一个发光球。
const EDGE_OPAC = [0.92, 0.80, 0.18, 0.032, 0.004];

const GOLDEN = 2.39996322972865332;

// ─────────────────────────────────────────────── three.js 场景
const canvas = document.getElementById('sky');
const skyBox = document.getElementById('skyBox');
const cloudLabelsEl = document.getElementById('cloudLabels');
const cloudTree2dEl = document.getElementById('cloudTree2d');
const tree2dPathEl = document.getElementById('tree2dPath');
const tree2dScrollEl = document.getElementById('tree2dScroll');
const tree2dLiveEl = document.getElementById('tree2dLive');
const tree2dBodyEl = document.getElementById('tree2dBody');
const cloudLayerLegendEl = document.getElementById('cloudLayerLegend');
const cloudChoiceEl = document.getElementById('cloudChoice');
let cloudViewMode = '3d';
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(1); // 缩略窗固定 DPR1；全屏按设备能力提升，避免小窗白烧像素
renderer.setClearColor(0x05060b, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05060b, 30, 74);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 4000);
const cloudGroup = new THREE.Group();
const cloudTarget = new THREE.Vector3(CLOUD_TARGET_X, 0, 0);
scene.add(cloudGroup);

const lineMaterials = EDGE_OPAC.map((opacity) => new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity,
  depthWrite: false,
  blending: THREE.NormalBlending,
}));
const cloudRouteMaterial = new THREE.LineBasicMaterial({
  color: 0x8fd8ff, transparent: true, opacity: 0.92,
  depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
});

// ─────────────────────────────────────────────── 颜色：分数 → 暖冷
// 分数正 = 白优（暖），负 = 黑优（冷）。路径网和分叉图共用这一个映射。
const WARM = [1.00, 0.44, 0.08];
const COLD = [0.10, 0.46, 1.00];
const EVEN = [0.55, 0.53, 0.55];   // 均势得是真中性灰，不然「黑优」和「均势」分不开
const COLOR_FULL = 120;            // 多少百分兵算「一边倒」（≈一个兵）

function mixColor(score) {
  let t = score / COLOR_FULL;
  if (t > 1) t = 1; else if (t < -1) t = -1;
  const k = Math.sign(t) * Math.pow(Math.abs(t), 0.55);
  const target = k >= 0 ? WARM : COLD;
  const a = Math.abs(k);
  return [
    EVEN[0] + (target[0] - EVEN[0]) * a,
    EVEN[1] + (target[1] - EVEN[1]) * a,
    EVEN[2] + (target[2] - EVEN[2]) * a,
  ];
}
function writeColorBytes(out, o, score, dim = 1) {
  const c = mixColor(score);
  out[o] = Math.round(c[0] * dim * 255);
  out[o + 1] = Math.round(c[1] * dim * 255);
  out[o + 2] = Math.round(c[2] * dim * 255);
}
function cssColor(score, boost = 1) {
  const c = mixColor(score);
  const b = (v) => Math.round(Math.min(1, v * boost) * 255);
  return `rgb(${b(c[0])},${b(c[1])},${b(c[2])})`;
}

// ─────────────────────────────────────────────── 路径网的层账本
// 铁律：路径数一律从几何体 position.count / 2 现读，绝不自己记数。
const layers = new Map();
let cloudState = {
  fen: '', depth: 0, ms: 0, workerMs: 0, mainMs: 0,
  growing: false, deepPending: false, error: '', paused: false, gen: 0,
};
let cloudFirstMoves = [];
let cloudRouteLine = null;
const cloudLayerFens = new Map();
const cloudLayerParents = new Map();
const cloudTimingByDepth = new Map();

function nodesAt(depth) {
  const rec = layers.get(depth);
  if (!rec) return 0;
  let n = 0;
  // 路径树里每个节点恰有一条入边；一条 LineSegments 边固定两个真实顶点。
  for (const obj of rec.objects) n += obj.geometry.attributes.position.count / 2;
  return n;
}
function builtDepths() { return [...layers.keys()].sort((a, b) => a - b); }

function clearCloud() {
  for (const rec of layers.values()) {
    for (const obj of rec.objects) { cloudGroup.remove(obj); obj.geometry.dispose(); }
  }
  if (cloudRouteLine) {
    cloudGroup.remove(cloudRouteLine);
    cloudRouteLine.geometry.dispose();
    cloudRouteLine = null;
  }
  cloudFirstMoves = [];
  cloudLayerFens.clear();
  cloudLayerParents.clear();
  cloudTimingByDepth.clear();
  cloudLabelsEl.replaceChildren();
  layers.clear();
  requestCloudRender();
}

function removeCloudLayer(depth) {
  const rec = layers.get(depth);
  if (!rec) return;
  for (const obj of rec.objects) {
    cloudGroup.remove(obj);
    obj.geometry.dispose();
  }
  layers.delete(depth);
  requestCloudRender();
}

function mergeCloudLayer(depth) {
  const rec = layers.get(depth);
  if (!rec || rec.objects.length <= 1) return false;
  let positionCount = 0;
  for (const obj of rec.objects) {
    positionCount += obj.geometry.getAttribute('position')?.count || 0;
  }
  if (positionCount === 0) return false;
  const positions = new Float32Array(positionCount * 3);
  const colors = new Uint8Array(positionCount * 3);
  let offset = 0;
  for (const obj of rec.objects) {
    const position = obj.geometry.getAttribute('position');
    const color = obj.geometry.getAttribute('color');
    positions.set(position.array, offset * 3);
    colors.set(color.array, offset * 3);
    offset += position.count;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Uint8BufferAttribute(colors, 3, true));
  const merged = new THREE.LineSegments(
    geometry,
    lineMaterials[Math.min(depth, lineMaterials.length - 1)],
  );
  merged.userData = { kind: 'cloud-links', depth };
  merged.frustumCulled = false;
  for (const obj of rec.objects) {
    cloudGroup.remove(obj);
    obj.geometry.dispose();
  }
  cloudGroup.add(merged);
  rec.objects = [merged];
  requestCloudRender();
  return true;
}

function discardPartialDeepLayer() {
  if (!layers.has(DEEP_DEPTH)) return false;
  removeCloudLayer(DEEP_DEPTH);
  restoreCloudTiming(SYNC_DEPTH);
  cloudState.depth = Math.min(cloudState.depth, SYNC_DEPTH);
  return true;
}

function restoreCloudTiming(depth) {
  const timing = cloudTimingByDepth.get(depth);
  if (!timing) return;
  cloudState.workerMs = timing.workerMs;
  cloudState.mainMs = timing.mainMs;
  cloudState.ms = timing.workerMs + timing.mainMs;
}

function releaseDeepCloud() {
  const wasGrowingDeep = cloudWorker && cloudWorkerTargetDepth === DEEP_DEPTH;
  if (wasGrowingDeep) {
    cloudWorker.terminate();
    cloudWorker = null;
    cloudWorkerTargetDepth = 0;
  }
  if (layers.has(DEEP_DEPTH)) removeCloudLayer(DEEP_DEPTH);
  if (cloudLayerFens.get(SYNC_DEPTH)?.length) {
    restoreCloudTiming(SYNC_DEPTH);
    cloudState.depth = SYNC_DEPTH;
    cloudState.growing = false;
    cloudState.deepPending = true;
    updateHud();
    requestCloudRender();
    return true;
  }
  if (wasGrowingDeep && !thinking) {
    const gen = prepareCloud({ preserveExplorer: true });
    startCloudWorker({ gen, startDepth: 1, targetDepth: SYNC_DEPTH });
  }
  return wasGrowingDeep;
}

function hash01(n) {
  const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return s - Math.floor(s);
}

function addRoot(score) {
  // 用一条很短的“过去 → 现在”线表示根；终点严格是原点，2 个顶点 = 1 个真实根节点。
  const pos = new Float32Array([0, 0, 0]);
  const edgePos = new Float32Array([-0.55, 0, 0, 0, 0, 0]);
  const edgeCol = new Uint8Array([45, 91, 73, 126, 224, 168]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(edgePos, 3));
  geo.setAttribute('color', new THREE.Uint8BufferAttribute(edgeCol, 3, true));
  const obj = new THREE.LineSegments(geo, lineMaterials[0]);
  obj.userData = { kind: 'cloud-links', depth: 0 };
  obj.frustumCulled = false;
  cloudGroup.add(obj);
  layers.set(0, { objects: [obj], pos, dir: new Float32Array([1, 0, 0]) });
}

/**
 * 往第 depth 层追加一批父→子路径。每批都单独开一个「刚好这么大」的 BufferGeometry：
 * 不预分配、不用 drawRange；一条边两个顶点，position.count / 2 就是真实路径节点数。
 */
function appendLayer(depth, parents, scores) {
  const n = parents.length;
  if (n === 0) {
    if (!layers.has(depth)) layers.set(depth, { objects: [], pos: null, dir: null });
    return;
  }
  const parent = layers.get(depth - 1);
  const ppos = parent.pos, pdir = parent.dir;
  const step = STEP[depth], spread = SPREAD[depth];

  // 最深层没有下一代，不保存也不临时分配 child pos/dir；局中可少掉十余 MB GC 压力。
  const keepLayout = depth < DEEP_DEPTH;
  const pos = keepLayout ? new Float32Array(n * 3) : null;
  const dir = keepLayout ? new Float32Array(n * 3) : null;
  const edgePos = new Float32Array(n * 6);
  const edgeCol = new Uint8Array(n * 6);

  let i = 0;
  while (i < n) {
    const p = parents[i];
    let k = 1;
    while (i + k < n && parents[i + k] === p) k++;   // 同一个父亲的孩子是连续一段

    const px = ppos[p * 3], py = ppos[p * 3 + 1], pz = ppos[p * 3 + 2];
    const ax = pdir[p * 3], ay = pdir[p * 3 + 1], az = pdir[p * 3 + 2];

    let hx = 0, hy = 0;
    if (Math.abs(ax) < 0.9) hx = 1; else hy = 1;
    let ux = ay * 0 - az * hy, uy = az * hx - ax * 0, uz = ax * hy - ay * hx;
    const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
    const vx = ay * uz - az * uy, vy = az * ux - ax * uz, vz = ax * uy - ay * ux;
    const phi0 = hash01(p + depth * 131.7) * 6.28318530718;

    for (let j = 0; j < k; j++) {
      // 每一层都沿父节点的前进方向张开。第一层用较宽的锥角，
      // 所以画面语义是「一个现在 → 向右长出的未来」，而不是包住根点的球壳。
      const fan = depth === 1 ? ROOT_FAN : spread;
      const a = fan * Math.sqrt((j + 0.5) / k);
      const ph = phi0 + j * GOLDEN;
      const sa = Math.sin(a), ca = Math.cos(a);
      const wx = ux * Math.cos(ph) + vx * Math.sin(ph);
      const wy = uy * Math.cos(ph) + vy * Math.sin(ph);
      const wz = uz * Math.cos(ph) + vz * Math.sin(ph);
      let cx = ax * ca + wx * sa, cy = ay * ca + wy * sa, cz = az * ca + wz * sa;
      const l = Math.hypot(cx, cy, cz) || 1; cx /= l; cy /= l; cz /= l;
      // 径向抖动：孩子不落在同一个半径上，不然每层都是一层壳
      const jr = depth >= 2 ? 0.72 + 0.58 * hash01(p * 3.7 + j * 11.31 + depth * 57.3) : 1;
      const o = (i + j) * 3;
      const childX = px + cx * step * jr;
      const childY = py + cy * step * jr;
      const childZ = pz + cz * step * jr;
      if (keepLayout) {
        dir[o] = cx; dir[o + 1] = cy; dir[o + 2] = cz;
        pos[o] = childX; pos[o + 1] = childY; pos[o + 2] = childZ;
      }
      const eo = (i + j) * 6;
      edgePos[eo] = px; edgePos[eo + 1] = py; edgePos[eo + 2] = pz;
      edgePos[eo + 3] = childX; edgePos[eo + 4] = childY; edgePos[eo + 5] = childZ;
      writeColorBytes(edgeCol, eo, scores[i + j], 0.34);
      writeColorBytes(edgeCol, eo + 3, scores[i + j], 1);
    }
    i += k;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(edgePos, 3));
  geo.setAttribute('color', new THREE.Uint8BufferAttribute(edgeCol, 3, true));
  const obj = new THREE.LineSegments(geo, lineMaterials[Math.min(depth, lineMaterials.length - 1)]);
  obj.userData = { kind: 'cloud-links', depth };
  obj.frustumCulled = false;
  cloudGroup.add(obj);

  let rec = layers.get(depth);
  if (!rec) { rec = { objects: [], pos: null, dir: null }; layers.set(depth, rec); }
  rec.objects.push(obj);
  if (keepLayout) { rec.pos = pos; rec.dir = dir; }
  requestCloudRender();
}

// ─────────────────────────────────────────────── 棋局 + Worker
const game = new Chess();
let selected = null;
let thinking = false;
let lastAi = null;
let aiClock = 0;
let aiRequestId = 0;
let aiPending = null;
let aiWatchdog = 0;
let searchWorker = null;
let searchWorkerGeneration = 0;

function clearAiWatchdog() {
  if (aiWatchdog) clearTimeout(aiWatchdog);
  aiWatchdog = 0;
}

function createSearchWorker() {
  const worker = new Worker('./worker.js', { type: 'module' });
  searchWorker = worker;
  searchWorkerGeneration++;
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (worker !== searchWorker || !aiPending) return;
    if ((m.type === 'searchDone' || m.type === 'searchError')
      && (m.id !== aiPending.id || aiPending.fen !== game.fen())) return;
    if (m.type === 'searchDone') onAiMove(m.result);
    else if (m.type === 'searchError') useFallbackAi('搜索出错');
  };
  worker.onerror = () => {
    if (worker === searchWorker && aiPending) useFallbackAi('Worker 加载失败');
  };
  worker.onmessageerror = () => {
    if (worker === searchWorker && aiPending) useFallbackAi('Worker 通信失败');
  };
  worker.postMessage({ type: 'ping' });
  return worker;
}

function restartSearchWorker() {
  if (searchWorker) searchWorker.terminate();
  searchWorker = null;
  return createSearchWorker();
}

function useFallbackAi(reason) {
  const pending = aiPending;
  if (!pending || !thinking || pending.fen !== game.fen()) return false;
  restartSearchWorker(); // 同步搜索无法取消消息，只能终止实例，下一盘绝不排在它后面。
  onAiMove({
    move: pending.fallback.move,
    san: pending.fallback.san,
    score: 0,
    depth: 0,
    nodes: 0,
    ms: performance.now() - aiClock,
    fallback: true,
    reason,
  });
  return true;
}

createSearchWorker();

let cloudWorker = null;
let cloudWorkerTargetDepth = 0;
let cloudWorkerBaseMs = 0;

function skyIsVisibleNow() {
  const r = skyBox.getBoundingClientRect();
  return !document.hidden
    && r.width > 0 && r.height > 0
    && r.right > 0 && r.bottom > 0
    && r.left < innerWidth && r.top < innerHeight;
}

function prepareCloud({ preserveExplorer = false } = {}) {
  const gen = ++cloudState.gen;
  if (cloudWorker) { cloudWorker.terminate(); cloudWorker = null; }
  cloudWorkerTargetDepth = 0;
  clearCloud();
  cloudTarget.set(CLOUD_TARGET_X, 0, 0);
  cloudTargetGoal.set(CLOUD_TARGET_X, 0, 0);

  const fen = game.fen();
  if (!preserveExplorer || explorerState.rootFen !== fen) resetExplorer(false);
  else explorerState.choices = [];
  exploreChoiceCache.clear();
  exploreReplyCountCache.clear();
  if (cloudViewMode === '2d') {
    tree2dRenderKey = '';
    cloudTree2dEl.inert = true;
    cloudTree2dEl.setAttribute('aria-busy', 'true');
    tree2dPathEl.innerHTML = '<button type="button" class="is-current" disabled>现在</button>';
    tree2dLiveEl.textContent = thinking
      ? '黑方正在思考；应手绘制后再重新长树。'
      : '局面已更新，正在读取真实分支。';
    tree2dBodyEl.innerHTML = '<div class="tree2d-empty">正在同步新的真实局面…</div>';
    const explorerEl = document.getElementById('cloudExplorer');
    explorerEl.inert = true;
    explorerEl.setAttribute('aria-busy', 'true');
    exploreChoicesEl.replaceChildren();
    exploreSummaryEl.textContent = '局面已更新，正在同步变体棋盘。';
    document.getElementById('exploreBoard').style.opacity = '.35';
  }
  addRoot(0);
  cloudState = {
    fen, depth: 0, ms: 0, workerMs: 0, mainMs: 0,
    growing: false, deepPending: false, error: '', paused: false, gen,
  };
  updateHud();
  requestCloudRender();
  return gen;
}

function startCloudWorker({
  gen = cloudState.gen,
  startDepth = 1,
  targetDepth = DEEP_DEPTH,
  parentFens = null,
} = {}) {
  if (gen !== cloudState.gen || thinking || document.hidden) return false;
  if (cloudWorker) cloudWorker.terminate();

  const worker = new Worker('./worker.js', { type: 'module' });
  cloudWorker = worker;
  cloudWorkerTargetDepth = targetDepth;
  cloudWorkerBaseMs = cloudState.workerMs;
  cloudState.growing = true;
  cloudState.deepPending = false;
  cloudState.error = '';
  cloudState.paused = false;
  updateHud();
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (worker !== cloudWorker || m.id !== cloudState.gen) return;
    if (m.type === 'cloudLayer') {
      const mainStarted = performance.now();
      appendLayer(m.depth, m.parents, m.scores);
      cloudLayerFens.set(m.depth, m.fens);
      cloudLayerParents.set(m.depth, m.parents);
      if (m.depth === 1) {
        const firstMoves = new Chess(cloudState.fen).moves({ verbose: true });
        cloudFirstMoves = firstMoves.map((move, index) => ({
          san: move.san, after: move.after, from: move.from, to: move.to,
          promotion: move.promotion, score: m.scores[index], index,
        }));
      }
      cloudState.depth = Math.max(cloudState.depth, m.depth);
      syncCloudMap();
      cloudState.mainMs += performance.now() - mainStarted;
      cloudState.workerMs = cloudWorkerBaseMs + m.ms;
      cloudState.ms = cloudState.workerMs + cloudState.mainMs;
      cloudTimingByDepth.set(m.depth, {
        workerMs: cloudState.workerMs,
        mainMs: cloudState.mainMs,
      });
      updateHud();
    } else if (m.type === 'cloudBatch') {
      const mainStarted = performance.now();
      appendLayer(m.depth, m.parents, m.scores);
      cloudState.depth = Math.max(cloudState.depth, m.depth);
      cloudState.mainMs += performance.now() - mainStarted;
      cloudState.workerMs = cloudWorkerBaseMs + m.ms;
      cloudState.ms = cloudState.workerMs + cloudState.mainMs;
      updateHud();
    } else if (m.type === 'cloudDone') {
      const mainStarted = performance.now();
      if (m.depth === DEEP_DEPTH) mergeCloudLayer(DEEP_DEPTH);
      cloudState.mainMs += performance.now() - mainStarted;
      cloudState.depth = m.depth;
      cloudState.workerMs = cloudWorkerBaseMs + m.ms;
      cloudState.ms = cloudState.workerMs + cloudState.mainMs;
      cloudTimingByDepth.set(m.depth, {
        workerMs: cloudState.workerMs,
        mainMs: cloudState.mainMs,
      });
      cloudState.growing = false;
      cloudState.deepPending = m.depth < DEEP_DEPTH;
      updateHud();
      worker.terminate();
      if (cloudWorker === worker) cloudWorker = null;
      cloudWorkerTargetDepth = 0;
      maybeStartDeepCloud();
    } else if (m.type === 'cloudError') {
      discardPartialDeepLayer();
      cloudState.growing = false;
      cloudState.deepPending = false;
      cloudState.error = m.message || '未知错误';
      if (cloudState.depth < SYNC_DEPTH) {
        cloudState.workerMs = cloudWorkerBaseMs + (m.ms || 0);
        cloudState.ms = cloudState.workerMs + cloudState.mainMs;
      }
      updateHud();
      worker.terminate();
      if (cloudWorker === worker) cloudWorker = null;
      cloudWorkerTargetDepth = 0;
    }
  };
  worker.onerror = worker.onmessageerror = () => {
    if (worker !== cloudWorker) return;
    discardPartialDeepLayer();
    cloudState.growing = false;
    cloudState.deepPending = false;
    cloudState.error = 'Worker 加载或通信失败';
    updateHud();
    worker.terminate();
    cloudWorker = null;
    cloudWorkerTargetDepth = 0;
  };
  worker.postMessage({
    type: 'cloud',
    id: gen,
    fen: cloudState.fen,
    startDepth,
    targetDepth,
    parentFens,
    batchParents: BATCH_PARENTS,
  });
  return true;
}

function maybeStartDeepCloud() {
  if (
    thinking
    || document.hidden
    || cloudViewMode !== '3d'
    || !document.body.classList.contains('cloud-full')
    || cloudWorker
    || cloudState.error
    || cloudState.depth !== SYNC_DEPTH
    || !cloudState.deepPending
    || !skyIsVisibleNow()
  ) return false;
  const parentFens = cloudLayerFens.get(SYNC_DEPTH);
  if (!parentFens?.length) return false;
  return startCloudWorker({
    gen: cloudState.gen,
    startDepth: DEEP_DEPTH,
    targetDepth: DEEP_DEPTH,
    parentFens,
  });
}

function growPreparedCloud(gen = cloudState.gen) {
  if (gen !== cloudState.gen || thinking) return false;
  if (document.hidden) {
    cloudState.paused = true;
    updateHud();
    return false;
  }
  // 缩略窗只铺完整 L3；用户明确打开全屏探索时才承担几十万条 L4。
  const targetDepth =
    cloudViewMode === '3d'
      && document.body.classList.contains('cloud-full')
      && skyIsVisibleNow()
      ? DEEP_DEPTH
      : SYNC_DEPTH;
  return startCloudWorker({ gen, startDepth: 1, targetDepth });
}

function rebuildCloud() {
  const gen = prepareCloud();
  if (!thinking) growPreparedCloud(gen);
  return gen;
}

function requestAi() {
  if (game.isGameOver()) { thinking = false; return; }
  thinking = true;
  lastAi = null;
  aiClock = performance.now();
  const timeBudgetMs = matchMedia('(max-width: 1100px), (max-height: 780px)').matches
    ? COMPACT_AI_BUDGET_MS
    : AI_BUDGET_MS;
  const id = ++aiRequestId;
  const fen = game.fen();
  const first = game.moves({ verbose: true })[0];
  if (!first) { thinking = false; return; }
  aiPending = {
    id,
    fen,
    fallback: {
      move: { from: first.from, to: first.to, promotion: first.promotion },
      san: first.san,
    },
  };
  clearAiWatchdog();
  aiWatchdog = setTimeout(() => useFallbackAi('超过硬时限'), AI_WATCHDOG_MS);
  if (!searchWorker) createSearchWorker();
  searchWorker.postMessage({ type: 'search', id, fen, timeBudgetMs });
}

let presentationGen = 0;

function aiStatusHtml(ai) {
  if (game.isGameOver()) return describeEnd();
  return `黑走 <b>${ai.san}</b>（${
    ai.fallback
      ? `${esc(ai.reason || '搜索未完成')}，采用合法保底步`
      : `想了 ${ai.totalMs}ms，搜到 ${ai.depth} 层`
  }）。轮到你。`;
}

/**
 * AI 落子和状态先交给浏览器绘制；分叉排序与路径网生长放到后续任务。
 * 这样慢手机上用户看到的应手时间不会被非关键可视化工作偷偷拖长。
 */
function finishAiPresentation(ai, fen, cloudGen) {
  const gen = ++presentationGen;
  requestAnimationFrame(() => {
    setTimeout(() => {
      if (gen !== presentationGen || lastAi !== ai || game.fen() !== fen) return;
      ai.totalMs = Math.round(performance.now() - aiClock);
      ai.painted = true;
      setStatus(aiStatusHtml(ai));
      updateHud();
      if (pendingCoachOutcome) presentCoachOutcome(pendingCoachOutcome);
      else renderCoachIdle();

      // 留出一帧让最终状态文字也上屏，再计算新局面的分叉并启动云 Worker。
      setTimeout(() => {
        if (gen !== presentationGen || lastAi !== ai || game.fen() !== fen) return;
        renderFork(true);
        if (cloudViewMode === '2d') renderExplorer();
        growPreparedCloud(cloudGen);
      }, 120);
    }, 0);
  });
}

function onAiMove(result) {
  const pending = aiPending;
  clearAiWatchdog();
  aiPending = null;
  thinking = false;
  if (!result) {
    forkStale = false;
    renderBoard();
    renderFork();
    rebuildCloud();
    if (cloudViewMode === '2d') renderExplorer();
    setStatus(describeEnd());
    return;
  }
  let mv = null;
  try { mv = game.move(result.move); } catch {}
  let usedFallback = !!result.fallback;
  if (!mv && pending?.fallback) {
    try { mv = game.move(pending.fallback.move); } catch {}
    result = {
      ...result,
      ...pending.fallback,
      depth: 0,
      nodes: 0,
      fallback: true,
      reason: '搜索返回了无效走法',
    };
    usedFallback = true;
  }
  if (!mv) {
    forkStale = false;
    renderBoard();
    renderFork();
    rebuildCloud();
    if (cloudViewMode === '2d') renderExplorer();
    setStatusText(game.isGameOver() ? describeEnd() : 'AI 未能生成合法走法，请重开后再试。');
    return;
  }
  lastAi = {
    san: mv ? mv.san : result.san,
    depth: result.depth, nodes: result.nodes,
    score: result.score,
    searchMs: Math.round(result.ms),
    totalMs: Math.round(performance.now() - aiClock),
    painted: false,
    fallback: usedFallback,
    reason: usedFallback ? result.reason : '',
  };
  selected = null;
  forkPreview = null;
  coachPreview = null;
  branchPath = [];
  expanded = [];
  resetForkTransient();
  renderBoard();
  const cloudGen = prepareCloud();
  pendingCoachOutcome = pendingCoachPrediction ? {
    prediction: pendingCoachPrediction,
    actual: {
      san: mv.san,
      from: mv.from,
      to: mv.to,
      promotion: mv.promotion,
      piece: mv.piece,
    },
    fallback: usedFallback,
    reason: lastAi.reason,
  } : null;
  pendingCoachPrediction = null;
  const ai = lastAi;
  const fen = game.fen();
  setStatus(aiStatusHtml(ai));
  finishAiPresentation(ai, fen, cloudGen);
}

/** 落子入口。棋盘点击、分叉图、测试钩子走的都是这一条路，合法性一律由 chess.js 判。 */
function tryMove(from, to, promotion) {
  if (thinking || game.isGameOver() || game.turn() !== 'w') return false;
  const prediction = captureCoachPrediction(from, to, promotion);
  let mv = null;
  try { mv = game.move({ from, to, promotion: promotion || 'q' }); } catch (e) { mv = null; }
  if (!mv) return false;
  pendingCoachPrediction = prediction;
  selected = null;
  forkPreview = null;
  coachPreview = null;
  coachOutcome = null;
  setCoachThinking(mv);
  coachReplyCache.clear();
  branchPath = [];
  expanded = [];
  lastAi = null;
  presentationGen++;
  resetForkTransient();
  renderBoard();
  requestAi();       // 先派活给 AI 的 Worker，让它和主线程并行
  if (!thinking) {
    presentCoachTerminal(mv, prediction);
    rebuildCloud();
    renderFork();
    if (cloudViewMode === '2d') renderExplorer();
    setStatus(describeEnd());
    return true;
  }
  prepareCloud();    // 只清掉旧局面；思考时不做任何注定会被应手替换的云计算
  markForkStale();
  setStatus(game.isGameOver() ? describeEnd() : `你走 <b>${mv.san}</b>，黑方在想…`);
  return true;
}

function describeEnd() {
  if (game.isCheckmate()) return game.turn() === 'w' ? '将死，黑方胜。' : '将死，你赢了。';
  if (game.isStalemate()) return '困毙，和棋。';
  if (game.isInsufficientMaterial()) return '子力不足，和棋。';
  if (game.isThreefoldRepetition()) return '三次重复局面，和棋。';
  if (game.isDraw()) return '和棋。';
  return '';
}

// ─────────────────────────────────────────────── 棋盘（自绘 SVG）
const SVG_NS = 'http://www.w3.org/2000/svg';
const boardEl = document.getElementById('board');
const boardSquaresEl = document.getElementById('boardSquares');
const boardPiecesEl = document.getElementById('boardPieces');
const boardOverlayEl = document.getElementById('boardOverlay');
const CELL = 50;
const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
const PIECE_NAME = { k: '王', q: '后', r: '车', b: '象', n: '马', p: '兵' };
let forkPreview = null;   // 分叉 hover 的单步预览
let coachPreview = null;  // 棋子助手的“你一步 → 对手一步”动画
const coachPanelEl = document.getElementById('coachPanel');
const coachTitleEl = document.getElementById('coachTitle');
const coachExplainEl = document.getElementById('coachExplain');
const coachMovesEl = document.getElementById('coachMoves');
const coachReplyStripEl = document.getElementById('coachReplyStrip');
const coachReplyCache = new Map();
let coachModel = null;
let coachActiveRank = null;
let coachOutcome = null;
let pendingCoachPrediction = null;
let pendingCoachOutcome = null;
let coachPreviewGen = 0;

function squareXY(sq) {
  const f = FILES.indexOf(sq[0]), r = 8 - Number(sq[1]);
  return [f * CELL + CELL / 2, r * CELL + CELL / 2];
}

function appendForkPreview(move) {
  const [x1, y1] = squareXY(move.from), [x2, y2] = squareXY(move.to);
  const ring = svgElement('circle', {
    cx: x1, cy: y1, r: 21, fill: 'none', stroke: move.color,
    'stroke-width': 3, 'stroke-dasharray': '5 4', 'pointer-events': 'none',
  });
  boardOverlayEl.appendChild(ring);
  const line = svgElement('line', {
    x1, y1, x2, y2, stroke: move.color, 'stroke-width': 5,
    'stroke-linecap': 'round', opacity: '.9', 'pointer-events': 'none',
  });
  boardOverlayEl.appendChild(line);
  const dot = svgElement('circle', {
    cx: x2, cy: y2, r: 9, fill: move.color, 'pointer-events': 'none',
  });
  boardOverlayEl.appendChild(dot);
}

function appendCoachStep(move, step, label, bend) {
  if (!move?.from || !move?.to) return;
  const [x1, y1] = squareXY(move.from), [x2, y2] = squareXY(move.to);
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const mx = (x1 + x2) / 2 - (dy / len) * bend;
  const my = (y1 + y2) / 2 + (dx / len) * bend;
  const path = svgElement('path', {
    d: `M${x1} ${y1} Q${mx.toFixed(2)} ${my.toFixed(2)} ${x2} ${y2}`,
    pathLength: 1,
    class: 'coach-path',
    'data-step': step,
    'data-line-id': coachPreview?.id || '',
    'data-from': move.from,
    'data-to': move.to,
    'data-san': move.san || '',
  });
  boardOverlayEl.appendChild(path);
  const target = svgElement('circle', {
    cx: x2, cy: y2, r: 8,
    class: 'coach-target',
    'data-step': step,
    'data-line-id': coachPreview?.id || '',
  });
  boardOverlayEl.appendChild(target);
  const tag = svgElement('text', {
    x: mx, y: my - 7,
    class: 'coach-tag',
    'data-step': step,
    'data-line-id': coachPreview?.id || '',
  });
  tag.textContent = label;
  boardOverlayEl.appendChild(tag);
}

function appendCoachPreview(sequence) {
  appendCoachStep(sequence.you, 'you', `你 ${sequence.you.san}`, -8);
  appendCoachStep(sequence.reply, 'reply', `黑 ${sequence.reply?.san || ''}`, 9);
}

function svgElement(tag, attrs = {}) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
  return el;
}

function appendPieceModel(pc, sq, f, r, target = boardPiecesEl) {
  const template = document.getElementById(`board-piece-${pc.type}`);
  if (!template) throw new Error(`缺少棋子模型：${pc.type}`);
  const piece = svgElement('g', {
    class: 'piece3d',
    transform: `translate(${f * CELL} ${r * CELL})`,
    'data-sq': sq,
    'data-color': pc.color,
    'data-type': pc.type,
    'data-render': 'vector-3d',
    role: 'img',
    'aria-label': `${pc.color === 'w' ? '白' : '黑'}${PIECE_NAME[pc.type]} ${sq}`,
  });
  const model = template.cloneNode(true);
  model.removeAttribute('id');
  model.removeAttribute('data-piece-template');
  piece.appendChild(model);
  target.appendChild(piece);
}

function renderBoardOverlay(board = game.board()) {
  boardOverlayEl.replaceChildren();
  const legal = selected ? game.moves({ square: selected, verbose: true }).map((move) => move.to) : [];
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = FILES[f] + (8 - r);
      if (!legal.includes(sq)) continue;
      const dot = svgElement('circle', {
        cx: f * CELL + CELL / 2,
        cy: r * CELL + CELL / 2,
        r: board[r][f] ? 21 : 7.5,
        fill: 'none',
        stroke: 'rgba(255,240,190,.85)',
        'stroke-width': board[r][f] ? 2.5 : 15,
        'data-sq': sq,
      });
      boardOverlayEl.appendChild(dot);
    }
  }
  if (forkPreview) appendForkPreview(forkPreview);
  else if (coachPreview) appendCoachPreview(coachPreview);
}

function renderBoard() {
  boardSquaresEl.replaceChildren();
  boardPiecesEl.replaceChildren();
  const legal = selected ? game.moves({ square: selected, verbose: true }).map((m) => m.to) : [];
  const board = game.board();
  const last = game.history({ verbose: true }).slice(-1)[0];

  // 第一层只画格子，保证棋子的 pointer-events:none 时点击稳定落到真实格子上。
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = FILES[f] + (8 - r);
      const dark = (r + f) % 2 === 1;
      const rect = svgElement('rect', {
        x: f * CELL, y: r * CELL, width: CELL, height: CELL,
        stroke: dark ? 'rgba(8,12,21,.34)' : 'rgba(236,242,255,.08)',
        'stroke-width': .55,
        'data-sq': sq,
        role: 'gridcell',
        tabindex: (board[r][f]?.color === 'w' || legal.includes(sq)) ? 0 : -1,
        'aria-selected': sq === selected ? 'true' : 'false',
        'aria-label': sq,
      });
      let fill = dark ? '#3b4560' : '#8b97b4';
      if (last && (sq === last.from || sq === last.to)) fill = dark ? '#5c6132' : '#b3b06a';
      if (sq === selected) fill = '#c9a24a';
      rect.setAttribute('fill', fill);
      boardSquaresEl.appendChild(rect);
    }
  }

  // 第二层统一画六种矢量 3D 模型；黑白只换材质，不换造型、不走字体回退。
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = FILES[f] + (8 - r);
      const pc = board[r][f];
      if (pc) appendPieceModel(pc, sq, f, r);
    }
  }

  // 第三层只重建轻量 overlay；分叉 hover 不再反复克隆 32 枚棋子。
  renderBoardOverlay(board);
  boardEl.setAttribute(
    'aria-label',
    `国际象棋棋盘，${game.turn() === 'w' ? '白方' : '黑方'}行棋，共 ${boardPiecesEl.childElementCount} 枚棋子`,
  );
}

function activateBoardSquare(sq) {
  if (!sq) return false;
  if (selected) {
    if (sq === selected) {
      selected = null;
      coachPreview = null;
      coachModel = null;
      renderCoachIdle();
      renderBoard();
      return true;
    }
    if (tryMove(selected, sq)) return true;
  }
  const pc = game.get(sq);
  selected = (pc && pc.color === 'w' && game.turn() === 'w' && !thinking) ? sq : null;
  coachOutcome = null;
  coachPreview = null;
  forkPreview = null;
  coachActiveRank = null;
  if (selected) updateMoveCoach();
  else {
    coachModel = null;
    renderCoachIdle();
  }
  renderBoard();
  return !!selected;
}

boardEl.addEventListener('click', (ev) => {
  const sq = ev.target && ev.target.dataset ? ev.target.dataset.sq : null;
  activateBoardSquare(sq);
});
boardEl.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const sq = ev.target && ev.target.dataset ? ev.target.dataset.sq : null;
  if (activateBoardSquare(sq)) ev.preventDefault();
});

function setStatus(html) { document.getElementById('status').innerHTML = html; }
function setStatusText(text) { document.getElementById('status').textContent = text; }

function updateHud() {
  let total = 0;
  for (const d of builtDepths()) total += nodesAt(d);
  if (cloudViewMode === '2d') {
    const turn = fenTurnContext(explorerState.rootFen || game.fen());
    const levelEls = [...tree2dBodyEl.querySelectorAll('.tree2d-level')];
    const frontier = levelEls.at(-1);
    const frontierCount = frontier?.querySelectorAll('button.tree2d-choice').length || 0;
    const renderedCards = tree2dBodyEl.querySelectorAll('button.tree2d-choice').length;
    const selectedDepth = tree2dPathEl.querySelectorAll('button').length - 1;
    document.getElementById('cloudStats').innerHTML = thinking
      ? '2D 聚焦树　·　等待黑方应手后读取新分支'
      : `2D 聚焦树　·　第 <b>${turn.fullmove}</b> 回合 ${turn.sideLabel}走`
        + `　·　未来路径已选 <b>${Math.max(0, selectedDepth)}</b> 步`
        + `　·　当前层 <b>${frontierCount}</b> 个可选分支`
        + `　·　DOM 只画当前路径上的 ${renderedCards} 张真实节点卡`;
    document.getElementById('cloudCount').innerHTML = thinking
      ? '<span class="grow">等待新局面</span>'
      : `第 ${turn.fullmove} 回合 · ${turn.sideLabel}走 · 当前层 <span class="grow">${frontierCount}</span> 个真实分支`;
    cloudLayerLegendEl.textContent =
      '每张卡标出“走后下一方还有多少个分支”；点一条，下一层继续向下展开';
    return;
  }
  const layerTxt = cloudState.growing ? `${cloudState.depth}+ 层` : `${cloudState.depth} 层`;
  const deepest = nodesAt(cloudState.depth);
  const fastPreview =
    cloudViewMode === '3d'
    &&
    cloudState.depth === SYNC_DEPTH
    && cloudState.deepPending
    && !document.body.classList.contains('cloud-full');
  if (cloudState.error) {
    document.getElementById('cloudStats').innerHTML =
      `路径网计算失败 · 已保留真实绘制到第 <b>${cloudState.depth}</b> 层`;
    document.getElementById('cloudCount').innerHTML =
      `<span class="grow">计算中断：${esc(cloudState.error)}</span> · 已绘制 ${total.toLocaleString('en-US')} 条真实路径`;
    cloudLayerLegendEl.textContent = builtDepths()
      .map((d) => `${d === 0 ? '现在' : `${d}步后`} ${nodesAt(d).toLocaleString('en-US')}`)
      .join('　·　');
    return;
  }
  document.getElementById('cloudStats').innerHTML =
    `铺了 <b>${layerTxt}</b>　·　当前可见层 ${Math.round(cloudState.ms)} ms 计算`
    + (fastPreview ? '　·　快速预览；放大后加载完整第 4 层' : '')
    + (lastAi ? `　·　AI 应手 <b>${lastAi.totalMs} ms</b>（搜到 ${lastAi.depth} 层）` : '');
  document.getElementById('cloudCount').innerHTML = cloudState.growing
    ? `已绘制 <span class="grow">${total.toLocaleString('en-US')}</span> 条真实路径，还在长`
    : fastPreview
      ? `快速预览 ${cloudState.depth} 步 · ${deepest.toLocaleString('en-US')} 条真实路径`
      : `${cloudState.depth} 步后 ${deepest.toLocaleString('en-US')} 条路径 · 共绘制 ${total.toLocaleString('en-US')} 条`;
  cloudLayerLegendEl.textContent = builtDepths()
    .map((d) => `${d === 0 ? '现在' : `${d}步后`} ${nodesAt(d).toLocaleString('en-US')}`)
    .join('　·　');
}

// ─────────────────────────────────────────────── 主舞台：平面分叉图
// 一列 = 一步棋。每列把走法按「对行棋方好坏」排好，先摆最靠谱的几条，
// 其余折成一行「还有 N 条」。点哪条，右边就顺它接着分叉。
const forkEl = document.getElementById('fork');
const forkWrap = document.getElementById('forkWrap');
const FORK_IDLE_TEXT = '亮蓝主干就是当前选路；当前一步看棋盘箭头，未来各步用「放大探索」逐格预演；确认后再落子。';
const CARD_H = 44, CARD_GAP = 8, HEAD_H = 62;
let forkScrollGen = 0;
let forkStale = false;
let forkHoverKey = '';
const forkReplyCountCache = new Map();

function markForkStale() {
  forkStale = true;
  forkWrap.inert = true;
  forkEl.style.opacity = '.45';
  forkEl.setAttribute('aria-busy', 'true');
  document.getElementById('btnPlayLine').disabled = true;
  document.getElementById('forkFoot').textContent = '黑方应手后，未来路径会从新局面重新长出。';
}

function resetForkTransient() {
  const gen = ++forkScrollGen;
  document.getElementById('forkFoot').textContent = FORK_IDLE_TEXT;
  forkWrap.scrollTo({ left: 0, top: 0, behavior: 'auto' });
  requestAnimationFrame(() => {
    if (gen === forkScrollGen) forkWrap.scrollTo({ left: 0, top: 0, behavior: 'auto' });
  });
}
let branchPath = [];     // 每列选中的是排序后的第几条
let expanded = [];       // 哪些列被点开了「还有 N 条」
let columns = [];

function buildColumns() {
  const cols = [];
  let fen = game.fen();
  const base = game.history().length;
  for (let i = 0; i < COLS; i++) {
    const ranked = rankMoves(fen, { depth: RANK_DEPTH });
    if (ranked.length === 0) break;
    let idx = branchPath[i];
    if (idx === undefined || idx === null || idx < 0 || idx >= ranked.length) idx = 0;   // 默认最靠谱那条
    const baseShown = Math.min(SHOW[i] || 4, ranked.length);
    const visibleIndices = expanded[i]
      ? ranked.map((_, rank) => rank)
      : [...Array(baseShown).keys()];
    // 收起时也绝不能把已经选中的第 12 名藏掉，否则主干会凭空断掉。
    if (!visibleIndices.includes(idx)) visibleIndices.push(idx);
    cols.push({
      fen, ranked, chosen: idx, baseShown,
      visibleIndices, shown: visibleIndices.length,
      expanded: !!expanded[i],
      ply: base + i, white: fen.split(' ')[1] === 'w',
    });
    fen = ranked[idx].after;
  }
  return cols;
}

function scoreText(s) {
  if (s >= MATE) return '将死';
  if (s <= -MATE) return '被将死';
  return (s >= 0 ? '+' : '') + (s / 100).toFixed(2);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[ch]);
}

/**
 * 原始分仍保留给懂引擎的人核对，但主信息先翻译成人能直接做决定的话。
 * 分数始终沿用 engine.js 的唯一口径：正 = 白方好，负 = 黑方好。
 */
function scoreSituation(score) {
  if (score >= MATE) {
    return { key: 'mate-win', short: '可将死', label: '你有强制将死', color: '#7ee0a8' };
  }
  if (score <= -MATE) {
    return { key: 'mate-loss', short: '会被将死', label: '对手有强制将死', color: '#ff806f' };
  }
  if (score >= 150) {
    return { key: 'white-clear', short: '你明显优', label: '你明显占优', color: '#7ee0a8' };
  }
  if (score >= 50) {
    return { key: 'white-edge', short: '你稍优', label: '你稍优', color: '#b8e69d' };
  }
  if (score > -50) {
    return { key: 'balanced', short: '接近均衡', label: '局面接近均衡', color: '#d5d0c7' };
  }
  if (score > -150) {
    return { key: 'black-edge', short: '对手稍优', label: '对手稍优', color: '#9ec9f3' };
  }
  return { key: 'black-clear', short: '对手明显优', label: '对手明显占优', color: '#75aef0' };
}

function moveQuality(score, bestScore, white = true) {
  const wins = white ? score >= MATE : score <= -MATE;
  const loses = white ? score <= -MATE : score >= MATE;
  const bestWins = white ? bestScore >= MATE : bestScore <= -MATE;
  if (wins) return { key: 'wins', label: '直接取胜' };
  if (loses) return { key: 'mated', label: '会被将死' };
  if (bestWins) return { key: 'misses-mate', label: '会错过将杀' };
  const loss = Math.max(0, white ? bestScore - score : score - bestScore);
  if (loss <= 15) return { key: 'best', label: '首选' };
  if (loss <= 50) return { key: 'steady', label: '稳健可下' };
  if (loss <= 100) return { key: 'accurate', label: '需要准确' };
  return { key: 'risky', label: '风险较高' };
}

function replyDescription(reply) {
  if (!reply) return '对手没有合法回应';
  let text = `对手强回应：${PIECE_NAME[reply.piece] || '棋子'}走 ${reply.san}`;
  if (reply.captured) text += `，吃${PIECE_NAME[reply.captured] || '子'}`;
  if (reply.san.endsWith('#')) text += '并将死';
  else if (reply.san.endsWith('+')) text += '并将军';
  return text;
}

function repliesFor(candidate) {
  if (!candidate?.after) return [];
  let replies = coachReplyCache.get(candidate.after);
  if (!replies) {
    replies = rankMoves(candidate.after, { depth: 1 });
    coachReplyCache.set(candidate.after, replies);
  }
  return replies;
}

function coachCandidateFromMove(from, to, promotion) {
  const first = columns[0];
  if (!first || first.fen !== game.fen()) return null;
  const wantedPromotion = promotion || 'q';
  return first.ranked.find((move) =>
    move.from === from
    && move.to === to
    && (!move.promotion || move.promotion === wantedPromotion)
  ) || null;
}

function buildCoachModel(square) {
  const first = columns[0];
  if (!first || first.fen !== game.fen()) return null;
  const allCandidates = first.ranked.filter((move) => move.from === square);
  const candidates = allCandidates
    .slice(0, 3)
    .map((move) => ({
      ...move,
      rank: first.ranked.indexOf(move),
      replies: repliesFor(move).slice(0, 3),
      situation: scoreSituation(move.score),
      quality: moveQuality(move.score, first.ranked[0].score),
    }));
  if (candidates.length === 0) return null;
  return {
    fen: game.fen(),
    square,
    piece: candidates[0].piece,
    total: allCandidates.length,
    candidates,
  };
}

function setCoachPreview(candidate) {
  if (!candidate) {
    coachPreview = null;
    renderBoard();
    return false;
  }
  coachActiveRank = candidate.rank;
