<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>可能性分叉 · chess-cloud</title>
<style>
  :root {
    --ink: #e8ecf6;
    --dim: #8c93a8;
    --faint: #5f6679;
    --warm: #ff7a1f;
    --cold: #2f86ff;
    --pick: #8fd8ff;
    --glass: rgba(14, 17, 27, 0.74);
    --edge: rgba(150, 170, 220, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060b; }
  body {
    font: 14px/1.55 -apple-system, "SF Pro SC", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    position: fixed;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 16px;
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  button {
    font: inherit; font-size: 12px; color: var(--ink);
    background: rgba(120,150,220,.14); border: 1px solid var(--edge);
    border-radius: 9px; padding: 5px 11px; cursor: pointer;
  }
  button:hover { background: rgba(120,150,220,.26); }
  button:disabled { opacity: .38; cursor: default; }

  /* ── 左上：星云小窗（想看震撼点开全屏，平时不抢戏） */
  #cloudPanel { left: 22px; top: 22px; width: 434px; padding: 12px 16px 14px; }
  #cloudPanel h1 { margin: 0 0 7px; font-size: 13px; font-weight: 650; letter-spacing: .02em; }
  #cloudPanel h1 span { color: var(--faint); font-weight: 400; font-size: 11.5px; margin-left: 6px; }
  #skyBox { position: relative; width: 402px; height: 158px; border-radius: 9px; overflow: hidden; background: #05060b; cursor: zoom-in; }
  #sky { display: block; width: 100%; height: 100%; }
  #skyHint { position: absolute; right: 8px; bottom: 6px; font-size: 10.5px; color: #7b8296; }
  body.cloud-full #skyBox {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 40;
    border-radius: 0; cursor: zoom-out;
  }
  #cloudStats { margin-top: 8px; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #cloudStats b { color: var(--ink); font-weight: 600; }
  .grow { color: #7ee0a8; }

  /* ── 左下：棋盘 */
  #boardPanel { left: 22px; bottom: 22px; width: 434px; padding: 15px 16px 12px; }
  #board { display: block; width: 380px; height: 380px; margin: 0 auto; border-radius: 8px; overflow: hidden; }
  #board text.glyph { pointer-events: none; user-select: none; }
  #status { margin-top: 10px; min-height: 34px; font-size: 13px; color: var(--dim); }
  #status b { color: var(--ink); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 9px; flex-wrap: wrap; }

  /* ── 右侧主舞台：平面分叉图 */
  #stage { left: 478px; right: 22px; top: 22px; bottom: 22px; display: flex; flex-direction: column; padding: 0; }
  #stageHead { padding: 14px 20px 11px; border-bottom: 1px solid var(--edge); }
  #stageHead h2 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  #stageHead .sub { font-size: 11.5px; color: var(--dim); }
  #moveLine { margin-top: 9px; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--faint); }
  #moveLine b { color: #dfd2a2; font-weight: 600; }
  #moveLine .num { color: #4b5165; margin-right: 2px; }
  #forkWrap { flex: 1; overflow: auto; }
  #fork { display: block; }
  #fork g.card { cursor: pointer; }
  #fork g.more { cursor: pointer; }
  #forkFoot { padding: 10px 20px 13px; border-top: 1px solid var(--edge); font-size: 12px; color: var(--dim); min-height: 58px; }
  #forkFoot b { color: var(--ink); }
</style>
</head>
<body>

<div class="panel" id="cloudPanel">
  <h1>全景星云<span id="cloudCount">正在铺开…</span></h1>
  <div id="skyBox"><canvas id="sky"></canvas><div id="skyHint">点开全屏</div></div>
  <div id="cloudStats">—</div>
</div>

<div class="panel" id="boardPanel">
  <svg id="board" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="status">正在算分叉…</div>
  <div class="row">
    <button id="btnReset">重开</button>
    <button id="btnPlayLine">走第一列选中那步</button>
  </div>
</div>

<div class="panel" id="stage">
  <div id="stageHead">
    <h2>可能性分叉</h2>
    <div class="sub">一列 = 一步棋。每列先列出<b>最靠谱的几条</b>（往前看两步排的），旁边写着这一步一共有多少种。点任意一条，右边就顺它接着分叉。</div>
    <div id="moveLine"></div>
  </div>
  <div id="forkWrap"><svg id="fork" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="forkFoot">鼠标停在任意一条上，左边棋盘会把那一步画出来。</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { Chess, expand, rankMoves, MATE } from './engine.js';

// ─────────────────────────────────────────────── 常量
const SYNC_DEPTH = 3;      // 星云前几层主线程同步铺开
const DEEP_DEPTH = 4;      // 这一层交给 Worker 渐进生长
const AI_BUDGET_MS = 1500; // AI 思考预算（迭代加深，时间到就交卷，应手有硬上限）
const BATCH_PARENTS = 400; // Worker 每批处理多少个父节点

const COLS = 5;                    // 分叉图往前排几步
const SHOW = [7, 6, 5, 4, 4];      // 每列先列出几条（其余折起来）
const RANK_DEPTH = 2;              // 排序往前看几步

// 星云每层往外推多远 / 散开的锥半角 / 星点大小 / 不透明度，下标 = 层号
const STEP    = [0, 9.2, 5.0, 2.9, 1.6];
const SPREAD  = [0, 0, 0.50, 0.34, 0.26];
const PT_SIZE = [3.4, 2.0, 1.20, 0.62, 0.36];
const PT_OPAC = [1.0, 0.95, 0.72, 0.46, 0.21];

const GOLDEN = 2.39996322972865332;

// ─────────────────────────────────────────────── three.js 场景
const canvas = document.getElementById('sky');
const skyBox = document.getElementById('skyBox');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x05060b, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 4000);
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);

const starTex = makeStarTexture();
function makeStarTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,255,255,0.62)');
  grd.addColorStop(0.55, 'rgba(255,255,255,0.14)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.needsUpdate = true;
  return t;
}

const pointMaterials = PT_SIZE.map((size, d) => new THREE.PointsMaterial({
  size,
  map: starTex,
  vertexColors: true,
  transparent: true,
  opacity: PT_OPAC[d],
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
}));
const lineMaterial = new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.13,
  depthWrite: false, blending: THREE.AdditiveBlending,
});

// ─────────────────────────────────────────────── 颜色：分数 → 暖冷
// 分数正 = 白优（暖），负 = 黑优（冷）。星云和分叉图共用这一个映射。
const WARM = [1.00, 0.44, 0.08];
const COLD = [0.10, 0.46, 1.00];
const EVEN = [0.55, 0.53, 0.55];   // 均势得是真中性灰，不然「黑优」和「均势」分不开
const COLOR_FULL = 120;            // 多少百分兵算「一边倒」（≈一个兵）

function mixColor(score) {
  let t = score / COLOR_FULL;
  if (t > 1) t = 1; else if (t < -1) t = -1;
  const k = Math.sign(t) * Math.pow(Math.abs(t), 0.55);
  const target = k >= 0 ? WARM : COLD;
  const a = Math.abs(k);
  return [
    EVEN[0] + (target[0] - EVEN[0]) * a,
    EVEN[1] + (target[1] - EVEN[1]) * a,
    EVEN[2] + (target[2] - EVEN[2]) * a,
  ];
}
function writeColor(out, o, score) {
  const c = mixColor(score);
  out[o] = c[0]; out[o + 1] = c[1]; out[o + 2] = c[2];
}
function cssColor(score, boost = 1) {
  const c = mixColor(score);
  const b = (v) => Math.round(Math.min(1, v * boost) * 255);
  return `rgb(${b(c[0])},${b(c[1])},${b(c[2])})`;
}

// ─────────────────────────────────────────────── 星云的层账本
// 铁律：星数一律从几何体 position.count 现读，绝不自己记数。
const layers = new Map();
let cloudState = { fen: '', depth: 0, ms: 0, t0: 0, growing: false, gen: 0 };

function nodesAt(depth) {
  const rec = layers.get(depth);
  if (!rec) return 0;
  let n = 0;
  for (const obj of rec.objects) n += obj.geometry.attributes.position.count;
  return n;
}
function builtDepths() { return [...layers.keys()].sort((a, b) => a - b); }

function clearCloud() {
  for (const rec of layers.values()) {
    for (const obj of rec.objects) { cloudGroup.remove(obj); obj.geometry.dispose(); }
    if (rec.lines) { cloudGroup.remove(rec.lines); rec.lines.geometry.dispose(); }
  }
  layers.clear();
}

function hash01(n) {
  const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return s - Math.floor(s);
}

function addRoot(score) {
  const pos = new Float32Array([0, 0, 0]);
  const col = new Float32Array(3);
  writeColor(col, 0, score);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const obj = new THREE.Points(geo, pointMaterials[0]);
  obj.frustumCulled = false;
  cloudGroup.add(obj);
  layers.set(0, { objects: [obj], pos, dir: new Float32Array([0, 1, 0]) });
}

/**
 * 往第 depth 层追加一批星。每批都单独开一个「刚好这么大」的 BufferGeometry：
 * 不预分配、不用 drawRange，这样 position.count 天然就是真实星数。
 */
function appendLayer(depth, parents, scores) {
  const n = parents.length;
  if (n === 0) {
    if (!layers.has(depth)) layers.set(depth, { objects: [], pos: null, dir: null });
    return;
  }
  const parent = layers.get(depth - 1);
  const ppos = parent.pos, pdir = parent.dir;
  const step = STEP[depth], spread = SPREAD[depth];

  const pos = new Float32Array(n * 3);
  const dir = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);

  let i = 0;
  while (i < n) {
    const p = parents[i];
    let k = 1;
    while (i + k < n && parents[i + k] === p) k++;   // 同一个父亲的孩子是连续一段

    const px = ppos[p * 3], py = ppos[p * 3 + 1], pz = ppos[p * 3 + 2];
    const ax = pdir[p * 3], ay = pdir[p * 3 + 1], az = pdir[p * 3 + 2];

    let hx = 0, hy = 0;
    if (Math.abs(ax) < 0.9) hx = 1; else hy = 1;
    let ux = ay * 0 - az * hy, uy = az * hx - ax * 0, uz = ax * hy - ay * hx;
    const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
    const vx = ay * uz - az * uy, vy = az * ux - ax * uz, vz = ax * uy - ay * ux;
    const phi0 = hash01(p + depth * 131.7) * 6.28318530718;

    for (let j = 0; j < k; j++) {
      let cx, cy, cz;
      if (depth === 1) {
        const z = 1 - 2 * (j + 0.5) / k;
        const r = Math.sqrt(Math.max(0, 1 - z * z));
        const th = j * GOLDEN;
        cx = r * Math.cos(th); cy = z; cz = r * Math.sin(th);
      } else {
        const a = spread * Math.sqrt((j + 0.5) / k);
        const ph = phi0 + j * GOLDEN;
        const sa = Math.sin(a), ca = Math.cos(a);
        const wx = ux * Math.cos(ph) + vx * Math.sin(ph);
        const wy = uy * Math.cos(ph) + vy * Math.sin(ph);
        const wz = uz * Math.cos(ph) + vz * Math.sin(ph);
        cx = ax * ca + wx * sa; cy = ay * ca + wy * sa; cz = az * ca + wz * sa;
        const l = Math.hypot(cx, cy, cz) || 1; cx /= l; cy /= l; cz /= l;
      }
      // 径向抖动：孩子不落在同一个半径上，不然每层都是一层壳
      const jr = depth >= 2 ? 0.45 + 1.15 * hash01(p * 3.7 + j * 11.31 + depth * 57.3) : 1;
      const o = (i + j) * 3;
      dir[o] = cx; dir[o + 1] = cy; dir[o + 2] = cz;
      pos[o] = px + cx * step * jr; pos[o + 1] = py + cy * step * jr; pos[o + 2] = pz + cz * step * jr;
      writeColor(col, o, scores[i + j]);
    }
    i += k;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const obj = new THREE.Points(geo, pointMaterials[Math.min(depth, PT_SIZE.length - 1)]);
  obj.frustumCulled = false;
  cloudGroup.add(obj);

  let rec = layers.get(depth);
  if (!rec) { rec = { objects: [], pos: null, dir: null }; layers.set(depth, rec); }
  rec.objects.push(obj);
  if (depth < DEEP_DEPTH) { rec.pos = pos; rec.dir = dir; }

  if (depth <= 2) {
    const lp = new Float32Array(n * 6), lc = new Float32Array(n * 6);
    for (let t = 0; t < n; t++) {
      const p = parents[t];
      lp[t * 6] = ppos[p * 3]; lp[t * 6 + 1] = ppos[p * 3 + 1]; lp[t * 6 + 2] = ppos[p * 3 + 2];
      lp[t * 6 + 3] = pos[t * 3]; lp[t * 6 + 4] = pos[t * 3 + 1]; lp[t * 6 + 5] = pos[t * 3 + 2];
      for (let c = 0; c < 3; c++) { lc[t * 6 + c] = 0.45; lc[t * 6 + 3 + c] = col[t * 3 + c]; }
    }
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
    lg.setAttribute('color', new THREE.BufferAttribute(lc, 3));
    const lines = new THREE.LineSegments(lg, lineMaterial);
    lines.frustumCulled = false;
    cloudGroup.add(lines);
    rec.lines = lines;
  }
}

// ─────────────────────────────────────────────── 棋局 + Worker
const game = new Chess();
let selected = null;
let thinking = false;
let lastAi = null;
let aiClock = 0;

const searchWorker = new Worker('./worker.js', { type: 'module' });
searchWorker.postMessage({ type: 'ping' });
searchWorker.onmessage = (ev) => {
  const m = ev.data;
  if (m.type === 'searchDone') onAiMove(m.result);
  else if (m.type === 'searchError') { thinking = false; setStatus(`AI 出错：${m.message}`); }
};

let cloudWorker = null;

function rebuildCloud() {
  const gen = ++cloudState.gen;
  if (cloudWorker) { cloudWorker.terminate(); cloudWorker = null; }
  clearCloud();

  const fen = game.fen();
  const t0 = performance.now();
  addRoot(0);

  let parentFens = [fen];
  for (let d = 1; d <= SYNC_DEPTH; d++) {
    const { parents, scores, fens } = expand(parentFens, { keepFens: true });
    appendLayer(d, parents, scores);
    parentFens = fens;
  }
  const syncMs = performance.now() - t0;
  cloudState = { fen, depth: SYNC_DEPTH, ms: syncMs, t0, growing: parentFens.length > 0, gen };
  updateHud();

  if (parentFens.length === 0) { cloudState.growing = false; updateHud(); return; }

  cloudWorker = new Worker('./worker.js', { type: 'module' });
  cloudWorker.onmessage = (ev) => {
    const m = ev.data;
    if (m.id !== gen) return;
    if (m.type === 'cloudBatch') { appendLayer(m.depth, m.parents, m.scores); updateHud(); }
    else if (m.type === 'cloudDone') {
      cloudState.depth = DEEP_DEPTH;
      cloudState.ms = performance.now() - cloudState.t0;
      cloudState.growing = false;
      updateHud();
    } else if (m.type === 'cloudError') { cloudState.growing = false; setStatus(`星云出错：${m.message}`); }
  };
  cloudWorker.postMessage({ type: 'cloud', id: gen, depth: DEEP_DEPTH, parentFens, batchParents: BATCH_PARENTS });
}

function requestAi() {
  if (game.isGameOver()) { thinking = false; return; }
  thinking = true;
  aiClock = performance.now();
  searchWorker.postMessage({ type: 'search', id: cloudState.gen, fen: game.fen(), timeBudgetMs: AI_BUDGET_MS });
}

function onAiMove(result) {
  thinking = false;
  if (!result) { renderBoard(); renderFork(); setStatus(describeEnd()); return; }
  const mv = game.move(result.move);
  lastAi = {
    san: mv ? mv.san : result.san,
    depth: result.depth, nodes: result.nodes,
    searchMs: Math.round(result.ms),
    totalMs: Math.round(performance.now() - aiClock),
  };
  selected = null;
  branchPath = [];
  renderBoard();
  rebuildCloud();
  renderFork();
  setStatus(game.isGameOver()
    ? describeEnd()
    : `黑走 <b>${lastAi.san}</b>（想了 ${lastAi.totalMs}ms，搜到 ${lastAi.depth} 层）。轮到你。`);
}

/** 落子入口。棋盘点击、分叉图、测试钩子走的都是这一条路，合法性一律由 chess.js 判。 */
function tryMove(from, to, promotion) {
  if (thinking || game.isGameOver() || game.turn() !== 'w') return false;
  let mv = null;
  try { mv = game.move({ from, to, promotion: promotion || 'q' }); } catch (e) { mv = null; }
  if (!mv) return false;
  selected = null;
  branchPath = [];
  renderBoard();
  requestAi();       // 先派活给 AI 的 Worker，让它和主线程并行
  rebuildCloud();
  renderFork();
  setStatus(game.isGameOver() ? describeEnd() : `你走 <b>${mv.san}</b>，黑方在想…`);
  return true;
}

function describeEnd() {
  if (game.isCheckmate()) return game.turn() === 'w' ? '将死，黑方胜。' : '将死，你赢了。';
  if (game.isStalemate()) return '困毙，和棋。';
  if (game.isInsufficientMaterial()) return '子力不足，和棋。';
  if (game.isThreefoldRepetition()) return '三次重复局面，和棋。';
  if (game.isDraw()) return '和棋。';
  return '';
}

// ─────────────────────────────────────────────── 棋盘（自绘 SVG）
const SVG_NS = 'http://www.w3.org/2000/svg';
const boardEl = document.getElementById('board');
const CELL = 50;
const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
let preview = null;      // 鼠标停在分叉图某条上时，棋盘要画出来的那一步

function squareXY(sq) {
  const f = FILES.indexOf(sq[0]), r = 8 - Number(sq[1]);
  return [f * CELL + CELL / 2, r * CELL + CELL / 2];
}

function renderBoard() {
  while (boardEl.firstChild) boardEl.removeChild(boardEl.firstChild);
  const legal = selected ? game.moves({ square: selected, verbose: true }).map((m) => m.to) : [];
  const board = game.board();
  const last = game.history({ verbose: true }).slice(-1)[0];

  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = FILES[f] + (8 - r);
      const dark = (r + f) % 2 === 1;
      const rect = document.createElementNS(SVG_NS, 'rect');
      rect.setAttribute('x', f * CELL); rect.setAttribute('y', r * CELL);
      rect.setAttribute('width', CELL); rect.setAttribute('height', CELL);
      let fill = dark ? '#3b4560' : '#8b97b4';
      if (last && (sq === last.from || sq === last.to)) fill = dark ? '#5c6132' : '#b3b06a';
      if (sq === selected) fill = '#c9a24a';
      rect.setAttribute('fill', fill);
      rect.dataset.sq = sq;
      boardEl.appendChild(rect);

      if (legal.includes(sq)) {
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('cx', f * CELL + CELL / 2);
        dot.setAttribute('cy', r * CELL + CELL / 2);
        dot.setAttribute('r', board[r][f] ? 21 : 7.5);
        dot.setAttribute('fill', 'none');
        dot.setAttribute('stroke', 'rgba(255,240,190,.85)');
        dot.setAttribute('stroke-width', board[r][f] ? 2.5 : 15);
        dot.dataset.sq = sq;
        boardEl.appendChild(dot);
      }

      const pc = board[r][f];
      if (pc) {
        const t = document.createElementNS(SVG_NS, 'text');
        t.setAttribute('x', f * CELL + CELL / 2);
        t.setAttribute('y', r * CELL + CELL / 2 + 1);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.setAttribute('font-size', 38);
        t.setAttribute('class', 'glyph');
        t.setAttribute('fill', pc.color === 'w' ? '#f6f3ea' : '#14161f');
        t.setAttribute('stroke', pc.color === 'w' ? '#1b1d26' : '#9aa3bb');
        t.setAttribute('stroke-width', 1.1);
        t.setAttribute('paint-order', 'stroke');
        t.textContent = GLYPH[pc.type];
        boardEl.appendChild(t);
      }
    }
  }

  if (preview) {
    const [x1, y1] = squareXY(preview.from), [x2, y2] = squareXY(preview.to);
    const ring = document.createElementNS(SVG_NS, 'circle');
    ring.setAttribute('cx', x1); ring.setAttribute('cy', y1); ring.setAttribute('r', 21);
    ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', preview.color);
    ring.setAttribute('stroke-width', 3); ring.setAttribute('stroke-dasharray', '5 4');
    boardEl.appendChild(ring);
    const ln = document.createElementNS(SVG_NS, 'line');
    ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
    ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
    ln.setAttribute('stroke', preview.color); ln.setAttribute('stroke-width', 5);
    ln.setAttribute('stroke-linecap', 'round'); ln.setAttribute('opacity', '.9');
    boardEl.appendChild(ln);
    const dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('cx', x2); dot.setAttribute('cy', y2); dot.setAttribute('r', 9);
    dot.setAttribute('fill', preview.color);
    boardEl.appendChild(dot);
  }
}

boardEl.addEventListener('click', (ev) => {
  const sq = ev.target && ev.target.dataset ? ev.target.dataset.sq : null;
  if (!sq) return;
  if (selected) {
    if (sq === selected) { selected = null; renderBoard(); return; }
    if (tryMove(selected, sq)) return;
  }
  const pc = game.get(sq);
  selected = (pc && pc.color === 'w' && game.turn() === 'w' && !thinking) ? sq : null;
  renderBoard();
});

function setStatus(html) { document.getElementById('status').innerHTML = html; }

function updateHud() {
  let total = 0;
  for (const d of builtDepths()) total += nodesAt(d);
  const layerTxt = cloudState.growing ? `${cloudState.depth}+ 层` : `${cloudState.depth} 层`;
  document.getElementById('cloudStats').innerHTML =
    `铺了 <b>${layerTxt}</b>　·　${Math.round(cloudState.ms)} ms 成云`
    + (lastAi ? `　·　AI 应手 <b>${lastAi.totalMs} ms</b>（搜到 ${lastAi.depth} 层）` : '');
  document.getElementById('cloudCount').innerHTML = cloudState.growing
    ? `这一步之后 <span class="grow">${total.toLocaleString('en-US')}</span> 种未来，还在长`
    : `这一步之后 ${total.toLocaleString('en-US')} 种未来`;
}

// ─────────────────────────────────────────────── 主舞台：平面分叉图
// 一列 = 一步棋。每列把走法按「对行棋方好坏」排好，先摆最靠谱的几条，
// 其余折成一行「还有 N 条」。点哪条，右边就顺它接着分叉。
const forkEl = document.getElementById('fork');
const forkWrap = document.getElementById('forkWrap');
const CARD_H = 38, CARD_GAP = 8, HEAD_H = 62;
let branchPath = [];     // 每列选中的是排序后的第几条
let expanded = [];       // 哪些列被点开了「还有 N 条」
let columns = [];

function buildColumns() {
  const cols = [];
  let fen = game.fen();
  const base = game.history().length;
  for (let i = 0; i < COLS; i++) {
    const ranked = rankMoves(fen, { depth: RANK_DEPTH });
    if (ranked.length === 0) break;
    let idx = branchPath[i];
    if (idx === undefined || idx === null || idx < 0 || idx >= ranked.length) idx = 0;   // 默认最靠谱那条
    const shown = expanded[i] ? ranked.length : Math.min(SHOW[i] || 4, ranked.length);
    cols.push({ fen, ranked, chosen: idx, shown, ply: base + i, white: fen.split(' ')[1] === 'w' });
    fen = ranked[idx].after;
  }
  return cols;
}

function scoreText(s) {
  if (s >= MATE) return '将死';
  if (s <= -MATE) return '被将死';
  return (s >= 0 ? '+' : '') + (s / 100).toFixed(2);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function renderFork() {
  columns = buildColumns();
  const W = Math.max(560, forkWrap.clientWidth || 900);
  const colW = W / Math.max(1, columns.length || 1);
  const cardW = Math.max(96, colW - 34);

  const rowsOf = (c) => c.shown + (c.shown < c.ranked.length ? 1 : 0);
  let maxRows = 1;
  for (const c of columns) maxRows = Math.max(maxRows, rowsOf(c));
  const bodyH = maxRows * (CARD_H + CARD_GAP) - CARD_GAP;
  const H = Math.max(forkWrap.clientHeight || 420, HEAD_H + bodyH + 24);
  const top = HEAD_H;
  // 顶对齐：把某一列点开成几十条时，其余列还待在原地看得见
  const colX = (i) => 18 + i * colW;
  const yOf = (c, j) => top + j * (CARD_H + CARD_GAP);
  const anchorY = top + (Math.min(rowsOf(columns[0] || { shown: 1, ranked: [] }), 7) * (CARD_H + CARD_GAP) - CARD_GAP) / 2;

  let svg = '';

  // 连线：上一列选中那条的右边缘，扇开连到这一列每一条的左边缘
  for (let i = 0; i < columns.length; i++) {
    const c = columns[i];
    const x = colX(i);
    let fx, fy;
    if (i === 0) { fx = 12; fy = anchorY; }
    else {
      const pc = columns[i - 1];
      fx = colX(i - 1) + cardW; fy = yOf(pc, pc.chosen) + CARD_H / 2;
    }
    for (let j = 0; j < c.shown; j++) {
      const y = yOf(c, j) + CARD_H / 2;
      const isPick = j === c.chosen;
      const col = isPick ? 'rgba(143,216,255,.85)' : 'rgba(150,162,196,.20)';
      const mx = (fx + x) / 2;
      svg += `<path d="M${fx.toFixed(1)},${fy.toFixed(1)} C${mx.toFixed(1)},${fy.toFixed(1)} ${mx.toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${isPick ? 2.4 : 1}"/>`;
    }
  }

  // 最左边那个「现在」的点
  svg += `<circle cx="12" cy="${anchorY.toFixed(1)}" r="5" fill="#7ee0a8"/>`;
  svg += `<text x="4" y="${(anchorY - 13).toFixed(1)}" font-size="10.5" fill="#7ee0a8">现在</text>`;

  // 每一列
  for (let i = 0; i < columns.length; i++) {
    const c = columns[i];
    const x = colX(i);
    const who = c.white ? '白' : '黑';
    const mine = c.white ? '你' : '他';
    svg += `<text x="${x}" y="20" font-size="11" fill="#5f6679">第 ${Math.floor(c.ply / 2) + 1} 回合 · ${who}走</text>`;
    svg += `<text x="${x}" y="39" font-size="14" font-weight="650" fill="#e4ecff">${mine}有 ${c.ranked.length} 种走法</text>`;
    svg += `<text x="${x}" y="55" font-size="10.5" fill="#5f6679">${c.shown < c.ranked.length ? `先看最靠谱的 ${c.shown} 条` : '全部列出'}</text>`;

    for (let j = 0; j < c.shown; j++) {
      const m = c.ranked[j];
      const y = yOf(c, j);
      const isPick = j === c.chosen;
      const col = cssColor(m.score, 1.25);
      svg += `<g class="card" data-col="${i}" data-idx="${j}">`
        + `<rect x="${x}" y="${y}" width="${cardW}" height="${CARD_H}" rx="9"`
        + ` fill="${isPick ? 'rgba(60,96,140,.55)' : 'rgba(30,36,52,.62)'}"`
        + ` stroke="${isPick ? '#8fd8ff' : 'rgba(150,170,220,.18)'}" stroke-width="${isPick ? 1.8 : 1}"/>`
        + `<rect x="${x}" y="${y + 7}" width="4" height="${CARD_H - 14}" rx="2" fill="${col}"/>`
        + `<text x="${x + 15}" y="${y + CARD_H / 2 + 1}" font-size="15" font-weight="600" dominant-baseline="middle" fill="#f0f4ff">${esc(m.san)}</text>`
        + `<text x="${x + cardW - 11}" y="${y + CARD_H / 2 + 1}" font-size="12" text-anchor="end" dominant-baseline="middle" fill="${col}" font-variant-numeric="tabular-nums">${scoreText(m.score)}</text>`
        + (j < 3 ? `<text x="${x + cardW - 11}" y="${y + 11}" font-size="8.5" text-anchor="end" fill="#6f768c">${j + 1}</text>` : '')
        + `</g>`;
    }
    if (c.shown < c.ranked.length) {
      const y = yOf(c, c.shown);
      svg += `<g class="more" data-col="${i}">`
        + `<rect x="${x}" y="${y}" width="${cardW}" height="${CARD_H}" rx="9" fill="rgba(24,29,42,.5)" stroke="rgba(150,170,220,.14)" stroke-width="1" stroke-dasharray="4 4"/>`
        + `<text x="${x + cardW / 2}" y="${y + CARD_H / 2 + 1}" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#8c93a8">还有 ${c.ranked.length - c.shown} 条 · 点开</text>`
        + `</g>`;
    }
  }

  forkEl.setAttribute('width', W);
  forkEl.setAttribute('height', H);
  forkEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  forkEl.innerHTML = svg;

  // 已经走过的棋谱
  const hist = game.history();
  let line = '';
  for (let i = 0; i < hist.length; i++) {
    if (i % 2 === 0) line += `<span class="num">${i / 2 + 1}.</span>`;
    line += (i === hist.length - 1 ? `<b>${hist[i]}</b>` : hist[i]) + ' ';
  }
  const picked = columns.map((c) => c.ranked[c.chosen].san).join(' ');
  document.getElementById('moveLine').innerHTML =
    (line ? `走过：${line}` : '还没落子。') + (picked ? `　▸　这条分叉：${picked}` : '');

  document.getElementById('btnPlayLine').disabled =
    !(columns.length && game.turn() === 'w' && !thinking && !game.isGameOver());
}

forkEl.addEventListener('click', (ev) => {
  const more = ev.target.closest ? ev.target.closest('g.more') : null;
  if (more) { expanded[+more.dataset.col] = true; renderFork(); return; }
  const card = ev.target.closest ? ev.target.closest('g.card') : null;
  if (!card) return;
  const i = +card.dataset.col;
  branchPath = branchPath.slice(0, i);
  branchPath[i] = +card.dataset.idx;
  expanded = expanded.slice(0, i + 1);
  renderFork();
});

forkEl.addEventListener('mouseover', (ev) => {
  const card = ev.target.closest ? ev.target.closest('g.card') : null;
  if (!card) return;
  const c = columns[+card.dataset.col];
  const m = c && c.ranked[+card.dataset.idx];
  if (!m) return;
  preview = { from: m.from, to: m.to, color: cssColor(m.score, 1.35) };
  renderBoard();
  const replies = new Chess(m.after).moves().length;
  document.getElementById('forkFoot').innerHTML =
    `<b>${esc(m.san)}</b>　这一步在 ${c.ranked.length} 种里排第 <b>${+card.dataset.idx + 1}</b>`
    + `　·　走完之后对方有 <b>${replies}</b> 种回应`
    + `　·　往前看两步的评估 <b>${scoreText(m.score)}</b>（正=白优）`;
});
forkEl.addEventListener('mouseleave', () => {
  preview = null; renderBoard();
  document.getElementById('forkFoot').textContent = '鼠标停在任意一条上，左边棋盘会把那一步画出来。';
});

document.getElementById('btnPlayLine').onclick = () => {
  if (!columns.length) return;
  const m = columns[0].ranked[columns[0].chosen];
  tryMove(m.from, m.to, m.promotion);
};

// ─────────────────────────────────────────────── 星云小窗的视角
const view = { yaw: 0.6, pitch: 0.28, dist: 34, auto: true };
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) { drag.moved = true; view.auto = false; }
  view.yaw -= (e.clientX - drag.x) * 0.005;
  view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch + (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY, moved: drag.moved };
});
canvas.addEventListener('pointerup', () => {
  if (drag && !drag.moved) toggleCloudFull();      // 没拖动就是点击 → 开/收全屏
  drag = null;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.dist = Math.max(6, Math.min(220, view.dist * (1 + Math.sign(e.deltaY) * 0.09)));
}, { passive: false });

function toggleCloudFull() {
  document.body.classList.toggle('cloud-full');
  const full = document.body.classList.contains('cloud-full');
  document.getElementById('skyHint').textContent = full ? '点一下收回去' : '点开全屏';
  requestAnimationFrame(resize);
}

function resize() {
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderFork();
}
addEventListener('resize', resize);

function frame() {
  if (view.auto) view.yaw += 0.0009;
  const cp = Math.cos(view.pitch);
  camera.position.set(
    Math.sin(view.yaw) * cp * view.dist,
    Math.sin(view.pitch) * view.dist,
    Math.cos(view.yaw) * cp * view.dist,
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ─────────────────────────────────────────────── 对外的检查窗口
/**
 * 星云现状。nodes / layers[].nodes 全部从 three.js 几何体的 position.count 现读，
 * 不是我自己记的账，所以少画一颗都藏不住。
 */
window.__cloudStats = () => {
  const layerList = builtDepths().map((d) => ({ depth: d, nodes: nodesAt(d) }));
  let total = 0;
  for (const l of layerList) total += l.nodes;
  return {
    fen: cloudState.fen,
    depth: cloudState.depth,
    nodes: nodesAt(cloudState.depth),
    ms: Math.round(cloudState.ms),
    layers: layerList,
    totalNodes: total,
    growing: cloudState.growing,
  };
};

/**
 * 分叉图现状。cards 是从 SVG 里真数出来的卡片个数，total 是这一列声明的走法总数，
 * 所以「这一步一共有多少种」也能拿 chess.js 去对撞。
 */
window.__forkStats = () => columns.map((c, i) => ({
  col: i,
  ply: c.ply,
  fen: c.fen,
  total: c.ranked.length,
  cards: forkEl.querySelectorAll(`g.card[data-col="${i}"]`).length,
  shown: c.shown,
  chosenSan: c.ranked[c.chosen].san,
  topSans: c.ranked.slice(0, 3).map((m) => m.san),
  topScores: c.ranked.slice(0, 3).map((m) => m.score),
}));

// 验收用的钩子：走的是和点棋盘完全同一条路
window.__test = {
  tryMove,
  state: () => ({
    fen: game.fen(), turn: game.turn(),
    history: game.history(), over: game.isGameOver(), thinking,
  }),
  ai: () => lastAi,
  pickBranch: (col, idx) => {
    if (!columns[col] || idx >= columns[col].ranked.length) return false;
    branchPath = branchPath.slice(0, col);
    branchPath[col] = idx;
    expanded = expanded.slice(0, col + 1);
    renderFork();
    return true;
  },
  expandCol: (col) => { expanded[col] = true; renderFork(); return true; },
  skyRect: () => {
    const r = canvas.getBoundingClientRect();
    return { x: r.x, y: r.y, w: r.width, h: r.height };
  },
  toggleCloudFull,
  reset: () => {
    game.reset(); selected = null; lastAi = null; thinking = false;
    branchPath = []; expanded = [];
    renderBoard(); rebuildCloud(); renderFork();
  },
};

document.getElementById('btnReset').onclick = () => window.__test.reset();

resize();
renderBoard();
rebuildCloud();
renderFork();
setStatus('你执白，点子走棋。右边每一列就是一步，先给你列最靠谱的几条。');
</script>
</body>
</html>
