<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b10" />
<title>中国象棋 · 可能性分叉</title>
<style>
  :root {
    --bg: #0c100f;
    --panel: rgba(20, 25, 23, .94);
    --panel-2: #151c19;
    --edge: rgba(214, 196, 158, .16);
    --text: #f2eee5;
    --muted: #9ca39e;
    --blue: #66c5ad;
    --blue-2: #193f38;
    --gold: #d6aa5c;
    --red: #a92f2a;
    --danger: #ef6259;
    --ink: #27231e;
    --wood: #d6b179;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    min-height: 100vh; margin: 0; color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 16% 8%, rgba(66, 119, 103, .14), transparent 32rem),
      radial-gradient(circle at 88% 88%, rgba(165, 112, 49, .10), transparent 30rem),
      var(--bg);
  }
  button, select { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  a { color: inherit; }

  .app {
    width: min(1480px, 100%); min-height: 100vh; margin: 0 auto;
    padding: calc(18px + var(--safe-top)) 22px calc(20px + var(--safe-bottom));
  }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    min-height: 50px; margin-bottom: 14px;
  }
  .back {
    display: inline-grid; place-items: center; width: 44px; height: 44px;
    border: 1px solid var(--edge); border-radius: 12px;
    color: #d9d1c2; text-decoration: none; background: rgba(24, 31, 28, .78);
  }
  .brand { min-width: 0; }
  .brand h1 { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: .03em; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; }
  .turn-pill {
    margin-left: auto; flex: 0 0 auto; padding: 7px 11px;
    border: 1px solid var(--edge); border-radius: 999px;
    background: rgba(23, 30, 27, .88); color: #ddd6c9; font-size: 12px;
  }
  .turn-pill[data-side="red"]::before,
  .turn-pill[data-side="black"]::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px;
    border-radius: 50%; vertical-align: 1px;
  }
  .turn-pill[data-side="red"]::before { background: #d44b42; }
  .turn-pill[data-side="black"]::before { background: #25231f; box-shadow: 0 0 0 1px #aaa394; }

  .layout {
    display: grid; grid-template-columns: minmax(480px, 650px) minmax(360px, 1fr);
    gap: 16px; align-items: start;
  }
  .panel {
    min-width: 0; border: 1px solid var(--edge); border-radius: 18px;
    background: var(--panel); box-shadow: 0 20px 64px rgba(0, 0, 0, .36);
  }
  .play-panel { padding: 15px; }
  .board-shell { width: min(100%, 590px); margin: 0 auto; }
  .board-frame {
    position: relative; width: 100%; aspect-ratio: 9 / 10;
    isolation: isolate; border-radius: 13px; overflow: hidden;
    background:
      linear-gradient(91deg, transparent 0 19%, rgba(97, 52, 24, .045) 19.2% 19.5%, transparent 19.8% 58%, rgba(255, 247, 219, .055) 58.2% 58.6%, transparent 58.9%),
      repeating-linear-gradient(3deg, rgba(78, 43, 20, .028) 0 1px, transparent 1px 8px),
      linear-gradient(145deg, #e2c48e 0%, #d6ae72 52%, #c7975c 100%);
    border: clamp(4px, .65vw, 7px) solid #5b3823;
    box-shadow:
      inset 0 0 0 2px rgba(247, 215, 157, .62),
      inset 0 0 0 6px rgba(88, 49, 25, .16),
      0 16px 38px rgba(0, 0, 0, .38);
    user-select: none; touch-action: manipulation;
  }
  .board-frame::after {
    content: ""; position: absolute; z-index: 6; inset: 1.5%;
    border: 1px solid rgba(255, 229, 180, .35); border-radius: 7px;
    box-shadow: inset 0 0 0 1px rgba(83, 45, 23, .23);
    pointer-events: none;
  }
  #boardLines, #threatOverlay, #lastMoveOverlay, #board {
    position: absolute; inset: 5.7%; width: 88.6%; height: 88.6%;
  }
  #boardLines { z-index: 1; }
  #board { z-index: 3; }
  #lastMoveOverlay { z-index: 4; overflow: visible; pointer-events: none; }
  #threatOverlay { z-index: 5; overflow: visible; pointer-events: none; }
  #boardLines line, #boardLines path, #boardLines rect {
    stroke: rgba(58, 36, 23, .82); stroke-width: 1.15; fill: none; vector-effect: non-scaling-stroke;
  }
  #boardLines .outer { stroke-width: 2.1; }
  #boardLines .mark { stroke-width: 1.35; }
  #boardLines text {
    fill: rgba(75, 44, 25, .66); font: 700 6.5px "STKaiti", "KaiTi", serif;
    letter-spacing: 1.8px;
  }
  .square {
    position: absolute; width: 12.1%; height: 10.8%; padding: 0;
    transform: translate(-50%, -50%); border: 0; border-radius: 50%;
    background: transparent; cursor: pointer;
  }
  .square::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 15%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%); opacity: 0;
    background: rgba(30, 117, 99, .92); box-shadow: 0 0 0 5px rgba(46, 143, 121, .18);
  }
  .square.legal-empty::after { opacity: 1; }
  .square.legal-capture::after {
    width: 72%; background: transparent; opacity: 1;
    box-shadow: 0 0 0 3px rgba(180, 42, 37, .9), inset 0 0 0 2px rgba(255, 230, 188, .58);
  }
  .square.preview-you::before,
  .square.preview-reply::before {
    position: absolute; z-index: 5; right: 1%; top: 2%;
    display: grid; place-items: center; width: 29%; aspect-ratio: 1;
    border: 2px solid rgba(232, 247, 255, .9); border-radius: 50%;
    color: #07131c; background: var(--blue);
    box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
    font: 800 10px/1 system-ui;
  }
  .square.preview-you::before { content: "1"; }
  .square.preview-reply::before { content: "2"; background: var(--gold); }
  .piece {
    position: absolute; z-index: 2; left: 50%; top: 50%;
    display: grid; place-items: center; width: 87%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%; border: clamp(2px, .27vw, 3px) solid #62452c;
    background:
      radial-gradient(circle at 38% 27%, #fffdf0 0 17%, #f1dfba 46%, #d3aa70 76%, #a66b36 100%);
    box-shadow:
      inset 0 0 0 2px rgba(255, 249, 221, .72),
      inset 0 -5px 8px rgba(88, 48, 23, .18),
      0 3px 0 #714724,
      0 6px 10px rgba(55, 30, 12, .34);
    color: #24211c; font: 700 clamp(24px, 3.45vw, 34px)/1 "STKaiti", "KaiTi", serif;
    pointer-events: none;
  }
  .piece-glyph {
    position: relative; z-index: 2; transform: translateY(-1%);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .24);
  }
  .piece.red { color: #a52623; border-color: #993b2f; }
  .piece.black { color: #23221f; border-color: #514331; }
  .piece.red::before, .piece.black::before {
    content: ""; position: absolute; inset: 10%; border: 1px solid currentColor;
    border-radius: 50%; opacity: .42;
  }
  .square.selected .piece {
    outline: 3px solid rgba(55, 166, 141, .98); outline-offset: 3px;
    box-shadow: inset 0 0 0 2px #fff1c7, 0 3px 0 #724522, 0 0 0 7px rgba(55, 166, 141, .20);
  }
  .square.last-from {
    background: radial-gradient(circle, transparent 0 27%, rgba(255, 225, 154, .88) 29% 34%, transparent 36%);
  }
  .square.last-to .piece {
    box-shadow:
      inset 0 0 0 2px #fff1c7,
      0 3px 0 #724522,
      0 0 0 5px rgba(242, 189, 99, .62),
      0 0 18px rgba(242, 189, 99, .42);
  }
  .piece.just-moved {
    z-index: 7;
    animation: piece-arrive .54s cubic-bezier(.2, .76, .26, 1) 1 both;
    will-change: transform, opacity;
  }
  @keyframes piece-arrive {
    0% {
      opacity: .68;
      transform:
        translate(calc(-50% + var(--move-dx)), calc(-50% + var(--move-dy)))
        scale(.94);
    }
    74% { opacity: 1; transform: translate(-50%, -50%) scale(1.07); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .last-move-trace {
    fill: none; stroke: #f3c56e; stroke-width: 2.15;
    stroke-linecap: round; vector-effect: non-scaling-stroke;
  }
  .last-move-trace.is-new {
    stroke-dasharray: 1;
    animation: last-move-trace-enter .52s cubic-bezier(.2, .76, .26, 1) 1 both;
  }
  .last-move-origin {
    fill: rgba(49, 35, 17, .20); stroke: #ffe0a0; stroke-width: 2;
    stroke-dasharray: 2.2 1.7; vector-effect: non-scaling-stroke;
  }
  .last-move-target {
    fill: rgba(242, 189, 99, .08); stroke: #f6cb78; stroke-width: 2.1;
    vector-effect: non-scaling-stroke;
  }
  .last-move-target.is-new {
    transform-box: fill-box; transform-origin: center;
    animation: last-move-target-impact .54s ease-out 1 both;
  }
  .last-move-label rect {
    fill: rgba(47, 35, 20, .94); stroke: rgba(255, 222, 154, .84);
    stroke-width: 1; vector-effect: non-scaling-stroke;
  }
  .last-move-label text {
    fill: #ffe5ad; font: 800 2.2px/1 system-ui; letter-spacing: .12px;
    text-anchor: middle; dominant-baseline: central;
  }
  @keyframes last-move-trace-enter {
    0% { opacity: 0; stroke-dashoffset: 1; }
    100% { opacity: .92; stroke-dashoffset: 0; }
  }
  @keyframes last-move-target-impact {
    0% { opacity: .18; transform: scale(1.72); }
    68% { opacity: 1; transform: scale(.92); }
    100% { opacity: 1; transform: scale(1); }
  }
  .threat-ring {
    position: absolute; z-index: 1; inset: -12%; border: 2px solid #c93934;
    border-radius: 50%; box-shadow: 0 0 0 3px rgba(162, 32, 28, .17);
  }
  .threat-ring::after {
    content: ""; position: absolute; inset: 4px; border: 1px dashed rgba(151, 32, 28, .84);
    border-radius: 50%;
  }
  .square[data-threat-level="covered"] .threat-ring {
    border-color: #bd6d25; box-shadow: 0 0 0 3px rgba(184, 101, 27, .15);
  }
  .square[data-threat-level="covered"] .threat-ring::after { border-color: rgba(146, 76, 18, .82); }
  .square[data-threat-level="contested"] .threat-ring {
    border-color: #d04b35; box-shadow: 0 0 0 3px rgba(192, 53, 39, .17);
  }
  .threat-badge {
    position: absolute; z-index: 4; right: -15%; top: -13%;
    display: grid; place-items: center; min-width: 39%; height: 30%; padding: 0 5%;
    border-radius: 999px; color: #fff7e9; background: #a72c28;
    border: 1px solid #f3d6a5; font: 800 clamp(9px, .95vw, 11px)/1 system-ui;
    box-shadow: 0 2px 5px rgba(0, 0, 0, .38);
  }
  .square[data-threat-level="covered"] .threat-badge { background: #a65c1f; }
  .square.threat-new .threat-ring {
    animation: threat-ring-pulse .48s ease-out 2;
  }
  .threat-path {
    --threat-opacity: .22;
    fill: none; stroke: #a93832; stroke-width: 1.55;
    stroke-linecap: round; vector-effect: non-scaling-stroke;
    opacity: var(--threat-opacity);
    animation: threat-path-enter .68s ease-out 1 both;
  }
  .threat-path[data-active-threat="true"] {
    --threat-opacity: .94;
    stroke: #e14d43; stroke-width: 2.45;
  }
  .threat-target {
    fill: rgba(183, 42, 38, .10); stroke: rgba(158, 37, 33, .74);
    stroke-width: 1.2; vector-effect: non-scaling-stroke;
  }
  .threat-source-marker .threat-source-anchor {
    fill: none; stroke: rgba(255, 112, 93, .72); stroke-width: 1.35;
    stroke-dasharray: 1.4 1.25; vector-effect: non-scaling-stroke;
  }
  .threat-source-marker .threat-source-badge {
    fill: rgba(91, 21, 18, .88); stroke: #ff9a82; stroke-width: 1.35;
    vector-effect: non-scaling-stroke;
  }
  .threat-source-marker text, .threat-target-marker text {
    fill: #fff2de; font: 900 2.35px/1 system-ui;
    text-anchor: middle; dominant-baseline: central;
  }
  .threat-target-marker rect {
    fill: rgba(122, 27, 23, .94); stroke: rgba(255, 185, 150, .92);
    stroke-width: 1; vector-effect: non-scaling-stroke;
  }
  .threat-flow {
    fill: none; stroke: #ffb09b; stroke-width: 3.7;
    stroke-linecap: round; stroke-dasharray: .075 .925;
    vector-effect: non-scaling-stroke;
    animation: threat-flow-scan .54s linear 2 both;
  }
  .threat-impact {
    fill: none; stroke: rgba(255, 105, 88, .94); stroke-width: 1.6;
    vector-effect: non-scaling-stroke;
    transform-box: fill-box; transform-origin: center;
    animation: threat-target-impact .48s ease-out 2 both;
  }
  @keyframes threat-ring-pulse {
    0% { opacity: .28; transform: scale(.76); }
    58% { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes threat-path-enter {
    0% { opacity: 0; stroke-dashoffset: 30; }
    100% { opacity: var(--threat-opacity); stroke-dashoffset: 0; }
  }
  @keyframes threat-flow-scan {
    0% { opacity: 0; stroke-dashoffset: 0; }
    14% { opacity: 1; }
    82% { opacity: 1; }
    100% { opacity: 0; stroke-dashoffset: -1; }
  }
  @keyframes threat-target-impact {
    0% { opacity: .18; transform: scale(.72); }
    58% { opacity: 1; transform: scale(1.18); }
    100% { opacity: .18; transform: scale(1); }
  }
  .square:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .threat-strip {
    margin-top: 11px; padding: 9px 10px;
    border: 1px solid rgba(195, 77, 55, .31); border-radius: 12px;
    background: linear-gradient(100deg, rgba(90, 32, 25, .28), rgba(29, 31, 27, .9));
  }
  .threat-main {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: center;
  }
  .threat-seal {
    display: grid; place-items: center; width: 38px; height: 38px;
    border: 1px solid rgba(242, 190, 137, .45); border-radius: 50%;
    color: #ffe8ca; background: #9f3029; font: 800 13px/1 "STKaiti", "KaiTi", serif;
  }
  .threat-copy { min-width: 0; }
  .threat-copy strong { display: block; color: #ffd9c3; font-size: 12px; }
  .threat-copy p { margin: 2px 0 0; color: #bcaea2; font-size: 10.5px; }
  .threat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .threat-chip {
    min-height: 44px; padding: 5px 9px; border: 1px solid rgba(218, 174, 125, .18);
    border-radius: 9px; color: #cfc5b6; background: rgba(24, 27, 24, .76);
    text-align: left; cursor: pointer;
  }
  .threat-chip b { color: #f0d9bf; }
  .threat-chip.active { border-color: rgba(214, 90, 67, .55); background: rgba(99, 38, 29, .42); }
  .attacker-chips {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; padding-top: 7px;
    border-top: 1px solid rgba(218, 174, 125, .12);
  }
  .attacker-chip {
    min-height: 44px; padding: 5px 9px;
    border: 1px solid rgba(217, 77, 61, .22); border-radius: 9px;
    color: #cdbbb0; background: rgba(39, 24, 21, .76);
    text-align: left; cursor: pointer;
  }
  .attacker-chip b { color: #ffd2c7; }
  .attacker-chip.active {
    border-color: rgba(255, 121, 100, .76);
    background: rgba(118, 38, 31, .58);
    box-shadow: inset 3px 0 0 #ef5b4f;
  }

  .board-info {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px; align-items: start; margin-top: 13px;
  }
  .coach {
    min-height: 66px; padding: 10px 12px;
    border: 1px solid rgba(102, 197, 173, .19); border-radius: 12px;
    background: rgba(17, 25, 22, .88);
  }
  .coach strong { display: block; margin-bottom: 4px; color: #e3f5ee; font-size: 13px; }
  .coach p { margin: 0; color: #a3ada7; font-size: 12px; }
  .coach[data-tone="watch"] { border-color: rgba(213, 154, 69, .31); }
  .coach[data-tone="watch"] strong { color: #f0cf95; }
  .coach[data-tone="danger"] { border-color: rgba(255, 113, 107, .35); }
  .coach[data-tone="danger"] strong { color: #ffada8; }
  .actions { display: flex; flex-direction: column; gap: 7px; }
  .actions button, .tree-toolbar button {
    min-height: 44px; padding: 7px 12px; border: 1px solid var(--edge);
    border-radius: 10px; color: #e1ddd4; background: #1b2420; cursor: pointer;
  }
  .actions button:disabled { opacity: .36; cursor: default; }
  .facts {
    display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px;
    color: #8e9cad; font-size: 11px;
  }
  .fact {
    padding: 5px 8px; border: 1px solid rgba(210, 196, 164, .11);
    border-radius: 8px; background: rgba(15, 20, 18, .72);
  }
  .fact b { color: #dce7f3; font-variant-numeric: tabular-nums; }
  .rule-scope {
    margin: 8px 1px 0; color: #71808f; font-size: 10px; line-height: 1.5;
  }

  .tree-panel { min-height: 720px; overflow: hidden; }
  .tree-head {
    display: flex; gap: 12px; align-items: center; padding: 15px 16px 12px;
    border-bottom: 1px solid var(--edge);
  }
  .tree-title { min-width: 0; }
  .tree-title h2 { margin: 0; font-size: 15px; }
  .tree-title p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
  .tree-toolbar { display: flex; gap: 6px; margin-left: auto; }
  .tree-toolbar button { min-width: 44px; padding: 5px 9px; }
  .tree-viewport {
    position: relative; height: 646px; overflow: auto; overscroll-behavior: contain;
    background:
      linear-gradient(rgba(151, 180, 166, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(151, 180, 166, .035) 1px, transparent 1px),
      #101713;
    background-size: 28px 28px;
    scrollbar-color: rgba(102, 197, 173, .42) #101713;
  }
  .tree-canvas {
    min-width: 650px; width: max-content; min-height: 100%;
    padding: 20px 22px 42px; transform-origin: 0 0;
  }
  .legend { display: flex; gap: 14px; margin-bottom: 16px; color: #87928b; font-size: 10px; }
  .legend span::before {
    content: ""; display: inline-block; width: 18px; height: 2px; margin-right: 6px;
    vertical-align: 3px; background: currentColor;
  }
  .legend .user { color: var(--blue); }
  .legend .pv { color: var(--gold); }
  .path-lane, .pv-lane, .branch-block { position: relative; padding-left: 30px; }
  .lane-label {
    position: absolute; left: 0; top: 6px; color: #78847d;
    font-size: 10px; writing-mode: vertical-rl; letter-spacing: .12em;
  }
  .node-row {
    position: relative; display: flex; align-items: stretch; gap: 20px;
    width: max-content; min-height: 64px;
  }
  .node-row::before {
    content: ""; position: absolute; left: 52px; right: 52px; top: 28px;
    height: 2px; background: var(--blue);
  }
  .path-node, .pv-node, .branch-node, .root-node {
    position: relative; z-index: 1; display: flex; flex-direction: column;
    justify-content: center; width: 118px; min-height: 58px; padding: 8px 10px;
    border: 1px solid rgba(102, 197, 173, .34); border-radius: 11px;
    color: #e5f3ed; background: #163129; box-shadow: 0 8px 18px rgba(0, 0, 0, .2);
  }
  .path-node b, .pv-node b, .branch-node b, .root-node b {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px;
  }
  .path-node small, .pv-node small, .branch-node small, .root-node small {
    margin-top: 3px; color: #96a49d; font-size: 9.5px; font-variant-numeric: tabular-nums;
  }
  .root-node { border-color: rgba(122, 211, 166, .38); background: #173127; }
  .path-node.ai-move { border-color: rgba(214, 170, 92, .38); background: #302719; color: #f9e6ba; }
  .empty-path {
    display: grid; place-items: center; width: 240px; min-height: 58px;
    border: 1px dashed rgba(102, 197, 173, .24); border-radius: 11px;
    color: #75827b; font-size: 11px; background: rgba(16, 25, 21, .72);
  }
  .pv-lane { margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(242, 189, 99, .12); }
  .pv-lane .node-row::before { background: var(--gold); }
  .pv-node { border-color: rgba(242, 189, 99, .42); color: #ffe9bd; background: #302616; }
  .pv-empty { color: #766c59; font-size: 11px; padding: 12px 0; }
  .branch-block { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--edge); }
  .branch-summary { margin: 0 0 12px; color: #d2d8d3; font-size: 12px; }
  .branch-summary b { color: var(--blue); font-size: 16px; }
  .branch-grid {
    position: relative; display: grid; grid-template-columns: repeat(4, 118px);
    gap: 12px 14px; width: max-content; padding-top: 16px;
  }
  .branch-grid::before {
    content: ""; position: absolute; left: 58px; right: 58px; top: 0;
    height: 1px; background: rgba(102, 197, 173, .33);
  }
  .branch-node {
    min-height: 54px; padding: 7px 9px; text-align: left; cursor: pointer;
    border-color: rgba(164, 186, 174, .19); background: #19231f;
  }
  button.branch-node::before {
    content: ""; position: absolute; left: 50%; top: -17px;
    width: 1px; height: 16px; background: rgba(102, 197, 173, .32);
  }
  button.branch-node:hover { border-color: rgba(102, 197, 173, .6); background: #1c312b; }

<div id="fatal" class="fatal" hidden>

<script type="module">
const INITIAL_FEN =
  'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1';
const GLYPHS = Object.freeze({
  K: '帅', A: '仕', B: '相', E: '相', N: '马', H: '马', R: '车', C: '炮', P: '兵',
  k: '将', a: '士', b: '象', e: '象', n: '马', h: '马', r: '车', c: '炮', p: '卒',
});
const PIECE_NAMES = Object.freeze({
  K: '帅', A: '仕', B: '相', E: '相', N: '红马', H: '红马', R: '红车', C: '红炮', P: '兵',
  k: '将', a: '士', b: '象', e: '象', n: '黑马', h: '黑马', r: '黑车', c: '黑炮', p: '卒',
});
const FILES = 'abcdefghi';

const els = Object.freeze({
  board: document.getElementById('board'),
  threatPaths: document.getElementById('threatPaths'),
  lastMoveMarks: document.getElementById('lastMoveMarks'),
  threatStrip: document.getElementById('threatStrip'),
  threatHeadline: document.getElementById('threatHeadline'),
  threatDetail: document.getElementById('threatDetail'),
  threatChips: document.getElementById('threatChips'),
  attackerChips: document.getElementById('attackerChips'),
  turn: document.getElementById('turnPill'),
  coach: document.getElementById('coach'),
  legalCount: document.getElementById('legalCount'),
  threatCount: document.getElementById('threatCount'),
  pathCount: document.getElementById('pathCount'),
  lastMoveFact: document.getElementById('lastMoveFact'),
  searchFact: document.getElementById('searchFact'),
  undo: document.getElementById('undo'),
  reset: document.getElementById('reset'),
  pathRow: document.getElementById('pathRow'),
  pvRow: document.getElementById('pvRow'),
  branchSummary: document.getElementById('branchSummary'),
  branchGrid: document.getElementById('branchGrid'),
  thinkingRow: document.getElementById('thinkingRow'),
  treeViewport: document.getElementById('treeViewport'),
  treeCanvas: document.getElementById('treeCanvas'),
  zoomOut: document.getElementById('zoomOut'),
  zoomReset: document.getElementById('zoomReset'),
  zoomIn: document.getElementById('zoomIn'),
  fatal: document.getElementById('fatal'),
  fatalMessage: document.getElementById('fatalMessage'),
});

let engine;
try {
  engine = await import('./xiangqi-engine.js');
} catch (error) {
  els.fatal.hidden = false;
  els.fatalMessage.textContent = String(error && error.message || error);
  throw error;
}

// ── 引擎适配层：页面其余部分只使用这里的规范形状。
const api = (() => {
  const parse = engine.parseFen || engine.fromFen || engine.createPosition;
  const stringify = engine.toFen || engine.fen;
  const legal = engine.generateLegalMoves || engine.legalMoves || engine.moves;
  const apply = engine.applyMove || engine.makeMove || engine.playMove;
  if (![parse, stringify, legal, apply].every((fn) => typeof fn === 'function')) {
    throw new Error('xiangqi-engine.js 缺少 parseFen / toFen / generateLegalMoves / applyMove');
  }

  function parseFen(fen) { return parse(fen); }
  function toFen(position) { return stringify(position); }
  function legalMoves(position) {
    const result = legal(position);
    return Array.isArray(result) ? result : (result && result.moves) || [];
  }
  function applyMove(position, move) {
    const result = apply(position, move);
    return result || position;
  }
  function initialFen() {
    return engine.INITIAL_FEN || engine.START_FEN || INITIAL_FEN;
  }
  function notation(position, move) {
    return typeof engine.moveToNotation === 'function'
      ? engine.moveToNotation(position, move)
      : '';
  }
  function isCheck(position) {
    if (typeof engine.isInCheck === 'function') return !!engine.isInCheck(position);
    if (typeof engine.inCheck === 'function') return !!engine.inCheck(position);
    return !!(position && (position.inCheck || position.check));
  }
  function threats(position) {
    return typeof engine.getThreats === 'function' ? engine.getThreats(position) : null;
  }
  function status(position) {
    return typeof engine.getGameStatus === 'function' ? engine.getGameStatus(position) : null;
  }
  return Object.freeze({
    parseFen, toFen, legalMoves, applyMove, initialFen, notation, isCheck, threats, status,
  });
})();

function fenSide(fen) {
  const token = String(fen).trim().split(/\s+/)[1] || 'r';
  return token === 'b' ? 'black' : 'red';
}
function fenWithSide(fen, side) {
  const fields = String(fen).trim().split(/\s+/);
  fields[1] = side === 'black' ? 'b' : 'w';
  return fields.join(' ');
}
function boardFromFen(fen) {
  const ranks = String(fen).split(/\s+/)[0].split('/');
  const board = Array(90).fill('');
  for (let row = 0; row < 10; row++) {
    let col = 0;
    for (const char of ranks[row] || '') {
      if (/\d/.test(char)) col += Number(char);
      else if (col < 9) board[row * 9 + col++] = char;
    }
  }
  return board;
}
function normalizeSquare(value) {
  if (Number.isInteger(value)) return value >= 0 && value < 90 ? value : -1;
  if (Array.isArray(value) && value.length >= 2) {
    const [row, col] = value.map(Number);
    return row >= 0 && row < 10 && col >= 0 && col < 9 ? row * 9 + col : -1;
  }
  if (value && typeof value === 'object') {
    const row = Number(value.row ?? value.r ?? value.rank);
    const col = Number(value.col ?? value.c ?? value.file);
    if (row >= 0 && row < 10 && col >= 0 && col < 9) return row * 9 + col;
  }
  if (typeof value === 'string') {
    if (/^\d{1,2}$/.test(value)) return normalizeSquare(Number(value));
    const compact = value.toLowerCase().replace(/[^a-i0-9]/g, '');
    const m = /^([a-i])([0-9])$/.exec(compact);
    if (m) return (9 - Number(m[2])) * 9 + FILES.indexOf(m[1]);
    const rc = /^([0-9]),?([0-8])$/.exec(value);
    if (rc) return Number(rc[1]) * 9 + Number(rc[2]);
  }
  return -1;
}
function moveFrom(move) { return normalizeSquare(move && (move.from ?? move.src ?? move.source)); }
function moveTo(move) { return normalizeSquare(move && (move.to ?? move.dst ?? move.target)); }
function coord(square) {
  const row = Math.floor(square / 9), col = square % 9;
  return `${FILES[col]}${9 - row}`;
}
function boardPoint(square) {
  return {
    x: (square % 9) * 10,
    y: Math.floor(square / 9) * 10,
  };
}
function clamp(value, minimum, maximum) {
  return Math.max(minimum, Math.min(maximum, value));
}
function moveLabel(move, positionBefore = null) {
  return String(move && (move.notation || move.san || move.label || move.uci || move.iccs
    || (positionBefore && api.notation(positionBefore, move)))
    || `${coord(moveFrom(move))}→${coord(moveTo(move))}`);
}
function sameMove(a, b) {
  return moveFrom(a) === moveFrom(b) && moveTo(a) === moveTo(b);
}
function pieceIsRed(piece) { return !!piece && piece === piece.toUpperCase(); }
function sideOwns(piece, side) { return !!piece && pieceIsRed(piece) === (side === 'red'); }
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[ch]);
}

let currentFen = api.initialFen();
let position = api.parseFen(currentFen);
let currentMoves = api.legalMoves(position);
let selectedSquare = -1;
let threatened = new Map();
let threatPulseSquares = new Set();
let threatOverlayKey = '';
let activeThreatAttacker = -1;
let lastMove = null;
let lastMoveOverlayKey = '';
let pendingMoveAnimation = null;
let path = [];
let snapshots = [{ fen: currentFen, pathLength: 0 }];
let pv = [];
let thinking = false;
let gameOver = false;
let searchWorker = null;
let branchWorker = null;
let requestId = 0;
let branchRequestId = 0;
let branchRequestFen = '';
let rankedBranches = [];
let lastSearchMs = 0;
let lastSearchDepth = 0;
let zoom = 1;
let previewLine = null;

function refreshPosition(fen) {
  position = api.parseFen(fen);
  currentFen = api.toFen(position);
  currentMoves = api.legalMoves(position);
  gameOver = currentMoves.length === 0;
  refreshThreatened(currentFen);
}

function computeThreatened(fen) {
  try {
    const direct = api.threats(api.parseFen(fen));
    if (Array.isArray(direct)) {
      const details = new Map();
      for (const entry of direct) {
        const square = normalizeSquare(entry.square);
        if (square < 0) continue;
        details.set(square, Object.freeze({
          square,
          piece: String(entry.piece || ''),
          side: String(entry.side || ''),
          value: Number(entry.value) || 0,
          attackers: Object.freeze((entry.attackers || [])
            .map(normalizeSquare).filter((source) => source >= 0)),
          defenders: Object.freeze((entry.defenders || [])
            .map(normalizeSquare).filter((source) => source >= 0)),
          certainty: entry.certainty === 'geometric' ? 'geometric' : String(entry.certainty || 'geometric'),
        }));
      }
      return details;
    }
  } catch {
    // 旧引擎没有威胁接口时，退到下一段的合法吃子推导。
  }
  const board = boardFromFen(fen);
  const side = fenSide(fen);
  const opponent = side === 'red' ? 'black' : 'red';
  let attacks = [];
  try {
    attacks = api.legalMoves(api.parseFen(fenWithSide(fen, opponent)));
  } catch {
    return new Map();
  }
  const result = new Map();
  for (const move of attacks) {
    const from = moveFrom(move);
    const to = moveTo(move);
    const target = board[to];
    if (to < 0 || from < 0 || !target || !sideOwns(target, side)) continue;
    const previous = result.get(to);
    const attackers = previous ? [...previous.attackers, from] : [from];
    result.set(to, Object.freeze({
      square: to,
      piece: target,
      side,
      value: 0,
      attackers: Object.freeze(attackers),
      defenders: Object.freeze([]),
      certainty: 'geometric',
    }));
  }
  return result;
}

function threatSignature(detail) {
  return `${detail.attackers.join(',')}|${detail.defenders.join(',')}|${detail.value}`;
}

function refreshThreatened(fen) {
  const next = computeThreatened(fen);
  threatPulseSquares = new Set([...next].flatMap(([square, detail]) =>
    threatSignature(threatened.get(square) || { attackers: [], defenders: [], value: -1 })
      === threatSignature(detail)
      ? []
      : [square]));
  threatened = next;
  threatOverlayKey = '';
}

function threatLevel(detail) {
  if (!detail.defenders.length) return 'unguarded';
  if (detail.attackers.length > detail.defenders.length) return 'contested';
  return 'covered';
}

function prioritizedThreats() {
  return [...threatened.values()].sort((left, right) => {
    const levelRank = { unguarded: 0, contested: 1, covered: 2 };
    return levelRank[threatLevel(left)] - levelRank[threatLevel(right)]
      || right.value - left.value
      || left.square - right.square;
  });
}

function activeThreat() {
  return threatened.get(selectedSquare) || prioritizedThreats()[0] || null;
}

function focusedThreat() {
  return selectedSquare >= 0 ? threatened.get(selectedSquare) || null : activeThreat();
}

function createBoardSquares() {
  const fragment = document.createDocumentFragment();
  for (let square = 0; square < 90; square++) {
    const row = Math.floor(square / 9), col = square % 9;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'square';
    button.dataset.square = String(square);
    button.setAttribute('role', 'gridcell');
    button.style.left = `${(col / 8) * 100}%`;
    button.style.top = `${(row / 9) * 100}%`;
    button.addEventListener('click', () => handleSquare(square));
    fragment.append(button);
  }
  els.board.append(fragment);
}

function legalForSelected() {
  return selectedSquare < 0 ? [] : currentMoves.filter((move) => moveFrom(move) === selectedSquare);
}

function renderBoard() {
  const board = boardFromFen(currentFen);
  const selectedMoves = legalForSelected();
  const legalTargets = new Map(selectedMoves.map((move) => [moveTo(move), move]));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const boardRect = els.board.getBoundingClientRect();
  const animatedFrom = pendingMoveAnimation ? moveFrom(pendingMoveAnimation.move) : -1;
  const animatedTo = pendingMoveAnimation ? moveTo(pendingMoveAnimation.move) : -1;
  const moveDx = animatedFrom >= 0 && animatedTo >= 0
    ? ((animatedFrom % 9) - (animatedTo % 9)) * boardRect.width / 8
    : 0;
  const moveDy = animatedFrom >= 0 && animatedTo >= 0
    ? (Math.floor(animatedFrom / 9) - Math.floor(animatedTo / 9)) * boardRect.height / 9
    : 0;
  for (const squareEl of els.board.children) {
    const square = Number(squareEl.dataset.square);
    const piece = board[square];
    const threat = threatened.get(square);
    squareEl.className = 'square';
    delete squareEl.dataset.attackers;
    delete squareEl.dataset.defenders;
    delete squareEl.dataset.threatLevel;
    if (square === selectedSquare) squareEl.classList.add('selected');
    if (lastMove && square === moveFrom(lastMove)) squareEl.classList.add('last-from');
    if (lastMove && square === moveTo(lastMove)) squareEl.classList.add('last-to');
    if (previewLine && square === moveTo(previewLine.move)) squareEl.classList.add('preview-you');
    if (previewLine?.reply && square === moveTo(previewLine.reply)) squareEl.classList.add('preview-reply');
    if (threat) {
      squareEl.classList.add('threatened');
      squareEl.dataset.threatened = 'true';
      squareEl.dataset.attackers = threat.attackers.map(coord).join(',');
      squareEl.dataset.defenders = threat.defenders.map(coord).join(',');
      squareEl.dataset.threatLevel = threatLevel(threat);
      if (threatPulseSquares.has(square) && !reduceMotion) {
        squareEl.classList.add('threat-new');
      } else if (reduceMotion) {
        threatPulseSquares.delete(square);
      }
    } else {
      delete squareEl.dataset.threatened;
    }
    if (legalTargets.has(square)) {
      squareEl.classList.add(piece ? 'legal-capture' : 'legal-empty');
      squareEl.dataset.target = coord(square);
    } else {
      delete squareEl.dataset.target;
    }
    const renderKey = piece
      ? `${piece}|${threat ? `${threatLevel(threat)}|${threatSignature(threat)}` : 'safe'}`
      : '';
    const existingDisk = squareEl.querySelector(':scope > .piece');
    if (!piece) {
      if (existingDisk || squareEl.childNodes.length) squareEl.replaceChildren();
    } else if (!existingDisk || existingDisk.dataset.renderKey !== renderKey) {
      squareEl.replaceChildren();
      const disk = document.createElement('span');
      disk.className = `piece ${pieceIsRed(piece) ? 'red' : 'black'}`;
      disk.dataset.renderKey = renderKey;
      disk.dataset.square = coord(square);
      disk.dataset.side = pieceIsRed(piece) ? 'red' : 'black';
      disk.dataset.piece = piece.toLowerCase();
      const glyph = document.createElement('span');
      glyph.className = 'piece-glyph';
      glyph.textContent = GLYPHS[piece] || piece;
      disk.append(glyph);
      if (threat) {
        const ring = document.createElement('span');
        ring.className = 'threat-ring';
        ring.setAttribute('aria-hidden', 'true');
        const badge = document.createElement('span');
        badge.className = 'threat-badge';
        badge.textContent = '危';
        badge.setAttribute('aria-hidden', 'true');
        disk.append(ring, badge);
      }
      squareEl.append(disk);
    }
    const renderedDisk = squareEl.querySelector(':scope > .piece');
    const shouldAnimateMove = !!renderedDisk
      && square === animatedTo
      && pendingMoveAnimation?.fen === currentFen
      && lastMove
      && moveFrom(lastMove) === animatedFrom
      && moveTo(lastMove) === animatedTo;
    if (shouldAnimateMove) {
      renderedDisk.classList.add('just-moved');
      renderedDisk.dataset.motionRole = 'piece-arrive';
      renderedDisk.style.setProperty('--move-dx', `${moveDx}px`);
      renderedDisk.style.setProperty('--move-dy', `${moveDy}px`);
    } else if (renderedDisk?.classList.contains('just-moved')) {
      renderedDisk.classList.remove('just-moved');
      delete renderedDisk.dataset.motionRole;
      renderedDisk.style.removeProperty('--move-dx');
      renderedDisk.style.removeProperty('--move-dy');
    }
    const place = coord(square);
    const threatCopy = threatened.has(square) ? '，被攻击线瞄准' : '';
    const previewCopy = previewLine && square === moveTo(previewLine.move)
      ? '，预演第 1 步'
      : previewLine?.reply && square === moveTo(previewLine.reply)
        ? '，预演第 2 步'
        : '';
    squareEl.setAttribute('aria-label', piece
      ? `${place} ${PIECE_NAMES[piece] || piece}${threatCopy}${previewCopy}`
      : `${place} 空位${previewCopy}`);
    squareEl.disabled = thinking || gameOver
      || (!piece && !legalTargets.has(square))
      || (piece && !sideOwns(piece, fenSide(currentFen)) && !legalTargets.has(square));
  }
}

function renderLastMoveOverlay() {
  const from = moveFrom(lastMove);
  const to = moveTo(lastMove);
  const isNew = !!pendingMoveAnimation
    && pendingMoveAnimation.fen === currentFen
    && moveFrom(pendingMoveAnimation.move) === from
    && moveTo(pendingMoveAnimation.move) === to;
  const key = lastMove && from >= 0 && to >= 0
    ? `${currentFen}|${from}|${to}|${isNew ? pendingMoveAnimation.key : 'settled'}`
    : `${currentFen}|none`;
  if (key === lastMoveOverlayKey) return;
  lastMoveOverlayKey = key;
  els.lastMoveMarks.replaceChildren();
  if (!lastMove || from < 0 || to < 0) return;

  const namespace = 'http://www.w3.org/2000/svg';
  const source = boardPoint(from);
  const target = boardPoint(to);
  const dx = target.x - source.x;
  const dy = target.y - source.y;
  const distance = Math.hypot(dx, dy) || 1;
  const xUnit = dx / distance;
  const yUnit = dy / distance;
  const minimumLine = Math.max(2, Math.min(4, distance * .24));
  const paddingScale = Math.min(1, Math.max(0, distance - minimumLine) / 9.4);
  const sourcePadding = 3.5 * paddingScale;
  const targetPadding = 5.9 * paddingScale;
  const fromCoord = coord(from);
  const toCoord = coord(to);
  const setMoveData = (element) => {
    element.dataset.from = fromCoord;
    element.dataset.to = toCoord;
  };

  const trace = document.createElementNS(namespace, 'line');
  trace.classList.add('last-move-trace');
  if (isNew) trace.classList.add('is-new');
  trace.setAttribute('x1', String(source.x + xUnit * sourcePadding));
  trace.setAttribute('y1', String(source.y + yUnit * sourcePadding));
  trace.setAttribute('x2', String(target.x - xUnit * targetPadding));
  trace.setAttribute('y2', String(target.y - yUnit * targetPadding));
  trace.setAttribute('pathLength', '1');
  trace.dataset.lastMoveTrace = 'true';
  trace.dataset.visualRole = 'last-move';
  trace.dataset.motionRole = 'last-trace';
  setMoveData(trace);

  const origin = document.createElementNS(namespace, 'circle');
  origin.classList.add('last-move-origin');
  origin.setAttribute('cx', String(source.x));
  origin.setAttribute('cy', String(source.y));
  origin.setAttribute('r', '3.35');
  origin.dataset.lastMoveOrigin = 'true';
  setMoveData(origin);

  const destination = document.createElementNS(namespace, 'circle');
  destination.classList.add('last-move-target');
  if (isNew) destination.classList.add('is-new');
  destination.setAttribute('cx', String(target.x));
  destination.setAttribute('cy', String(target.y));
  destination.setAttribute('r', '6.05');
  destination.dataset.lastMoveTarget = 'true';
  destination.dataset.motionRole = 'last-impact';
  setMoveData(destination);

  const midpoint = {
    x: (source.x + target.x) / 2,
    y: (source.y + target.y) / 2,
  };
  const labelX = clamp(midpoint.x - yUnit * 5.2, 7.2, 72.8);
  const labelY = clamp(midpoint.y + xUnit * 5.2, 3.4, 86.6);
  const label = document.createElementNS(namespace, 'g');
  label.classList.add('last-move-label');
  label.setAttribute('transform', `translate(${labelX} ${labelY})`);
  label.dataset.lastMoveLabel = 'true';
  setMoveData(label);
  const labelPlate = document.createElementNS(namespace, 'rect');
  labelPlate.setAttribute('x', '-6.8');
  labelPlate.setAttribute('y', '-2.55');
  labelPlate.setAttribute('width', '13.6');
  labelPlate.setAttribute('height', '5.1');
  labelPlate.setAttribute('rx', '2.55');
  const labelText = document.createElementNS(namespace, 'text');
  labelText.setAttribute('x', '0');
  labelText.setAttribute('y', '.1');
  labelText.textContent = '上一步';
  label.append(labelPlate, labelText);

  els.lastMoveMarks.append(trace, origin, destination, label);
}

function renderThreatOverlay() {
  const detail = focusedThreat();
  if (detail && !detail.attackers.includes(activeThreatAttacker)) {
    activeThreatAttacker = detail.attackers[0] ?? -1;
  } else if (!detail) {
    activeThreatAttacker = -1;
  }
  const key = detail
    ? `${currentFen}|${selectedSquare}|${detail.square}|${threatSignature(detail)}|${activeThreatAttacker}`
    : `${currentFen}|none`;
  if (key === threatOverlayKey) return;
  threatOverlayKey = key;
  els.threatPaths.replaceChildren();
  if (!detail || activeThreatAttacker < 0) return;

  const namespace = 'http://www.w3.org/2000/svg';
  const target = boardPoint(detail.square);
  let activeGeometry = null;

  const targetGroup = document.createElementNS(namespace, 'g');
  targetGroup.classList.add('threat-target-marker');
  targetGroup.dataset.threatTarget = coord(detail.square);
  const targetCircle = document.createElementNS(namespace, 'circle');
  targetCircle.classList.add('threat-target');
  targetCircle.setAttribute('cx', String(target.x));
  targetCircle.setAttribute('cy', String(target.y));
  targetCircle.setAttribute('r', '5.3');
  targetGroup.append(targetCircle);

  for (const attacker of detail.attackers) {
    const source = boardPoint(attacker);
    const dx = target.x - source.x;
    const dy = target.y - source.y;
    const distance = Math.hypot(dx, dy) || 1;
    const xUnit = dx / distance;
    const yUnit = dy / distance;
    const minimumLine = Math.max(1.6, Math.min(3.2, distance * .22));
    const paddingScale = Math.min(1, Math.max(0, distance - minimumLine) / (5.2 + 6.1));
    const sourcePadding = 5.2 * paddingScale;
    const targetPadding = 6.1 * paddingScale;
    const geometry = {
      x1: source.x + xUnit * sourcePadding,
      y1: source.y + yUnit * sourcePadding,
      x2: target.x - xUnit * targetPadding,
      y2: target.y - yUnit * targetPadding,
      source,
      distance,
    };
    const line = document.createElementNS(namespace, 'line');
    line.classList.add('threat-path');
    line.setAttribute('x1', String(geometry.x1));
    line.setAttribute('y1', String(geometry.y1));
    line.setAttribute('x2', String(geometry.x2));
    line.setAttribute('y2', String(geometry.y2));
    line.setAttribute('marker-end',
      distance < 16 ? 'url(#threatArrowHeadCompact)' : 'url(#threatArrowHead)');
    line.dataset.threatArrow = 'true';
    line.dataset.from = coord(attacker);
    line.dataset.to = coord(detail.square);
    line.dataset.visualRole = 'threat';
    line.dataset.activeThreat = String(attacker === activeThreatAttacker);
    els.threatPaths.append(line);
    if (attacker === activeThreatAttacker) activeGeometry = geometry;
  }

  if (!activeGeometry) return;
  const activeFrom = coord(activeThreatAttacker);
  const activeTo = coord(detail.square);
  const flow = document.createElementNS(namespace, 'line');
  flow.classList.add('threat-flow');
  flow.setAttribute('x1', String(activeGeometry.x1));
  flow.setAttribute('y1', String(activeGeometry.y1));
  flow.setAttribute('x2', String(activeGeometry.x2));
  flow.setAttribute('y2', String(activeGeometry.y2));
  flow.setAttribute('pathLength', '1');
  flow.dataset.threatFlow = 'true';
  flow.dataset.flowFrom = activeFrom;
  flow.dataset.flowTo = activeTo;
  flow.dataset.motionRole = 'threat-flow';

  const source = activeGeometry.source;
  const sourceLabelX = clamp(source.x + (source.x > 60 ? -6 : 6), 3.2, 76.8);
  const sourceLabelY = clamp(source.y + (source.y < 10 ? 6 : -6), 3.2, 86.8);
  const sourceGroup = document.createElementNS(namespace, 'g');
  sourceGroup.classList.add('threat-source-marker');
  sourceGroup.dataset.threatSource = activeFrom;
  const sourceAnchor = document.createElementNS(namespace, 'circle');
  sourceAnchor.classList.add('threat-source-anchor');
  sourceAnchor.setAttribute('cx', String(source.x));
  sourceAnchor.setAttribute('cy', String(source.y));
  sourceAnchor.setAttribute('r', '5.6');
  const sourceBadge = document.createElementNS(namespace, 'circle');
  sourceBadge.classList.add('threat-source-badge');
  sourceBadge.setAttribute('cx', String(sourceLabelX));
  sourceBadge.setAttribute('cy', String(sourceLabelY));
  sourceBadge.setAttribute('r', '2.85');
  const sourceText = document.createElementNS(namespace, 'text');
  sourceText.setAttribute('x', String(sourceLabelX));
  sourceText.setAttribute('y', String(sourceLabelY + .1));
  sourceText.textContent = '攻';
  sourceGroup.append(sourceAnchor, sourceBadge, sourceText);

  const impact = document.createElementNS(namespace, 'circle');
  impact.classList.add('threat-impact');
  impact.setAttribute('cx', String(target.x));
  impact.setAttribute('cy', String(target.y));
  impact.setAttribute('r', '6.45');
  impact.dataset.motionRole = 'threat-impact';
  targetGroup.append(impact);
  const targetLabelX = clamp(target.x + (target.x > 60 ? -6.2 : 6.2), 3.4, 76.6);
  const targetLabelY = clamp(target.y + (target.y < 10 ? 6 : -6), 3.2, 86.8);
  const targetPlate = document.createElementNS(namespace, 'rect');
  targetPlate.setAttribute('x', String(targetLabelX - 3));
  targetPlate.setAttribute('y', String(targetLabelY - 2.3));
  targetPlate.setAttribute('width', '6');
  targetPlate.setAttribute('height', '4.6');
  targetPlate.setAttribute('rx', '2.3');
  const targetText = document.createElementNS(namespace, 'text');
  targetText.setAttribute('x', String(targetLabelX));
  targetText.setAttribute('y', String(targetLabelY + .1));
  targetText.textContent = '危';
  targetGroup.append(targetPlate, targetText);

  els.threatPaths.append(flow, sourceGroup, targetGroup);
}

function renderThreatStrip() {
  const detail = focusedThreat();
  els.threatStrip.hidden = !detail;
  if (!detail) {
    els.threatHeadline.textContent = '';
    els.threatDetail.textContent = '';
    els.threatChips.replaceChildren();
    els.attackerChips.replaceChildren();
    return;
  }
  const board = boardFromFen(currentFen);
  const targetPiece = PIECE_NAMES[board[detail.square]] || '棋子';
  const attackerCoords = detail.attackers.map(coord);
  const attackerNames = detail.attackers.map((square) =>
    `${PIECE_NAMES[board[square]] || '对方棋子'} ${coord(square)}`);
  const defenderNames = detail.defenders.map((square) =>
    `${PIECE_NAMES[board[square]] || '己方棋子'} ${coord(square)}`);
  const defenseCopy = defenderNames.length
    ? `${defenderNames.join('、')}保护`
    : '当前没有己方棋子保护';
  const activeIndex = Math.max(0, detail.attackers.indexOf(activeThreatAttacker));
  const activeCoord = coord(detail.attackers[activeIndex]);
  els.threatHeadline.textContent =
    `正在看第 ${activeIndex + 1}/${detail.attackers.length} 条：${activeCoord} 攻 → ${coord(detail.square)} 危`;
  els.threatDetail.textContent =
    `${attackerNames.join('、')}瞄准${targetPiece} · ${detail.attackers.length} 攻 / ${detail.defenders.length} 守 · ${defenseCopy}；只表示当前几何攻击线。`;
  els.threatChips.innerHTML = prioritizedThreats().map((item) => {
    const piece = PIECE_NAMES[board[item.square]] || '棋子';
    return `<button class="threat-chip ${item.square === detail.square ? 'active' : ''}" type="button"`
      + ` data-threat-square="${item.square}" aria-label="查看 ${coord(item.square)} ${escapeHtml(piece)} 的攻击线">`
      + `<b>${coord(item.square)} ${escapeHtml(piece)}</b> · ${item.attackers.length}攻${item.defenders.length}守</button>`;
  }).join('');
  els.attackerChips.innerHTML = detail.attackers.map((square, index) => {
    const piece = PIECE_NAMES[board[square]] || '对方棋子';
    return `<button class="attacker-chip ${square === activeThreatAttacker ? 'active' : ''}" type="button"`
      + ` data-attacker-square="${square}" aria-label="查看攻击者 ${coord(square)} 到 ${coord(detail.square)}">`
      + `<b>攻击者 ${index + 1}/${detail.attackers.length}</b> · ${escapeHtml(piece)} ${coord(square)} → ${coord(detail.square)}</button>`;
  }).join('');
}

function renderStatus() {
  const side = fenSide(currentFen);
  els.turn.dataset.side = side;
  els.turn.textContent = gameOver ? '对局结束' : thinking ? '黑方思考中' : side === 'red' ? '红方行棋' : '黑方行棋';
  els.legalCount.textContent = String(currentMoves.length);
  els.threatCount.textContent = String(threatened.size);
  els.pathCount.textContent = String(path.length);
  const previousStep = path.at(-1);
  els.lastMoveFact.textContent = previousStep
    ? `${previousStep.side === 'black' ? '黑方' : '红方'} · ${previousStep.label}`
      + ` · ${coord(moveFrom(previousStep.move))} → ${coord(moveTo(previousStep.move))}`
    : '—';
  els.undo.disabled = thinking || path.length < 2;
  els.thinkingRow.hidden = !thinking;

  const selectedMoves = legalForSelected();
  const board = boardFromFen(currentFen);
  const status = api.status(position);
  const checked = status ? !!status.inCheck : api.isCheck(position);
  const selectedThreat = threatened.get(selectedSquare);
  const hasUnguardedThreat = [...threatened.values()].some((detail) => !detail.defenders.length);
  els.coach.dataset.tone = checked || hasUnguardedThreat ? 'danger' : threatened.size ? 'watch' : 'normal';
  if (gameOver) {
    els.coach.innerHTML = `<strong>${checked ? '将军且无合法应手' : '当前一方无合法着法'}</strong>`
      + '<p>这盘棋已经结束，可以悔棋或重新开局。</p>';
  } else if (thinking) {
    els.coach.innerHTML = '<strong>黑方正在计算</strong><p>搜索在独立 Worker 中进行；棋盘保持可读，完成后一次落子。</p>';
  } else if (checked) {
    els.coach.innerHTML = `<strong>将军：必须先解围</strong><p>当前只有 ${currentMoves.length} 条真实合法应手。</p>`;
  } else if (previewLine?.reply) {
    els.coach.innerHTML = `<strong>预演：你走 ${escapeHtml(moveLabel(previewLine.move, position))}`
      + `，黑方浅层强回应 ${escapeHtml(moveLabel(previewLine.reply))}</strong>`
      + '<p>蓝色 1 → 金色 2；这是含一步合法回吃的局面排序，不是概率。点蓝色落点才会真正走棋。</p>';
  } else if (selectedSquare >= 0) {
    const piece = board[selectedSquare];
    if (selectedThreat) {
      const attackers = selectedThreat.attackers.map(coord).join('、');
      const defenders = selectedThreat.defenders.map(coord).join('、') || '无';
      els.coach.innerHTML = `<strong>${PIECE_NAMES[piece] || '棋子'}被瞄准：${selectedThreat.attackers.length} 攻 / ${selectedThreat.defenders.length} 守</strong>`
        + `<p>${escapeHtml(attackers)} → ${coord(selectedSquare)}；保护者 ${escapeHtml(defenders)}。红色攻击流只表示当前几何关系，不代表必然丢子。</p>`;
    } else {
      els.coach.innerHTML = `<strong>${PIECE_NAMES[piece] || '棋子'}有 ${selectedMoves.length} 个合法去处</strong>`
        + '<p>点绿点落子；带红圈的目标是可以立即吃到的对方棋子。</p>';
    }
  } else if (threatened.size) {
    const uncovered = [...threatened.values()].filter((detail) => !detail.defenders.length).length;
    els.coach.innerHTML = `<strong>${threatened.size} 枚棋子在对方攻击线上${uncovered ? `，其中 ${uncovered} 枚无人保护` : ''}</strong>`
      + '<p>红环是受攻位置；下方列出攻击者与保护者，可逐条切换“攻 → 危”。</p>';
  } else if (rankedBranches.length) {
    els.coach.innerHTML = `<strong>可以先看 ${escapeHtml(moveLabel(rankedBranches[0]))}</strong>`
      + '<p>这是浅层局面排序的第一候选，不是“唯一正确答案”；蓝色合法落点仍由棋核决定。</p>';
  } else {
    els.coach.innerHTML = '<strong>选择一枚红棋</strong><p>点棋子后只显示真实合法落点，右侧同时保留当前全部分叉。</p>';
  }
}

function renderTree() {
  const rootCount = snapshots[0] && snapshots[0].legalCount;
  const nodes = [
    `<span class="root-node" data-fen="${escapeHtml(snapshots[0]?.fen || api.initialFen())}"`
      + ` data-branches="${Number.isInteger(rootCount) ? rootCount : path[0]?.beforeCount ?? currentMoves.length}" data-ply="0">`
      + `<b>开局</b><small>${Number.isInteger(rootCount) ? rootCount : path[0]?.beforeCount ?? currentMoves.length} 个合法分叉</small></span>`,
  ];
  if (!path.length) {
    nodes.push('<span class="empty-path">你的选择会从这里向右生长</span>');
  } else {
    for (let index = 0; index < path.length; index++) {
      const step = path[index];
      nodes.push(`<span class="path-node ${step.side === 'black' ? 'ai-move' : ''}" data-path-index="${index}"`
        + ` data-fen="${escapeHtml(step.fen)}" data-branches="${step.afterCount}" data-ply="${index + 1}">`
        + `<b>${index + 1}. ${escapeHtml(step.label)}</b>`
        + `<small>${step.side === 'red' ? '你' : '黑方'}走后 · ${step.afterCount} 个合法分叉</small></span>`);
    }
  }
  els.pathRow.innerHTML = nodes.join('');

  if (pv.length) {
    els.pvRow.innerHTML = pv.map((step, index) =>
      `<span class="pv-node" data-pv-index="${index}" data-fen="${escapeHtml(step.after || '')}"`
      + ` data-branches="${Number.isInteger(step.branchCount) ? step.branchCount : ''}" data-ply="${path.length + index + 1}">`
      + `<b>${index + 1}. ${escapeHtml(moveLabel(step))}</b>`
      + `<small>${index % 2 === 0 ? '主线下一着' : '主线应对'} · 搜索完成层</small></span>`).join('');
  } else {
    els.pvRow.innerHTML = '<span class="pv-empty">落子后，这里会显示 Worker 完整搜索层中的主变；它不是胜率。</span>';
  }

  els.branchSummary.innerHTML = thinking
    ? '当前由黑方计算，分叉将在真实应手落盘后刷新。'
    : `这个局面共有 <b>${currentMoves.length}</b> 条合法分叉。点卡片预演，再点棋盘蓝色落点确认。`;
  if (thinking) {
    els.branchGrid.replaceChildren();
  } else {
    const board = boardFromFen(currentFen);
    const rankMap = new Map(rankedBranches.map((move, index) => [
      `${moveFrom(move)}-${moveTo(move)}`, { move, rank: index },
    ]));
    const visibleMoves = currentMoves.slice().sort((a, b) =>
      (rankMap.get(`${moveFrom(a)}-${moveTo(a)}`)?.rank ?? 999)
      - (rankMap.get(`${moveFrom(b)}-${moveTo(b)}`)?.rank ?? 999));
    els.branchGrid.innerHTML = visibleMoves.map((move, index) => {
      const target = board[moveTo(move)];
      const ranked = rankMap.get(`${moveFrom(move)}-${moveTo(move)}`)?.move;
      const replyLabel = ranked?.reply ? escapeHtml(moveLabel(ranked.reply)) : '无合法应手';
      const copy = index === 0 && ranked
        ? `当前建议 · 回应 ${replyLabel}`
        : ranked
          ? `回应 ${replyLabel} · ${ranked.replyCount} 应手`
          : target
            ? `可吃 ${escapeHtml(PIECE_NAMES[target] || target)}`
            : `${coord(moveFrom(move))} 到 ${coord(moveTo(move))}`;
      return `<button class="branch-node ${target ? 'capture' : ''} ${index === 0 && ranked ? 'suggested' : ''}"`
        + ` type="button" data-from="${moveFrom(move)}" data-to="${moveTo(move)}"`
        + ` data-reply-from="${ranked?.reply ? moveFrom(ranked.reply) : ''}"`
        + ` data-reply-to="${ranked?.reply ? moveTo(ranked.reply) : ''}"`
        + ` data-fen="${escapeHtml(ranked?.after || '')}" data-branches="${ranked?.replyCount ?? ''}" data-ply="${path.length + 1}">`
        + `<b>${escapeHtml(ranked ? moveLabel(ranked) : moveLabel(move, position))}</b>`
        + `<small>${copy}</small></button>`;
    }).join('');
  }
  els.branchGrid.querySelectorAll('[data-from][data-to]').forEach((button) => {
    button.addEventListener('click', () => {
      const move = currentMoves.find((candidate) =>
        moveFrom(candidate) === Number(button.dataset.from)
        && moveTo(candidate) === Number(button.dataset.to));
      const ranked = rankedBranches.find((candidate) => sameMove(candidate, move));
      focusMove(move, ranked);
    });
  });
}

function render() {
  renderBoard();
  renderLastMoveOverlay();
  renderThreatOverlay();
  renderThreatStrip();
  renderStatus();
  renderTree();
}

function focusMove(move, ranked = null) {
  if (!move || thinking || gameOver) return;
  selectedSquare = moveFrom(move);
  previewLine = {
    move: ranked || move,
    reply: ranked?.reply || null,
  };
  render();
  els.board.querySelector(`[data-square="${moveTo(move)}"]`)?.focus({ preventScroll: true });
}

function handleSquare(square) {
  if (thinking || gameOver) return;
  const board = boardFromFen(currentFen);
  const targetMove = legalForSelected().find((move) => moveTo(move) === square);
  if (targetMove) {
    play(targetMove, 'red');
    return;
  }
  if (sideOwns(board[square], fenSide(currentFen))) {
    selectedSquare = selectedSquare === square ? -1 : square;
  } else {
    selectedSquare = -1;
  }
  activeThreatAttacker = -1;
  previewLine = null;
  render();
}

function applyOn(positionBefore, move) {
  const fenBefore = api.toFen(positionBefore);
  const legalMove = api.legalMoves(positionBefore).find((candidate) => sameMove(candidate, move));
  if (!legalMove) throw new Error(`引擎拒绝非法着法 ${moveLabel(move)}`);
  const next = api.applyMove(positionBefore, legalMove);
  const afterFen = api.toFen(next);
  if (!afterFen || afterFen === fenBefore) throw new Error('applyMove 没有产生新局面');
  return { position: next, move: legalMove, fen: afterFen };
}

function play(move, actor) {
  const beforeCount = currentMoves.length;
  const label = moveLabel(move, position);
  const result = applyOn(position, move);
  position = result.position;
  currentFen = result.fen;
  currentMoves = api.legalMoves(position);
  const step = {
    move: result.move,
    label,
    side: actor,
    beforeCount,
    afterCount: currentMoves.length,
    fen: currentFen,
  };
  path.push(step);
  snapshots.push({ fen: currentFen, pathLength: path.length, legalCount: currentMoves.length });
  selectedSquare = -1;
  previewLine = null;
  lastMove = result.move;
  activeThreatAttacker = -1;
  pendingMoveAnimation = Object.freeze({
    move: result.move,
    fen: currentFen,
    key: `${path.length}|${currentFen}|${moveFrom(result.move)}|${moveTo(result.move)}`,
  });
  pv = [];
  rankedBranches = [];
  refreshThreatened(currentFen);
  gameOver = currentMoves.length === 0;
  render();
  if (!gameOver && fenSide(currentFen) === 'black') requestAiMove();
  else if (!gameOver && actor === 'black') requestBranches();
}

function makeSearchWorker() {
  if (searchWorker) searchWorker.terminate();
  const worker = new Worker('./xiangqi-worker.js', { type: 'module' });
  searchWorker = worker;
  worker.addEventListener('message', onWorkerMessage);
  worker.addEventListener('error', () => fallbackAi('Worker 载入失败'));
  worker.addEventListener('messageerror', () => fallbackAi('Worker 通信失败'));
  worker.postMessage({ type: 'ping' });
  return worker;
}

function makeBranchWorker() {
  if (branchWorker) branchWorker.terminate();
  const worker = new Worker('./xiangqi-worker.js', { type: 'module' });
  branchWorker = worker;
  worker.addEventListener('message', onWorkerMessage);
  worker.addEventListener('error', () => {
    rankedBranches = [];
    render();
  });
  worker.addEventListener('messageerror', () => {
    rankedBranches = [];
    render();
  });
  worker.postMessage({ type: 'ping' });
  return worker;
}

function requestAiMove() {
  if (thinking || gameOver) return;
  thinking = true;
  const id = ++requestId;
  const fen = currentFen;
  els.searchFact.textContent = '计算中';
  render();
  if (!searchWorker) makeSearchWorker();
  searchWorker.postMessage({ type: 'search', id, fen, timeMs: 1100, timeBudgetMs: 1100, maxDepth: 5 });
  window.setTimeout(() => {
    if (thinking && id === requestId && currentFen === fen) fallbackAi('搜索超时');
  }, 2800);
}

function requestBranches() {
  if (thinking || gameOver || fenSide(currentFen) !== 'red') return;
  if (!branchWorker) makeBranchWorker();
  const id = ++branchRequestId;
  branchRequestFen = currentFen;
  branchWorker.postMessage({ type: 'branches', id, fen: currentFen });
}

function resultMove(result) {
  return result && (result.move || result.bestMove || result.best);
}
function resultPv(result) {
  return Array.isArray(result && result.pv) ? result.pv : [];
}
function onWorkerMessage(event) {
  const message = event.data || {};
  if (message.type === 'pong') return;
  if (message.type === 'branchesDone') {
    if (Number(message.id) !== branchRequestId || currentFen !== branchRequestFen || thinking) return;
    rankedBranches = Array.isArray(message.result?.branches) ? message.result.branches : [];
    render();
    return;
  }
  if (message.type === 'branchesError') return;
  const payload = message.result || message;
  if (!thinking || Number(message.id ?? payload.id) !== requestId) return;
  if (message.type === 'searchError' || message.type === 'error') {
    fallbackAi(message.message || '搜索出错');
    return;
  }
  if (!['result', 'searchDone', 'searchResult'].includes(message.type) && !resultMove(payload)) return;
  const move = resultMove(payload);
  const legalMove = currentMoves.find((candidate) => sameMove(candidate, move));
  if (!legalMove) {
    fallbackAi('搜索返回了非当前局面的着法');
    return;
  }
  pv = validatePv(currentFen, resultPv(payload));
  thinking = false;
  lastSearchMs = Number(payload.ms) || 0;
  lastSearchDepth = Number(payload.depth) || 0;
  els.searchFact.textContent = `${advantageText(payload.score)} · ${payload.depth || 0} 层`;
  play(legalMove, 'black');
  // play 会在落盘时清空旧局面的 PV；保留黑方搜索给出的后续主线。
  pv = validatePv(currentFen, resultPv(payload).slice(1));
  render();
}

function advantageText(score) {
  const value = Number(score);
  if (!Number.isFinite(value) || Math.abs(value) < 45) return '局势接近';
  if (value >= 600) return '红方明显主动';
  if (value >= 45) return '红方稍主动';
  if (value <= -600) return '黑方明显主动';
  return '黑方稍主动';
}

function validatePv(sourceFen, candidatePv) {
  if (!Array.isArray(candidatePv) || !candidatePv.length) return [];
  let replay;
  try { replay = api.parseFen(sourceFen); } catch { return []; }
  const clean = [];
  for (const raw of candidatePv.slice(0, 8)) {
    const legalMove = api.legalMoves(replay).find((candidate) => sameMove(candidate, raw));
    if (!legalMove) break;
    const notation = moveLabel(raw, replay);
    replay = api.applyMove(replay, legalMove);
    clean.push({
      ...legalMove,
      notation,
      after: api.toFen(replay),
      branchCount: api.legalMoves(replay).length,
    });
  }
  return clean;
}

function fallbackAi(reason) {
  if (!thinking) return;
  thinking = false;
  makeSearchWorker();
  const legalMove = currentMoves[0];
  els.searchFact.textContent = reason;
  if (legalMove) play(legalMove, 'black');
  else render();
}

function resetGame() {
  requestId++;
  thinking = false;
  selectedSquare = -1;
  previewLine = null;
  lastMove = null;
  activeThreatAttacker = -1;
  pendingMoveAnimation = null;
  lastMoveOverlayKey = '';
  path = [];
  pv = [];
  currentFen = api.initialFen();
  position = api.parseFen(currentFen);
  currentFen = api.toFen(position);
  currentMoves = api.legalMoves(position);
  refreshThreatened(currentFen);
  gameOver = currentMoves.length === 0;
  snapshots = [{ fen: currentFen, pathLength: 0, legalCount: currentMoves.length }];
  rankedBranches = [];
  lastSearchMs = 0;
  lastSearchDepth = 0;
  els.searchFact.textContent = '待命';
  makeSearchWorker();
  makeBranchWorker();
  render();
  requestBranches();
}

function undoRound() {
  if (thinking || path.length < 2) return;
  requestId++;
  path = path.slice(0, -2);
  snapshots = snapshots.slice(0, -2);
  const snapshot = snapshots.at(-1);
  currentFen = snapshot.fen;
  position = api.parseFen(currentFen);
  currentFen = api.toFen(position);
  currentMoves = api.legalMoves(position);
  refreshThreatened(currentFen);
  selectedSquare = -1;
  previewLine = null;
  lastMove = path.at(-1)?.move || null;
  activeThreatAttacker = -1;
  pendingMoveAnimation = null;
  lastMoveOverlayKey = '';
  pv = [];
  rankedBranches = [];
  gameOver = currentMoves.length === 0;
  els.searchFact.textContent = '已撤回';
  render();
  requestBranches();
}

function setZoom(next) {
  zoom = Math.max(.72, Math.min(1.55, next));
  els.treeCanvas.style.zoom = String(zoom);
  els.zoomReset.textContent = `${Math.round(zoom * 100)}%`;
}

els.undo.addEventListener('click', undoRound);
els.reset.addEventListener('click', resetGame);
els.zoomOut.addEventListener('click', () => setZoom(zoom - .12));
els.zoomIn.addEventListener('click', () => setZoom(zoom + .12));
els.zoomReset.addEventListener('click', () => setZoom(1));
els.threatChips.addEventListener('click', (event) => {
  const button = event.target.closest('[data-threat-square]');
  if (!button || thinking || gameOver) return;
  const square = Number(button.dataset.threatSquare);
  if (!threatened.has(square)) return;
  selectedSquare = square;
  activeThreatAttacker = -1;
  previewLine = null;
  render();
  els.board.querySelector(`[data-square="${square}"]`)?.focus({ preventScroll: true });
});
els.attackerChips.addEventListener('click', (event) => {
  const button = event.target.closest('[data-attacker-square]');
  if (!button || thinking || gameOver) return;
  const detail = focusedThreat();
  const attacker = Number(button.dataset.attackerSquare);
  if (!detail?.attackers.includes(attacker)) return;
  activeThreatAttacker = attacker;
  threatOverlayKey = '';
  render();
});
els.board.addEventListener('animationend', (event) => {
  if (!(event.target instanceof Element)) return;
  if (event.target.classList.contains('just-moved') && event.animationName === 'piece-arrive') {
    event.target.classList.remove('just-moved');
    delete event.target.dataset.motionRole;
    event.target.style.removeProperty('--move-dx');
    event.target.style.removeProperty('--move-dy');
    pendingMoveAnimation = null;
    return;
  }
  if (!event.target.classList.contains('threat-ring')
    || event.animationName !== 'threat-ring-pulse') return;
  const squareEl = event.target.closest('.square');
  const square = Number(squareEl?.dataset.square);
  if (Number.isInteger(square)) threatPulseSquares.delete(square);
  squareEl?.classList.remove('threat-new');
});

createBoardSquares();
resetGame();

function loadFenForTest(fen) {
  requestId++;
  branchRequestId++;
  thinking = false;
  selectedSquare = -1;
  previewLine = null;
  lastMove = null;
  activeThreatAttacker = -1;
  pendingMoveAnimation = null;
  lastMoveOverlayKey = '';
  path = [];
  pv = [];
  rankedBranches = [];
  position = api.parseFen(fen);
  currentFen = api.toFen(position);
  currentMoves = api.legalMoves(position);
  refreshThreatened(currentFen);
  gameOver = currentMoves.length === 0;
  snapshots = [{ fen: currentFen, pathLength: 0, legalCount: currentMoves.length }];
  els.searchFact.textContent = '测试局面';
  render();
  requestBranches();
  return currentFen;
}

function tryMoveForTest(from, to) {
  if (thinking || gameOver) return false;
  const wanted = { from, to };
  const move = currentMoves.find((candidate) => sameMove(candidate, wanted));
  if (!move) return false;
  play(move, fenSide(currentFen));
  return true;
}

function killWorkerForTest() {
  if (searchWorker) searchWorker.terminate();
  searchWorker = null;
  if (thinking) fallbackAi('测试终止 Worker');
  return true;
}

const testHook = {};
Object.defineProperties(testHook, {
  fen: { enumerable: true, get: () => currentFen },
  side: { enumerable: true, get: () => fenSide(currentFen) },
  legalMoveCount: { enumerable: true, get: () => currentMoves.length },
  renderedPieceCount: { enumerable: true, get: () => els.board.querySelectorAll('.piece').length },
  renderedBranchCount: { enumerable: true, get: () => els.branchGrid.querySelectorAll('.branch-node').length },
  threatenedPieceCount: { enumerable: true, get: () => els.board.querySelectorAll('.threatened .piece').length },
  pathLength: { enumerable: true, get: () => path.length },
  thinking: { enumerable: true, get: () => thinking },
  pvLength: { enumerable: true, get: () => pv.length },
  zoom: { enumerable: true, get: () => zoom },
  state: {
    enumerable: true,
    get: () => Object.freeze({
      fen: currentFen,
      side: fenSide(currentFen),
      legalMoveCount: currentMoves.length,
      selectedSquare: selectedSquare < 0 ? null : coord(selectedSquare),
      thinking,
      gameOver,
      pathLength: path.length,
    }),
  },
  board: {
    enumerable: true,
    get: () => Object.freeze(boardFromFen(currentFen).flatMap((piece, square) => piece
      ? [Object.freeze({
        square: coord(square),
        side: pieceIsRed(piece) ? 'red' : 'black',
        piece: piece.toLowerCase(),
      })]
      : [])),
  },
  tree: {
    enumerable: true,
    get: () => Object.freeze({
      path: Object.freeze(path.map((step, index) => Object.freeze({
        ply: index + 1, fen: step.fen, branches: step.afterCount, label: step.label, side: step.side,
      }))),
      pv: Object.freeze(pv.map((step, index) => Object.freeze({
        ply: path.length + index + 1,
        fen: step.after || '',
        branches: step.branchCount ?? null,
        label: moveLabel(step),
      }))),
      renderedBranches: els.branchGrid.querySelectorAll('.branch-node').length,
    }),
  },
  threats: {
    enumerable: true,
    get: () => Object.freeze([...threatened.keys()].map(coord)),
  },
  performance: {
    enumerable: true,
    get: () => Object.freeze({
      aiPending: thinking,
      lastSearchMs,
      lastSearchDepth,
      workerBudgetMs: 1100,
      watchdogMs: 2800,
      continuousAnimation: false,
    }),
  },
});
testHook.reset = resetGame;
testHook.loadFen = loadFenForTest;
testHook.tryMove = tryMoveForTest;
testHook.killWorker = killWorkerForTest;
testHook.snapshot = () => Object.freeze({
  fen: currentFen,
  side: fenSide(currentFen),
  legalMoveCount: currentMoves.length,
  renderedPieceCount: els.board.querySelectorAll('.piece').length,
  renderedBranchCount: els.branchGrid.querySelectorAll('.branch-node').length,
  threatenedPieceCount: els.board.querySelectorAll('.threatened .piece').length,
  path: Object.freeze(path.map((step) => Object.freeze({
    label: step.label, side: step.side, afterCount: step.afterCount,
  }))),
  thinking,
  pvLength: pv.length,
});
Object.freeze(testHook);
Object.defineProperty(window, '__xiangqiTest', {
  value: testHook, enumerable: false, configurable: false, writable: false,
});
</script>
